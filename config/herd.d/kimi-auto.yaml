# herd (--config-dir) fragment: kimi-auto virtual model.
#
# ROUTER CONFIG -- model selection lives HERE, in this file.
# Chris's rule (2026-09-20): Kimi-named tooling never selects models;
# routers are separate from model-specific code. No resolver, no timers,
# no probing, no family preference -- this fragment declares the route
# and herd --watch-config reloads it event-driven on save.
#
# kimi-auto is a fixed alias forwarder (alias-shim.py; ne cuckoo.py v3, renamed):
#   --target     primary model served behind the alias (set below)
#   --standby    ordered failover chain, repeatable (set below)
#   --advance-on chain-advancing signals (set below)
# To change what kimi-auto serves, edit these flags. Nothing else to touch.
#
# Kimi-only doctrine (AGENTS.md, Chris 2026-09-20): kimi-auto is Kimi-only.
# Honest 503/429 when no Kimi route is healthy; never a silent non-Kimi
# fallback.
#
# CHRIS DOCTRINE 2026-09-21 (ember-kimi-route): Kimi routes are NEVER
# defaults; their sole purpose is routing Kimi FREE models maximally.
# This fragment declares the maximal free-Kimi chain: all four OpenRouter
# free Kimi variants (K3 / K2.6 / K2.5 / code order) then HF Inference
# Providers Kimi-K3. The shim advances past 5xx/conn/429/402/404
# (free-tier rotation, throttle, depleted credits are expected transients);
# 401 never advances. Paid Kimi (moonshot direct, 429 billing-suspended;
# openrouter-pool, 402 insufficient-credits) is deliberately NOT in this
# chain -- free only. When any free Kimi route recovers, it serves here
# with no code change.
#
# History: toxicwind/kimi-auto repo (herd.d/kimi-auto.yaml).
# This live copy is what herd --config-dir reads.
# MUST match the pitchfork kimi-auto-shim run line (port 25153).
models:
  kimi-auto:
    cmd: python3 /home/toxic/estate/config/herd.d/alias-shim.py --port ${PORT} --target openrouter-free/moonshotai/kimi-k3:free --standby openrouter-free/moonshotai/kimi-k2.6:free --standby openrouter-free/moonshotai/kimi-k2.5:free --standby openrouter-free/moonshotai/kimi-k2.7-code:free --standby hf-free/moonshotai/Kimi-K3 --standby nim-kimi/moonshotai/kimi-k3 --advance-on 5xx,conn,429,402,404 --name kimi-auto
    description: "kimi-auto: maximal free-Kimi chain (openrouter-free :free IDs -> hf-free Kimi-K3 -> nim-kimi genuine K3 via NVIDIA NIM, cold-aware ~120s)"
    metadata:
      alias_of: openrouter-free/moonshotai/kimi-k3:free
      chain: free-kimi-maximal
      selection: router-config
      repo: toxicwind/kimi-auto

