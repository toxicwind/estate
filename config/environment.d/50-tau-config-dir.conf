# Pin the tau/omp config root for the whole user session.
#
# PI_CONFIG_DIR is a NAME relative to $HOME, never an absolute path. The engine
# resolves it with path.join(os.homedir(), PI_CONFIG_DIR) at
# pi-utils/src/dirs.ts:112, so an absolute value produces $HOME/$HOME/.tau —
# a shadow config root that on this box silently captured the daemon broker
# socket, the logs and the run directory from 2026-09-20 until 2026-10-02.
#
# This lives in environment.d rather than only in .profile/.bashrc.env because
# those only run for login shells. Without a pin here the systemd user manager
# snapshots whatever the login session happened to have, and every process
# started from the graphical session (terminal, editor, daemons) inherits that
# snapshot regardless of what the shell rc files now say.
PI_CONFIG_DIR=.tau
PI_CODING_AGENT_DIR=/home/toxic/.tau/agent