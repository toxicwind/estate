category = "productivity"
icon = "💻"

tools = ["web_search", "web_fetch", "ghas_github_search", "memory_store", "memory_recall", "schedule_create", "file_write", "file_read", "browser_read_page"]

mcp_servers = ["ghas", "sovereign-playwright-fork", "openfang"]

