schema_version: 2
# force working model everywhere — no fallback thrashing
model: rhodochrosite/openai/gpt-oss-20b
smol_model: rhodochrosite/openai/gpt-oss-20b
slow_model: rhodochrosite/openai/gpt-oss-20b
plan_model: rhodochrosite/openai/gpt-oss-20b
# limit Ctrl+P cycling to 3 LIVE models only, not 176 catalog
models: ["rhodochrosite/openai/gpt-oss-20b", "rhodochrosite/openai/gpt-oss-20b", "gemini/gemini-3.5-flash"]
# disable discoverable catalog that causes extreme dump
discover:
  custom_models: true
  discoverable_models: false
  cached_standard_models: false
provider:
  bornite:
    base_url: http://127.0.0.1:25193/v1
    api_key: bornite-local-key
    timeout_ms: 8000
