retry:
  maxRetries: 3
  maxDelayMs: 300000
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: confirm
  fallbackChains:
    # Every free model here answered HTTP 200 in under 2.5s on 2026-09-27. All
    # :free models share one per-key rate limit, so a throttle usually hits
    # several at once — but rotating still beats backing off on a model that is
    # not coming back, and it is what keeps a stalled turn from going silent
    # for 90s+ (maxDelayMs is a fail-fast cap the engine only sleeps past when
    # there is no chain to rotate into).
    openrouter/*:
    - openrouter/liquid/lfm-2.5-2.6b:free
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/inclusionai/ling-3.0-flash-fin:free
    # sovereign/free (:25104) and herd/qwen-flash-da-128k (:25100) are both
    # down — herd's dependency gatehouse aborts startup on a missing
    # projects/range/ranch/barn/shep/bin/github-mcp.sh. These two are verified
    # 200 against openrouter and restore the chain's whole point.
    google-antigravity/*:
    - openrouter/inclusionai/ling-3.0-flash-fin:free
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    # Live web providers first. The four chat models that used to sit directly
    # after web/perplexity all 402 (no credits) or 400 (`claude-haiku-4-5` is
    # not a valid id), so every fallback burned a doomed attempt before
    # reaching the next working provider. They are kept, and kept last, per
    # the standing rule against removing models: an unreachable last resort is
    # better than a hot path that cannot fail forward.
    web:
    - web/perplexity
    - web/zai
    - web/tinyfish
    - web/jina
    - web/kagi
    - web/tavily
    - web/firecrawl
    - web/brave
    - web/kimi
    - web/parallel
    - web/synthetic
    - web/searxng
    - web/startpage
    - web/duckduckgo
    - web/ecosia
    - web/google
    - web/mojeek
    - web/public
    - web/ollama
    - google/gemini-2.5-flash
    - anthropic/claude-haiku-4-5
    - openai-codex/gpt-5.6-luna
    - openai-codex/gpt-5.6
    - openai-codex/gpt-5.5
    - xai/grok-4.5
    - xai-oauth/grok-4.5
    - google-antigravity/gemini-2.5-flash
