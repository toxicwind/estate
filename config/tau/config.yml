modelRoles:
  # Verified live against openrouter.ai/api/v1 on 2026-09-27.
  # The previous default, google-antigravity/gemini-3.8-flash:high, answers
  # 402 "Insufficient credits", so every untargeted turn and every subagent
  # dispatch failed before reaching a model at all.
  default: openrouter/nvidia/nemotron-3.5-lightning:free
  # smol was never defined here, but two things reference it: cycleOrder is
  # [smol, default, slow], and the skill-description compressor resolves the
  # "smol" role (skill-descriptions.ts:30). With it undefined, resolution fell
  # through to priority.json's MODEL_PRIO.smol, whose first entry is
  # google-antigravity/gemini-3.8-flash. That answers 402, and the compressor
  # runs once per skill at startup, so every session opened made ~100 failing
  # model calls and could not exit until they drained. 2.6B, 200 in 0.33s.
  smol: openrouter/liquid/lfm-2.5-2.6b:free
  # slow was undefined too, and cycleOrder is [smol, default, slow]. Undefined
  # roles fall through to priority.json's MODEL_PRIO.slow, whose first entry is
  # anthropic/claude-opus-5-5. With no working anthropic credential every turn
  # ended "agent turn ended with provider error: Connection error." on the
  # largest model in the free tier, verified 200.
  slow: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  # The other 9 chat roles were undefined too. An undefined role falls through
  # to priority.json's MODEL_PRIO.<role>, and every entry in those lists is a
  # paid model from a provider this account has no working credential for, so
  # every one of them ended in a provider error. All verified 200.
  vision: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  plan: openrouter/nvidia/nemotron-3-super-120b-a12b:free
  advisor: openrouter/nvidia/nemotron-3-super-120b-a12b:free
  judge: openrouter/nvidia/nemotron-3-super-120b-a12b:free
  task: openrouter/nvidia/nemotron-3.5-lightning:free
  commit: openrouter/liquid/lfm-2.5-2.6b:free
  tiny: openrouter/liquid/lfm-2.5-2.6b:free
  memory: openrouter/liquid/lfm-2.5-2.6b:free
  verification: openrouter/nvidia/nemotron-3.5-lightning:free
  # ling-3.0-flash-vl:free is gone upstream — 404 "unavailable for free. The
  # paid version is available now". This one answers 200.
  fallback: openrouter/inclusionai/ling-3.0-flash-fin:free
  web: web/exa
  # image, speech and dictation are deliberately left unset. The free tier has
  # no image-output and no audio model at all (checked against the live
  # catalog: 17 free models, 8 accept image input, 0 emit image, 0 touch audio),
  # so there is no honest free mapping. Leaving them unset keeps them falling
  # through to the paid priority list, which fails loudly rather than routing
  # image generation to a text model.
subagents:
  can_spawn_subagents: true
  whitelist:
  - task
  - plan
  - review
  - auditor
  - critic
  - explorer
  - analyst
  - debugger
  # Was sovereign/free — provider baseUrl http://127.0.0.1:25104/v1, which has
  # no daemon in pitchfork.toml at all and nothing listening. Every subagent
  # dispatch resolved to a dead endpoint. Same live default as modelRoles.
  defaultModel: openrouter/nvidia/nemotron-3.5-lightning:free
  subagent: inherit
