defaultThinkingLevel: auto
modelRoles:
  judge: openrouter/~typesafe/jev-latest
  tiny: local/lfm2.5-230m
  advisor: zen/space-bunny-free
  default: google-antigravity/claude-opus-5-5-low
  fallbacks:
    - vercel-ai-gateway/inclusionai/ling-3.1-flash:medium
    - vercel-ai-gateway/inclusionai/ling-3.0-flash-sante:medium
symbolPreset: unicode
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 2
dev:
  autoqaConsent: denied
contextPromotion:
  enabled: false
extendedContext: false
steeringMode: all
followUpMode: all
interruptMode: wait
features:
  unexpectedStopDetection: smart
memory:
  backend: local
hindsight:
  apiUrl: http://localhost:25287
edit:
  mode: hashline
  blockAutoGenerated: false
  blackbox:
    enabled: true
  autoRepair:
    enabled: true
  enforceSeenLines: false
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
  defaultLimit: 5000
lsp:
  diagnosticsOnEdit: true
bash:
  allowCompoundCommands: false
  direnv: "off"
shellMinimizer:
  sourceOutlineLevel: aggressive
  enabled: false
eval:
  autoBackground:
    enabled: true
  js: false
  autoProvision: false
python:
  kernelMode: session
astGrep:
  enabled: true
computer:
  enabled: true
generate_image:
  enabled: true
checkpoint:
  enabled: true
vault:
  enabled: true
github:
  enabled: true
tools:
  abortOnFabricatedResult: false
  speculativeExecution:
    enabled: true
  xdevDocs: catalog
  intentTracing: false
  artifactSpillThreshold: 1000
  artifactTailBytes: 200
  artifactHeadBytes: 100
  outputMaxColumns: 2048
  artifactTailLines: 2000
mcp:
  notifications: true
task:
  enableEffort: true
  maxConcurrency: 4
  enableLsp: true
  isolation:
    merge: branch
  eager: default
  batch: false
worktree:
  clone: false
snapcompact:
  toolResults: false
  systemPrompt: none
extensions:
  - pi-omniroute-sync
  - gwern
providers:
  omni:
    baseUrl: http://127.0.0.1:20130/v1
    api: openai-responses
    auth: none
    refreshModels: true
    autoSyncIntervalMs: 300000
  openai-codex:
    codeMode: "off"
  openrouterVariant: default
tier:
  subagent: auto
advisor:
  enabled: true
  syncBacklog: "1"
grep:
  enabled: true
glob:
  enabled: true
find:
  enabled: "off"
temperature: -1
textVerbosity: low
inlineToolDescriptors: auto
skillful: false
personality: pragmatic
retry:
  fallbackChains:
    {}
  usageAwareFallback: true
  modelFallback: true
  maxRetries: 10
ttsr:
  contextMode: keep
  judge: "off"
  interruptMode: never
  enabled: true
  repeatMode: after-gap
  repeatGap: 30
  builtinRules: false
proseOnlyThinking: false
omitThinking: true
topP: -1
topK: -1
minP: -1
modelRoleStorage: global
commands:
  enableClaudeUser: true
  enableOpencodeUser: true
provider:
  appendOnlyContext: auto
browser:
  cmux: false
disabledExtensions:
  - airspeak