# Tau custom models: Cuttinggate is the sole configured provider.
# OMP openai-models-list discovery reads {baseUrl}/models; models.yml does not support SSE subscriptions.
providers:
  cuttinggate:
    baseUrl: http://127.0.0.1:25200/v1
    api: openai-completions
    apiKey: local-cuttinggate
    auth: apiKey
    discovery:
      type: openai-models-list
