#!/usr/sbin/nft -f
# awrawr-pc baseline firewall — network audit 2026-10-15
# NOTE: deliberately NO `flush ruleset` — dockerd and tailscaled own their own
# tables (ip filter/nat with DOCKER-*/ts-* chains). Flushing would destroy
# docker-published ports and tailscale netfilter until restart. This file only
# adds the awrawr_filter table; safe to re-run at any time.
# Tailscale's ts-input/ts-forward hooks (priority -10, policy accept) run
# BEFORE this table, so tailnet traffic tailscale accepts stays accepted.

table inet awrawr_filter {
	chain input {
		type filter hook input priority 0; policy drop;

		# Loopback + existing connections
		iifname "lo" accept
		ct state established,related accept
		ct state invalid drop

		# ICMP / ICMPv6 diagnostics (incl. IPv6 neighbor discovery)
		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept

		# Tailscale data plane: WireGuard UDP (any source, direct connect)
		udp dport 41641 accept

		# Full access from the tailnet (covers RustDesk 25220-25224, SSH, all 25xxx)
		iifname "tailscale0" accept
		iifname "tsd" accept

		# LAN: SSH, Caddy/UI ports, local DNS (dnsmasq on this host), syncthing
		ip saddr 10.0.0.0/24 tcp dport { 22, 3000, 3001, 8503, 25100-25107, 25203 } accept
		ip saddr 10.0.0.0/24 udp dport { 53, 22000, 41641 } accept
		ip saddr 10.0.0.0/24 tcp dport { 53, 22000 } accept

		# Everything else (public internet, LAN to internal 25xxx, RustDesk on LAN) drops
		log prefix "nft-drop: " limit rate 5/second
		drop
	}

	chain forward {
		type filter hook forward priority 0; policy accept;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
