# OpenFang kernel config — CANONICAL (2026-09-21 full audit).
# - This file configures the ONE kernel: pitchfork daemons.openfang ->
#   ops/openfang-run.sh -> rig-work debug binary, api_listen :25196
#   (OPENFANG_KERNEL_PORT). Serves dashboard UI + /v1 (OpenAI-compat) + /api.
# - :25103 (OPENFANG_PORT) is the mesh-front proxy (daemons.openfang-front).
# - :25203 RETIRED 2026-09-21 (duplicate kernel sharing this DB removed).
# - :4200 RETIRED (legacy; old config kept at config/deprecated/openfang-4200.toml).
# - Home dir /home/toxic/.openfang holds the SQLite DB, triggers, agents.
api_listen = "127.0.0.1:25196"

[memory]
# Embeddings: yote on-box hardware (RTX 3090), NOT external GPU APIs.
# Chris 2026-09-29: no external GPU (NIM API, GPU clouds) for embeddings;
# use yote's own iron. yote-embed daemon (:25200) serves nomic-embed-text-v1.5.
# (embedding_model intentionally unset: the kernel maps the "all-MiniLM-L6-v2"
# default to nomic-embed-text for provider "yote". No API key: yote-local.)
embedding_provider = "yote"

# Default model route for auto-spawned agents (2026-09-21 full audit).
# The kernel OVERWRITES the auto-spawned "assistant" manifest from
# config.default_model on EVERY boot (kernel.rs "Apply default_model to
# restored agents"). Without this section the compiled default
# (anthropic/claude-sonnet-4-20250514) clobbers the disk agent.toml route
# and the assistant 500s on a revoked ANTHROPIC_API_KEY.
# anthropic/claude-sonnet-4-20250514 PARKED 2026-09-20: stored
# ANTHROPIC_API_KEY revoked (Anthropic 401). Restore provider="anthropic",
# model="claude-sonnet-4-20250514", api_key_env="ANTHROPIC_API_KEY" once
# Chris supplies a fresh key. Until then the herd-free route serves.
[default_model]
provider = "llama-swap"
model = "nex-agi/nex-n2.5-mini:free"
api_key_env = ""
base_url = "http://127.0.0.1:25100/v1"
