# OpenFang kernel config — CANONICAL (2026-09-21 full audit).
# - This file configures the ONE kernel: pitchfork daemons.openfang ->
#   ops/openfang-run.sh -> rig-work debug binary, api_listen :25196
#   (OPENFANG_KERNEL_PORT). Serves dashboard UI + /v1 (OpenAI-compat) + /api.
# - :25103 (OPENFANG_PORT) is the mesh-front proxy (daemons.openfang-front).
# - :25203 RETIRED 2026-09-21 (duplicate kernel sharing this DB removed).
# - :4200 RETIRED (legacy; old config kept at config/deprecated/openfang-4200.toml).
# - Home dir /home/toxic/.openfang holds the SQLite DB, triggers, agents.
api_listen = "127.0.0.1:25196"

[memory]
# Embeddings: explicit provider. Auto-detect previously chose groq (GROQ_API_KEY
# is set) but Groq exposes no embedding endpoint, so every memory_store /
# memory_recall embedding 401'd and silently fell back to text search.
# mistral-embed via MISTRAL_API_KEY verified alive 2026-09-21. (embedding_model
# intentionally unset: the kernel maps the "all-MiniLM-L6-v2" default to
# mistral-embed for provider "mistral".)
embedding_provider = "mistral"
embedding_api_key_env = "MISTRAL_API_KEY"
