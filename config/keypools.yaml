pools:
  openrouter-free:
    upstream: https://openrouter.ai/api
    health:
      method: GET
      path: /v1/auth/key
      ok: [200]
    fail_status: [401, 402, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      401: 300
      402: 300
      429: 60
      default: 120
    keys:
      - {name: OPENROUTER_API_KEY_FREE, free_only: true}
      - OPENROUTER_API_KEY_1

  openrouter-paid:
    upstream: https://openrouter.ai/api
    health:
      method: GET
      path: /v1/auth/key
      ok: [200]
    fail_status: [401, 402, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      401: 300
      402: 300
      429: 60
      default: 120
    keys:
      - OPENROUTER_API_KEY
      - OPENROUTER_API_KEY_1

  # --- gemini-eap-interactions: EAP Interactions API (tool_search,
  # defer_loading, mcp_server). protocol: gemini-interactions tells the
  # keypool to rewrite OpenAI bodies to {"model","input","tools"} and hit
  # /v1beta/interactions instead of /v1/chat/completions.
  gemini-eap-interactions:
    protocol: gemini-interactions
    interactions_path: /v1beta/interactions
    upstream: https://generativelanguage.googleapis.com
    health:
      method: GET
      path: /v1beta/models
      ok: [200]
    fail_status: [400, 401, 402, 403, 404, 429]
    probe_timeout: 5
    request_timeout: 300
    cooldown:
      400: 60
      401: 300
      402: 300
      403: 300
      404: 10
      429: 60
      default: 120
    # EAP is a project-level entitlement, not a key property. Verified
    # 2026-10-02 with @google/genai against every credential on the box:
    # only these six, all minted on gen-lang-client-0111199472
    # (654595778272), return `completed` on /v1beta/interactions and run the
    # full tool_search_call > tool_search_result > function_call loop.
    # Every other Google key 401s, including the GEMINI_API_KEY* family and
    # the GEMINI_API_KEY_2 that .secrets.json still flagged eap=1.
    keys:
      - GEMINI_EAP_KEY_1
      - GEMINI_EAP_KEY_2
      - GEMINI_EAP_KEY_3
      - GEMINI_EAP_KEY_4
      - GEMINI_EAP_KEY_5
      - GEMINI_EAP_KEY_6
  gemini:
    upstream: https://generativelanguage.googleapis.com/v1beta/openai
    health:
      method: GET
      path: /v1/models
      ok: [200]
    fail_status: [400, 401, 402, 403, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      400: 120
      401: 300
      402: 300
      403: 300
      429: 60
      default: 120
    # Same six-key EAP set: every GEMINI_API_KEY* 401s on this upstream too,
    # so drawing from gen-lang-client is the only way this pool has members.
    keys:
      - GEMINI_EAP_KEY_1
      - GEMINI_EAP_KEY_2
      - GEMINI_EAP_KEY_3
      - GEMINI_EAP_KEY_4
      - GEMINI_EAP_KEY_5
      - GEMINI_EAP_KEY_6
  gemini-eap:
    upstream: https://generativelanguage.googleapis.com
    health:
      method: GET
      path: /v1beta/models
      ok: [200]
    fail_status: [400, 401, 402, 403, 404, 429]
    probe_timeout: 5
    request_timeout: 300
    cooldown:
      400: 60
      401: 300
      402: 300
      403: 300
      404: 10
      429: 60
      default: 120
    # Single-project pool by necessity — EAP exists on exactly one project, so
    # "rotate across projects" is not available. Rotation is across the six
    # keys of that project instead; see docs/gemini-key-conventions.md.
    keys:
      - GEMINI_EAP_KEY_1
      - GEMINI_EAP_KEY_2
      - GEMINI_EAP_KEY_3
      - GEMINI_EAP_KEY_4
      - GEMINI_EAP_KEY_5
      - GEMINI_EAP_KEY_6

  gemini-eap-openai:
    upstream: https://generativelanguage.googleapis.com/v1beta/openai
    health:
      method: GET
      path: /v1/models
      ok: [200]
    fail_status: [400, 401, 402, 403, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      400: 120
      401: 300
      402: 300
      403: 300
      429: 60
      default: 120
    # Liveness verified 2026-10-02; GEMINI_EAP_KEY_0 was revoked by GCP after
    # the 2026-09-23 exposure and is excluded.
    keys:
      - GEMINI_EAP_KEY_1
      - GEMINI_EAP_KEY_2
      - GEMINI_EAP_KEY_3
      - GEMINI_EAP_KEY_4
      - GEMINI_EAP_KEY_5
      - GEMINI_EAP_KEY_6

  # --- mistral: Mistral AI direct (added 2026-09-29, kestrel/GuideLLM audit) ---
  # Key verified live 2026-09-29: /v1/models -> 200 (46 models), chat
  # completions -> 200 on ministral-3b/8b/14b-latest, codestral-latest,
  # mistral-code-latest. mistral-medium-*/magistral-*/mistral-small-* are
  # 429 at 0 req/min on this key (no entitlement) — NOT listed in herd.yaml.
  # mistral-large-latest is 403 (not entitled).
  mistral:
    upstream: https://api.mistral.ai
    health:
      method: GET
      path: /v1/models
      ok: [200]
    fail_status: [400, 401, 402, 403, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      400: 120
      401: 300
      402: 300
      403: 300
      429: 60
      default: 120
    keys:
      - MISTRAL_API_KEY
