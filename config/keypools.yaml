# keypools.yaml -- herd-keypool (:25109) pool definitions.
# Key VALUES live only in /home/toxic/.secrets (parsed at startup + on SIGHUP,
# never logged). Only key NAMES appear here.
#
# 2026-09-20 (Ember): split the old single `openrouter` pool. The free-only
# credential OPENROUTER_API_KEY_FREE may serve ONLY free models
# (openrouter/free or IDs ending in ":free") -- enforced in-process by
# herd-keypool.py via `free_only: true` on the key entry. Other credentials
# may still serve free models (failover), but the free-only key can never
# be selected for paid traffic, including in the recovery sweep.
#
# NOTE: upstream has NO /v1 suffix -- the proxy joins upstream + request path
# (e.g. /openrouter-free/v1/chat/completions -> https://openrouter.ai/api/v1/chat/completions).
pools:
  # --- openrouter-free: OpenRouter free models (free-only key first, paid key as failover)
  openrouter-free:
    upstream: https://openrouter.ai/api
    health:
      method: GET
      path: /v1/auth/key      # cheap: returns key info, no spend
      ok: [200]
    fail_status: [401, 402, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      401: 300
      402: 300
      429: 60
      default: 120
    keys:
      - {name: OPENROUTER_API_KEY_FREE, free_only: true}
      - OPENROUTER_API_KEY_1   # failover for free traffic (NOT free-only)

  # --- openrouter-paid: OpenRouter paid models (Kimi etc). Free-only key EXCLUDED here.
  openrouter-paid:
    upstream: https://openrouter.ai/api
    health:
      method: GET
      path: /v1/auth/key
      ok: [200]
    fail_status: [401, 402, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      401: 300
      402: 300
      429: 60
      default: 120
    keys:
      - OPENROUTER_API_KEY
      - OPENROUTER_API_KEY_1

  # --- gemini: Google AI via OpenAI-compatible endpoint (free tier first)
  gemini:
    upstream: https://generativelanguage.googleapis.com/v1beta/openai
    health:
      method: GET
      path: /v1/models        # cheap: lists models for the key, no spend
      ok: [200]
    fail_status: [400, 401, 402, 403, 429]
    probe_timeout: 5
    request_timeout: 180
    cooldown:
      400: 120
      401: 300
      402: 300
      403: 300
      429: 60
      default: 120
    keys:
      - GEMINI_API_KEY
      - GEMINI_API_KEY_1
      - GEMINI_API_KEY_2
      - GEMINI_API_KEY_3
      - GEMINI_API_KEY_4
      - GEMINI_API_KEY_5
