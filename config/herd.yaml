# =============================================================================
# LLAMA-SWAP CONFIGURATION — RTX 3090 24GB
# =============================================================================
# Config: /home/toxic/sovereign/config/herd.yaml (canonical; llama-swap.yaml symlinks here)
# =============================================================================

healthCheckTimeout: 300
logLevel: debug
metricsMaxInMemory: 5000
captureBuffer: 15
globalTTL: 600
startPort: 25001
includeAliasesInList: true
sendLoadingState: true

store:
  path: /home/toxic/.local/share/llama-swap/store.db

performance:
  enable: true
  every: 1m

hooks:
  on_startup:
    preload: []
  on_model_loaded:
    exec: 'echo "[$(date)] MODEL_LOADED: $MODEL" >> /home/toxic/sovereign/data/herd-events.log'
  on_model_unloaded:
    exec: 'echo "[$(date)] MODEL_UNLOADED: $MODEL" >> /home/toxic/sovereign/data/herd-events.log'

# RETIRED 2026-09-17: astMatrix in-process router replaced by Flock delegation.
# Flock (:8000) is the unified multi-provider remote-API/completions subsystem.
# DISABLED 2026-09-20 (provider-surgeon): flock :25193 cloud upstream is dead -
# NVIDIA account returns 404/410/502 on every probed chat model; the flock daemon
# itself runs with zero upstream env keys. Re-enable when flock upstream is healthy.
# (flock daemon keeps running under pitchfork for the TAU flock extension.)
# RE-ENABLED 2026-09-20 ~03:10 MDT (provider-surgeon): flock upstream completions
# verified live via 127.0.0.1:25193 with FLOCK_API_KEY. Only the 3 model IDs
# below returned real completions in the probe; the other 100 flock-advertised
# IDs 404 upstream (stale) and are deliberately NOT mapped. Re-probe before adding more.
# DISABLED 2026-09-20 ~03:20 MDT (provider-surgeon): the flock delegation advertises
# ALL 103 upstream model IDs (discovery cannot be restricted to modelMap), and ~100
# of them 404 upstream (stale). Use the flock-direct peer below instead, which
# exposes only the 3 probe-verified live models.
flock:
  enabled: false
  baseUrl: http://127.0.0.1:25193
  keyEnv: FLOCK_API_KEY
  modelMap:
    flock-deepseek-v4-flash: deepseek-ai/deepseek-v4-flash-0731
    flock-nemotron-35-lightning: nvidia/nemotron-3.5-lightning-30b-a3b
    flock-glm-53-flash: z-ai/glm-5.3-flash
    kimi-k2: moonshot/kimi-k2.6
    kimi-k3-nim: moonshotai/kimi-k3
routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          beellama/exaone-4-0-1-2b-iq4xs: 35
          beellama/exaone-4-0-1-2b-q4km: 34
          beellama/exaone-4-0-1-2b-q5km: 33
          beellama/exaone-4-0-1-2b-q6k: 32
          beellama/exaone-4-0-1-2b-q80: 31
          mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_m: 30
          mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_s: 29
          jackrong/qwen3.5-9b-deepseek-v4-flash-da-q4km: 28
          gemma-4-12b-unified: 24
          gemma-4-12b-uncensored: 22
          beellama/qwen-flash-64k: 16
          beellama/qwen-flash-96k: 15
          beellama/qwen-flash-128k: 14
          beellama/qwen-flash-256k: 13
          beellama/gemma-64k: 12
          beellama/gemma-96k: 11
          beellama/gemma-128k: 10
          beellama/strange-64k: 9

  router:
    use: matrix
    settings:
      matrix:
        vars:
          exa1: beellama/exaone-4-0-1-2b-iq4xs
          exa2: beellama/exaone-4-0-1-2b-q4km
          df9b: mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_m
          df9bs: mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_s
          gm4u: gemma-4-12b-unified
          gm4un: gemma-4-12b-uncensored
          qf64: beellama/qwen-flash-64k
          qf96: beellama/qwen-flash-96k
          qf128: beellama/qwen-flash-128k
          qf256: beellama/qwen-flash-256k
          gm64: beellama/gemma-64k
          gm96: beellama/gemma-96k
          gm128: beellama/gemma-128k
          st64: beellama/strange-64k
        evict_costs:
          exa1: 35
          exa2: 34
          df9b: 30
          df9bs: 29
          gm4u: 24
          gm4un: 22
          qf256: 13
          qf128: 14
          qf96: 15
          qf64: 16
          gm128: 10
          gm96: 11
          gm64: 12
          st64: 9
        sets:
          exclusive: >-
            exa1 | exa2 |
            df9b | df9bs |
            gm4u | gm4un |
            qf64 | qf96 | qf128 | qf256 |
            gm64 | gm96 | gm128 |
            st64

macros:
  MODEL_DIR: /home/toxic/models
  BEELLAMA_BIN: /home/toxic/projects/sovereign-projects/herd/engines/beellama.cpp/build-cuda86/bin/llama-server
  BEELLAMA_LD: /home/toxic/projects/sovereign-projects/herd/engines/beellama.cpp/build-cuda86/bin

  EXAONE_1B_IQ4XS: ${MODEL_DIR}/EXAONE-4.0-1.2B-IQ4_XS.gguf
  EXAONE_1B_Q4KM: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q4_K_M.gguf
  EXAONE_1B_Q5KM: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q5_K_M.gguf
  EXAONE_1B_Q6K: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q6_K.gguf
  EXAONE_1B_Q80: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q8_0.gguf


  GEMMA_12B_BASE_Q4KM: ${MODEL_DIR}/gemma-4-12b-it-Q4_K_M.gguf
  GEMMA_12B_UNCENS_Q4KM: ${MODEL_DIR}/gemma-4-12B-it-uncensored-Q4_K_M.gguf


  QWEN35_9B_FLASH_MTP: ${MODEL_DIR}/Qwen3.5-9B-DeepSeek-V4-Flash-MTP-Q4_K_M.gguf
  QWEN35_9B_FLASH_IQ4XS: ${MODEL_DIR}/Qwen3.5-9B-DeepSeek-V4-Flash-IQ4_XS.gguf
  QWEN35_9B_FLASH_DA_Q4KM: ${MODEL_DIR}/Q3.5-9B-DS-v4-Flash-DA-Q4_K_M.gguf

  STRANGE_7B_Q4KM: ${MODEL_DIR}/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf

  CUDA_ENV: CUDA_VISIBLE_DEVICES=0 GGML_CUDA=1 GGML_CUDA_GRAPHS=1 GGML_CUDA_FA_ALL_QUANTS=1

  SRV_HOST: --host 127.0.0.1
  SRV_PORT: --port ${PORT}
  SRV_HOST_PORT: ${SRV_HOST} ${SRV_PORT}
  SRV_GPU_LAYERS: --n-gpu-layers all
  SRV_FA: --flash-attn on
  SRV_GPU: ${SRV_GPU_LAYERS} ${SRV_FA}
  SRV_PARALLEL: --parallel 1
  SRV_METRICS: --metrics
  SRV_MLOCK: --mlock
  SRV_NOMMAP: --no-mmap
  SRV_SAFETY: ${SRV_PARALLEL} ${SRV_METRICS} ${SRV_MLOCK} ${SRV_NOMMAP}
  SRV_BASE: ${SRV_HOST_PORT} ${SRV_GPU} ${SRV_SAFETY}

  FORK_BEELLAMA: --kv-unified --no-host --cache-ram 0

  KV_Q8: --cache-type-k q8_0 --cache-type-v q8_0

  CS_32K: "32768"
  CS_64K: "65536"
  CS_96K: "98304"
  CS_128K: "131072"
  CS_256K: "262144"
  B_2K: "2048"
  B_1K: "1024"
  UB_512: "512"
  UB_256: "256"
  CTX_32K: --ctx-size ${CS_32K} -b ${B_2K} -ub ${UB_512}
  CTX_64K: --ctx-size ${CS_64K} -b ${B_2K} -ub ${UB_512}
  CTX_96K: --ctx-size ${CS_96K} -b ${B_2K} -ub ${UB_512}
  CTX_128K: --ctx-size ${CS_128K} -b ${B_2K} -ub ${UB_512}
  CTX_256K: --ctx-size ${CS_256K} -b ${B_1K} -ub ${UB_256}

  REASONING_OFF: ""
  SPEC_NONE: ""

models:
  # --- Oracle judge panel (added 2026-09-20, oracle-hardening) ---
  # ROUTER CONFIG OWNS MODEL SELECTION. The Oracle asks the router for
  # these role aliases only; the concrete panel targets live ONLY in the
  # --target/--standby flags below. To retarget the panel (new census,
  # deprecations, cost changes): edit these flags, restart herd. No Oracle
  # code change. Fixed-target forwarders via config/herd.d/alias-shim.py
  # (same pattern as the Kimi short aliases below). Standbys are one-shot
  # fail-fast (HFT discipline): on primary error (conn failure/HTTP 5xx)
  # the shim tries the standby exactly once, then surfaces whatever comes
  # back. 4xx surfaces verbatim so misconfiguration stays visible.
  oracle-judge-a:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target nex-agi/nex-n2.5-mini:free --standby nex-agi/nex-n2.5-pro:free
    description: "Oracle judge A (alias -> nex-agi/nex-n2.5-mini:free) -- fastest exact-output free judge (489ms census)"
    metadata:
      alias_of: nex-agi/nex-n2.5-mini:free
      role: oracle-judge
  oracle-judge-b:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target nex-agi/nex-n2.5-pro:free --standby poolside/laguna-s-2.1:free
    description: "Oracle judge B (alias -> nex-agi/nex-n2.5-pro:free) -- exact-output NEX complement (799ms census)"
    metadata:
      alias_of: nex-agi/nex-n2.5-pro:free
      role: oracle-judge
  oracle-judge-c:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target poolside/laguna-s-2.1:free --standby nex-agi/nex-n2.5-mini:free
    description: "Oracle judge C (alias -> poolside/laguna-s-2.1:free) -- third model family (2161ms census)"
    metadata:
      alias_of: poolside/laguna-s-2.1:free
      role: oracle-judge
  oracle-judge-local:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target beellama/gemma-96k
    description: "Oracle judge fallback (alias -> beellama/gemma-96k) -- local last-resort slot filler"
    metadata:
      alias_of: beellama/gemma-96k
      role: oracle-judge-fallback
  # --- Kimi short aliases (added 2026-09-20) ---
  # Fixed-target forwarders via config/herd.d/alias-shim.py. No fallback,
  # no substitution: each alias IS its target. Retargeted 2026-09-20
  # (moonshot-parked-audit) from openrouter-pool/* back to moonshot/* --
  # the direct peer is restored; openrouter-pool Kimi is 402
  # "Insufficient credits" until the account is topped up.
  # 2026-09-21 modelmap: targets were `moonshot/<id>` -- peer.go does
  # EXACT-match lookups, no `peer/` prefix stripping, so those 404'd.
  # Targets are the bare upstream IDs the moonshot peer claims.
  kimi:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target kimi-k2.6
    description: "Kimi (alias -> kimi-k2.6)"
    metadata:
      alias_of: kimi-k2.6
  kimi-k2:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target kimi-k2.6
    description: "Kimi K2 (alias -> kimi-k2.6)"
    metadata:
      alias_of: kimi-k2.6
  kimi-code:
    cmd: python3 /home/toxic/sovereign/config/herd.d/alias-shim.py --port ${PORT} --target kimi-k2.7-code
    description: "Kimi code specialist (alias -> kimi-k2.7-code)"
    metadata:
      alias_of: kimi-k2.7-code
  beellama/exaone-4-0-1-2b-iq4xs:
    cmd: ${BEELLAMA_BIN} --model ${EXAONE_1B_IQ4XS} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_32K} ${KV_Q8} ${REASONING_OFF} ${SPEC_NONE}
    aliases:
      - fast
      - tiny
      - exaone-iq4xs
      - exaone-1.2b-iq4xs-32k
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "EXAONE 4.0 1.2B · 32K · IQ4_XS"
    description: "Ultralight bilingual model."
    metadata:
      fork: beellama
      context: 32768
      quant: IQ4_XS
