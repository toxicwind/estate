# ── FREE BACKENDS — Pollinations (workaround for not-anonymous gate) ──
# Latch: this file is NOT generated (no generator owns it) — direct edits compliant.
# We ignore anonymous distinction entirely: herd injects dummy Bearer "pollinations-free-workaround"
# via patched peer.go when apiKey is empty, so Pollinations always sees a Bearer and returns 200.
# Track C (CF gateway) variant below is parked — switch proxy to gateway URL + set apiKey if you want CF caching.
peers:
  pollinations-free:
    proxy: https://gen.pollinations.ai
    # apiKey omitted → router injects pollinations-free-workaround (see internal/router/peer.go P1)
    models:
      - openai
      - gemma-4-31b
      - gpt-oss
      - qwen3.8-27b
      - muse-glimmer
      - muse-spark-1.2
      - kimi-k3
      - nemotron-3.5-lightning
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 60
      tlsHandshake: 10
      idleConn: 90

  # Track C — Cloudflare AI Gateway Custom Provider (optional, not blocking v1)
  # When you create the Custom Provider at https://api.cloudflare.com/.../custom-providers
  # with slug pollinations-free, enable, base_url https://gen.pollinations.ai/v1,
  # then uncomment this peer and comment out the direct one above to get CF caching.
  # pollinations-cf:
  #   proxy: https://gateway.ai.cloudflare.com/v1/2d5e60dbc717af626a1eb04177aa2225/default/custom-pollinations-free/v1
  #   apiKey: ${env.CLOUDFLARE_API_TOKEN}
  #   models:
  #     - openai
  #     - gemma-4-31b
  #   timeouts:
  #     connect: 30
  #     keepalive: 30
  #     responseHeader: 60
