  # --- openrouter-ling: FREE Ling 3.0 Flash via OpenRouter (additive 2026-09-14) ---
  # Live-verified 2026-09-14: all three return HTTP 200, cost 0 (served by Novita).
  # Ling-3.0-Flash = Ant Group/InclusionAI, 124B total / 5.1B active, hybrid KDA+MLA.
  # -vl answers directly (best head candidate); -fin/-sante are reasoning-first.
  # LING TRUTH 2026-09-20: Reasoning-first models (output lands in `reasoning`
  # before `content`). They need adequate max_tokens; tiny probes (max_tokens=5)
  # falsely looked "empty". Verified live: LING-LIVE in 0.885s. Do NOT park on
  # small-token probes.
  openrouter-ling:
    proxy: http://127.0.0.1:25109/openrouter
    # apiKey intentionally OMITTED (2026-09-20, herd-deployer): auth is
    # injected per-call by the key-pool sidecar from its health-checked
    # OPENROUTER_* key rotation. Do NOT re-add a hardcoded key — a
    # 401/402/429 is a routing signal, not a config rewrite.
    models:
      - inclusionai/ling-3.0-flash-vl:free
      - inclusionai/ling-3.0-flash-fin:free
      - inclusionai/ling-3.0-flash-sante:free
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 120
      tlsHandshake: 10
      idleConn: 90
