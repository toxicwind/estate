global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llama-server
    static_configs:
      - targets: ['localhost:25001']
    metrics_path: /metrics

  - job_name: nfcot-proxy
    static_configs:
      - targets: ['localhost:25008']
    metrics_path: /metrics

  - job_name: openfang
    static_configs:
      - targets: ['localhost:25004']
    metrics_path: /metrics

  - job_name: fleet-ranker
    static_configs:
      - targets: ['localhost:25010']
    metrics_path: /metrics

  - job_name: openclaw
    static_configs:
      - targets: ['localhost:18789']
    metrics_path: /metrics

  - job_name: yote
    static_configs:
      - targets: ['localhost:25042']
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: ['localhost:9100']

  - job_name: caddy
    static_configs:
      - targets: ['localhost:2019']
    metrics_path: /metrics
