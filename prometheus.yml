global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: sovereign
    environment: local

scrape_configs:
  - job_name: hf-downloader
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:25020"]
  - job_name: kafka
    static_configs:
      - targets: ["localhost:9308"]
  - job_name: llama-herder
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:25021"]
  - job_name: llama-server
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:25001"]
  - job_name: mongodb
    static_configs:
      - targets: ["localhost:9216"]
  - job_name: mysql
    static_configs:
      - targets: ["localhost:9104"]
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
  - job_name: openfang
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:25004"]
  - job_name: postgres
    static_configs:
      - targets: ["localhost:9187"]
  - job_name: redis
    static_configs:
      - targets: ["localhost:9121"]
  - job_name: rust-web
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:25005"]
