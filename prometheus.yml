global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "Estate"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:25100"   # bornite
          - "127.0.0.1:25101"   # model-guard
          - "127.0.0.1:25105"   # prometheus self
          - "127.0.0.1:25211"   # node-exporter
          - "127.0.0.1:25213"   # Estate-exporter (daemons/ports/lanes/market/gpu)

# NOTE: 25102/25103/25106/25107/25203/25208 have no /metrics endpoint
# (404 on scrape). Their up/down is covered by Estate-exporter
# (Estate_port_listening / Estate_daemon_up).
