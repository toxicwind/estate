  # CORRECTED: kv_heads=4 (GQA), not 8. 512 bytes/token, not 36KB.
  # 64K=19.0GB (safe), 96K=20.3GB (tight), 128K=21.0GB (VERY tight, risk OOM)
  # MAX SAFE: 96K. 128K possible but monitor closely.
  # ═══════════════════════════════════════════════════════════════════════════

  "ik_llama/heretic-ud-64k":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 65536 -b 4096 -ub 1024 ${kv_q8}
      --jinja ${coding}
    name: "Heretic UD 27B Q4_K_XL (64K, coding)"
    description: "High-quality coding. 19.0GB — safe with 5GB headroom."
    metadata:
      variant: ik_llama
      context: 65536
      quant: Q4_K_XL
      vram_estimate_gb: "~19.0"
      exact_weight_gb: "17.6"
      best_for: "High-quality precise coding, tool-calling"
    capabilities:
