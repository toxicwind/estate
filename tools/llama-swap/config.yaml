    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 98304

  # ═══════════════════════════════════════════════════════════════════════════
  # HERETIC-UD 27B Q5_K_XL — exact 20.0GB weights. Only ~2.5-3GB free.
  # 64K=22.2GB (tight), 96K=23.3GB (VERY tight). 128K WILL OOM.
  # MAX SAFE: 64K.
  # ═══════════════════════════════════════════════════════════════════════════

  "ik_llama/heretic-q5-64k":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q5}
      ${base_flags} --ctx-size 65536 -b 2048 -ub 512 ${kv_q8}
      --jinja ${coding}
    name: "Heretic UD 27B Q5_K_XL (64K, MAX QUALITY)"
    description: "Maximum quality. 22.2GB — 1.8GB headroom. Use for critical tasks only."
    metadata:
      variant: ik_llama
      context: 65536
      quant: Q5_K_XL
      vram_estimate_gb: "~22.2"
      exact_weight_gb: "20.0"
      warning: "VERY TIGHT. 96K=23.3GB (danger). 128K WILL OOM."
      best_for: "Mission-critical reasoning, max quality single-file tasks"
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 65536

  # ═══════════════════════════════════════════════════════════════════════════
  # IK_TURBOQUANT VARIANTS — tbqp3/tbq3 cache. VERIFY accepted by your build.
  # ═══════════════════════════════════════════════════════════════════════════

  "ik_turboquant/heretic-27b-256k":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_tq_ld} ${cuda_env}
      ${ik_tq_bin} --model ${heretic_27b}
      ${base_flags} --ctx-size 262144 -b 1024 -ub 256 ${kv_q4}
      --jinja ${coding}
    name: "Heretic 27B Cerebellum TQ (256K, tbqp3 cache)"
    description: "TurboQuant KV compression. VERIFY tbqp3 accepted. ~18GB estimated."
    metadata:
      variant: ik_turboquant
      context: 262144
      quant: Q2_K_Mixed
      cache_type: "tbqp3/tbq3"
      vram_estimate_gb: "~18.0"
      warning: "VERIFY --cache-type-k/v accept tbqp3/tbq3. Fall back to turboquant/heretic-27b-256k if not."
      best_for: "TurboQuant-optimized max context coding"
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 262144

  "ik_turboquant/heretic-ud-96k":
    cmd: >-
