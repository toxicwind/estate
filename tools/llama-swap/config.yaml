# llama-swap config — sovereign
# https://github.com/mostlygeek/llama-swap
#
# Three prebuilt llama-server variants, each with their own LD_LIBRARY_PATH:
#   beellama   — sm_86 tuned, CUDA FA all quants  (v1)
#   turboquant — ik-quant ops, turbo              (v9907)
#   ik_llama   — ik fork symlink via sovereign/bin (uses beellama .so fallback)
#
# Model names follow pattern: <variant>/<short-name>
# Hit any /v1/* endpoint and llama-swap spawns the right server on demand.

# -- Healthcheck --
healthCheckTimeout: 120

# -- Groups let multiple model-IDs share one running instance --
# (useful if you want aliases)

models:
  # ── beellama variant ──────────────────────────────────────────────────────
  # Primary: StrangeMerges 19B Q4 — fast general purpose
  "beellama/strange":
    cmd: >
      env LD_LIBRARY_PATH=/home/toxic/projects/beellama.cpp/build/bin
      CUDA_VISIBLE_DEVICES=0
      GGML_CUDA=1
      GGML_CUDA_GRAPHS=1
      GGML_CUDA_FA_ALL_QUANTS=1
      /home/toxic/projects/beellama.cpp/build/bin/llama-server
      --model /home/toxic/projects/models/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf
      --host 127.0.0.1
      --port 25001
      --ctx-size 32768
      --n-gpu-layers 99
      --flash-attn
      --slots 1
      -b 4096
      -ub 1024
      --cache-type-k q4_0
      --cache-type-v q4_0
      --embeddings
      --pooling cls
      --metrics
      --log-format json
      --no-mmap
      --mlock
      --draft /home/toxic/projects/models/Qwen2.5-1.5B-Draft.gguf
      --draft-n-ctx 4096
      --draft-n-predict 16
      --draft-n-gpu-layers 99
    proxy: http://127.0.0.1:25001
    ttl: 300

  # beellama: Qwen3.5 9B DeepSeek Flash — fast reasoning
