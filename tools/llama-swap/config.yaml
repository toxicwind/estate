# llama-swap config — sovereign
# https://github.com/mostlygeek/llama-swap
#
# Four prebuilt llama-server variants under /home/toxic:
#   beellama      /home/toxic/projects/beellama.cpp/build/bin
#   turboquant    /home/toxic/projects/llama-cpp-turboquant/build/bin
#   ik_llama      /home/toxic/projects/ik_llama.cpp-main/build/bin
#   ik_turboquant /home/toxic/projects/ik_llama.cpp-main/build_turboquant/bin
#
# ik_* builds need multi-dir LD_LIBRARY_PATH (libs not copied into bin/).
# Model IDs: <variant>/<short-name>
# llama-herder listens on :25021; upstream proxies below are spawned on demand.

healthCheckTimeout: 120

# LD_LIBRARY_PATH fragments (ik builds)
# beellama/turboquant: single bin dir suffices

models:
  # Legacy alias — Grok/Antigravity configs that still send model "llama"
  "llama":
    cmd: >
      env LD_LIBRARY_PATH=/home/toxic/projects/beellama.cpp/build/bin
      CUDA_VISIBLE_DEVICES=0
      GGML_CUDA=1
      GGML_CUDA_GRAPHS=1
      GGML_CUDA_FA_ALL_QUANTS=1
      /home/toxic/projects/beellama.cpp/build/bin/llama-server
      --model /home/toxic/projects/models/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf
      --host 127.0.0.1
      --port 25001
      --ctx-size 32768
      --n-gpu-layers 99
      --flash-attn on
      --parallel 1
      -b 4096
      -ub 1024
      --cache-type-k q4_0
      --cache-type-v q4_0
      --embeddings
      --pooling cls
      --metrics
      --log-format json
      --no-mmap
      --mlock
      --draft /home/toxic/projects/models/Qwen2.5-1.5B-Draft.gguf
      --draft-n-ctx 4096
      --draft-n-predict 16
      --draft-n-gpu-layers 99
    proxy: http://127.0.0.1:25001
    ttl: 300

