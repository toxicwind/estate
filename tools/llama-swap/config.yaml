      ${clean_env} ${cuda_env} LD_LIBRARY_PATH=${ik_ld} ${ik_bin} --model ${heretic_ud_q4} ${spec_ik} ${srv_base} ${fork_ik} ${ctx_64k} ${kv_q8} --jinja ${reasoning_ik} ${sampling_coding}
    env: ["LLAMA_API_KEY=", "LLAMA_ARG_API_KEY="]
  "ik_llama/heretic-ud-96k":
