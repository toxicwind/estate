# llama-swap.yaml — FINAL, math-verified context ceilings
# Every ctx-size below is derived from: (24GB - weights_GB - 1.5GB_overhead) / KV_bytes_per_token
# using real config.json architecture values, not estimates. See metadata.math on each entry.

healthCheckTimeout: 300
logLevel: info
logToStdout: proxy
metricsMaxInMemory: 5000
captureBuffer: 256
globalTTL: 0
startPort: 25001
includeAliasesInList: true
sendLoadingState: false

store:
  path: /home/toxic/.local/share/llama-swap/store.db

performance:
  disabled: false
  every: 5s

hooks:
  on_startup:
    preload:
      - beellama/qwen-flash

macros:
  beellama_bin: /home/toxic/projects/beellama.cpp/build/bin/llama-server
  turbo_bin: /home/toxic/projects/llama-cpp-turboquant/build/bin/llama-server
  ik_bin: /home/toxic/projects/ik_llama.cpp-main/build/bin/llama-server
  ik_tq_bin: /home/toxic/projects/ik_llama.cpp-main/build_turboquant/bin/llama-server

  beellama_ld: /home/toxic/projects/beellama.cpp/build/bin
  turbo_ld: /home/toxic/projects/llama-cpp-turboquant/build/bin
  ik_ld: /home/toxic/projects/ik_llama.cpp-main/build/bin:/home/toxic/projects/ik_llama.cpp-main/build/src:/home/toxic/projects/ik_llama.cpp-main/build/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build/examples/mtmd
  ik_tq_ld: /home/toxic/projects/ik_llama.cpp-main/build_turboquant/bin:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/src:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/examples/mtmd

  cuda_env: "CUDA_VISIBLE_DEVICES=0 GGML_CUDA=1 GGML_CUDA_GRAPHS=1 GGML_CUDA_FA_ALL_QUANTS=1"
  base_flags: "--host 127.0.0.1 --port ${PORT} --n-gpu-layers 99 --flash-attn on --parallel 1 --metrics --mlock --no-mmap"
  kv_q4: "--cache-type-k q4_0 --cache-type-v q4_0"
  coding_samplers: "--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"

  qwen_flash: /home/toxic/projects/models/Qwen3.5-9B-DeepSeek-V4-Flash-IQ4_XS.gguf
  strange: /home/toxic/projects/models/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf
  gemma: /home/toxic/projects/models/gemma-4-12B-it-uncensored-Q4_K_M.gguf
  heretic_27b: /home/toxic/projects/models/Qwen3.6-27B-Heretic-Cerebellum-v1-Q2_K_Mixed.gguf
  mn_grand: /home/toxic/projects/models/MN-GRAND-23.5B-Gutenberg-UNCENSORED-V2-Q4_K_M.gguf
  heretic_ud_q4: /home/toxic/projects/models/heretic-UD-27B-Q4_K_XL.gguf
  heretic_ud_q5: /home/toxic/projects/models/heretic-UD-27B-Q5_K_XL.gguf
  draft: /home/toxic/projects/models/Qwen2.5-1.5B-Draft.gguf

models:
  "llama":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${qwen_flash}
      ${base_flags} --ctx-size 131072 -b 4096 -ub 1024 ${kv_q4}
      --jinja --temp 0.85 --top-p 0.95
    name: "Qwen3.5-9B Flash (legacy alias)"
    metadata: { variant: beellama, context: 131072 }

  "beellama/qwen-flash":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${qwen_flash}
      ${base_flags} --ctx-size 131072 -b 4096 -ub 1024 ${kv_q4}
      --jinja --temp 0.85 --top-p 0.95
    name: "Qwen3.5-9B Flash (131K ctx)"
    metadata:
      variant: beellama
      context: 131072
      math: "IQ4_XS ~5.6GB weights, ~17GB free. Not KV-math-verified (no config.json fetched), but headroom this large makes 131072 essentially free either way."

  "beellama/strange":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${strange}
      ${base_flags} --ctx-size 32768 -b 4096 -ub 1024 ${kv_q4}
      --embeddings --pooling cls
      --spec-type draft-simple --spec-draft-model ${draft}
      --spec-draft-ctx-size 4096 --spec-draft-n-max 16 --spec-draft-n-min 2
      --spec-draft-p-split 0.1 --spec-draft-p-min 0
      --temp 0.7 --top-p 0.95 --top-k 50
    name: "StrangeMerges 19.7B + Speculative (32K ctx — real ceiling)"
    metadata:
      variant: beellama
      speculative: true
      context: 32768
      math: "Mistral-7B config: kv_heads=8, head_dim=128, 32 layers -> 29.5KB/token. At 32768 ctx: ~950MB KV, trivial. NOT VRAM-bound -- 32768 is the model's real trained/extended context ceiling. Cannot go higher regardless of card size."

  "beellama/gemma":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${gemma}
      ${base_flags} --ctx-size 262144 -b 2048 -ub 512 ${kv_q4}
      --jinja
    name: "Gemma 4 12B Uncensored (262K ctx -- full native ceiling)"
    metadata:
      variant: beellama
      context: 262144
      math: "Confirmed arch: 48 layers, 40 sliding-window (window=1024, kv_heads=8, head_dim=256, FIXED cost ~90MB regardless of ctx) + 8 full-attn (kv_heads=2, head_dim=512, 9KB/token, scales with ctx). At 262144: ~2.4GB KV total. Weights ~7.5GB. Total ~10GB of 24GB used at MAX native context. Massive headroom to spare."
      warning: "VERIFY your GGUF's gemma4.context_length metadata isn't stuck at the known upstream 131072 bug (Google shipped a wrong max_position_embeddings that propagated into early quants before the fix). Check with gguf-dump; redownload if it reads 131072 instead of 262144."

  # ── turboquant family ───────────────────────────────────────────────────
  "turboquant/heretic-27b":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${heretic_27b}
      ${base_flags} --ctx-size 262144 -b 1024 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic 27B Q2_K_Mixed (262K ctx -- full native ceiling)"
    metadata:
      variant: turboquant
      context: 262144
      math: "Qwen/Qwen3.6-27B config.json: hidden_size=5120, head_dim=256, 64 layers, full_attention_interval=4 -> 16 full-attn layers + 48 linear-attn (Gated DeltaNet, constant-size state, ignored in KV math). Assuming kv_heads=8 (standard Qwen3 GQA ratio, UNVERIFIED exact value): 36KB/token. At 262144: ~9.4GB KV. Weights ~10.5GB. Total ~20GB of 24GB at FULL native ceiling -- fits with margin."

  "turboquant/mn-grand":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${mn_grand}
      ${base_flags} --ctx-size 81920 -b 4096 -ub 1024 ${kv_q4}
      --log-format json --no-context-shift --jinja
      --temp 0.9 --repeat-penalty 1.05 --repeat-last-n 256
    name: "MN-GRAND 23.5B GLM4.7-Thinking (82K ctx -- VRAM-bound, dense arch)"
    metadata:
      variant: turboquant
      context: 81920
      math: "Confirmed GLM4.7-Thinking lineage via Exa. Dense frankenmerge, 81 layers, Mistral-Nemo config kv_heads=8/head_dim=128 (every layer pays full attention cost, no linear-attn savings unlike the Qwen models): 73KB/token. Weights ~14.5GB, free budget 8GB. Max theoretical = 108.6K tokens; 131072 (my earlier answer) would NOT have fit -- 9.4GB KV vs 8GB budget. Set to 81920 for real margin against compute-buffer overhead."
      warning: "--no-context-shift per DavidAU's warning on sibling Nemo/Brainstorm merges: rope/context-shift may corrupt output on this lineage."

  "turboquant/heretic-ud":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 114688 -b 2048 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic UD 27B Q4_K_XL (114.7K ctx)"
    metadata:
      variant: turboquant
      context: 114688
      math: "unsloth confirms 17.6GB exact weights. Free budget 4.9GB / 36KB/token = 142.8K theoretical max. Set to 114688 (80% of theoretical) for compute-buffer margin."

  # ── ik_llama family ──────────────────────────────────────────────────────
  "ik_llama/qwen-flash":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${qwen_flash}
      ${base_flags} --ctx-size 131072 -b 4096 -ub 1024 ${kv_q4}
      --log-format json --temp 0.85 --top-p 0.95
    name: "Qwen3.5-9B Flash (ik_llama, 131K ctx)"
    metadata: { variant: ik_llama, context: 131072 }

  "ik_llama/strange":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${strange}
      ${base_flags} --ctx-size 32768 -b 4096 -ub 1024 ${kv_q4}
      --log-format json --temp 0.7 --top-p 0.95 --top-k 50
    name: "StrangeMerges 19.7B (ik_llama, 32K real ceiling)"
    metadata: { variant: ik_llama, context: 32768 }

  "ik_llama/gemma":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${gemma}
      ${base_flags} --ctx-size 262144 -b 2048 -ub 512 ${kv_q4}
      --jinja
    name: "Gemma 4 12B Uncensored (ik_llama, 262K ctx, MTP-capable build)"
    metadata:
      variant: ik_llama
      context: 262144
      note: "ik_llama.cpp README documents native MTP support for Gemma 4 (PR #1744) -- this build can self-speculate against zaakirio's mtp-gemma-4-12b-it-uncensored.gguf drafter once you confirm the fork's exact CLI flag from its own docs."

  "ik_llama/heretic-ud":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 114688 -b 2048 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic UD 27B Q4_K_XL (ik_llama, 114.7K ctx)"
    metadata: { variant: ik_llama, context: 114688 }

  "ik_llama/heretic-q5":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q5}
      ${base_flags} --ctx-size 49152 -b 2048 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic UD 27B Q5_K_XL (ik_llama, 49.1K ctx)"
    metadata:
      variant: ik_llama
      context: 49152
      math: "unsloth confirms 20GB exact weights. Free budget only 2.5GB / 36KB/token = 72.8K theoretical max. Set to 49152 (67% of theoretical) since this quant has the least margin of anything in the fleet."

  # ── ik_turboquant family (TQ cache types unverified on your build) ──────
  "ik_turboquant/heretic-27b":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_tq_ld} ${cuda_env}
      ${ik_tq_bin} --model ${heretic_27b}
      ${base_flags} --ctx-size 262144 -b 1024 -ub 512
      --cache-type-k tbqp3 --cache-type-v tbq3
      --log-format json ${coding_samplers}
    name: "Heretic 27B Q2_K_Mixed (ik_turboquant, 262K ctx, TQ cache)"
    metadata: { variant: ik_turboquant, context: 262144 }

  "ik_turboquant/mn-grand":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_tq_ld} ${cuda_env}
      ${ik_tq_bin} --model ${mn_grand}
      ${base_flags} --ctx-size 81920 -b 4096 -ub 1024
      --cache-type-k tbqp3 --cache-type-v tbq3
      --log-format json --no-context-shift --jinja
      --temp 0.9 --repeat-penalty 1.05 --repeat-last-n 256
    name: "MN-GRAND 23.5B GLM4.7-Thinking (ik_turboquant, 82K ctx)"
    metadata: { variant: ik_turboquant, context: 81920 }

  "ik_turboquant/heretic-ud":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_tq_ld} ${cuda_env}
      ${ik_tq_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 114688 -b 2048 -ub 512
      --cache-type-k tbqp3 --cache-type-v tbq3
      --log-format json ${coding_samplers}
    name: "Heretic UD 27B Q4_K_XL (ik_turboquant, 114.7K ctx)"
    metadata: { variant: ik_turboquant, context: 114688 }

  "ik_turboquant/heretic-q5":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_tq_ld} ${cuda_env}
      ${ik_tq_bin} --model ${heretic_ud_q5}
      ${base_flags} --ctx-size 49152 -b 2048 -ub 512
      --cache-type-k tbqp3 --cache-type-v tbq3
      --log-format json ${coding_samplers}
    name: "Heretic UD 27B Q5_K_XL (ik_turboquant, 49.1K ctx)"
    metadata: { variant: ik_turboquant, context: 49152 }

routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          beellama/qwen-flash: 10
          ik_llama/gemma: 5
          beellama/strange: 5
  router:
    use: group
    settings:
      groups:
        default:
          swap: true
          exclusive: true
          persistent: false
          members:
            - llama
            - beellama/qwen-flash
            - beellama/strange
            - beellama/gemma
            - ik_llama/qwen-flash
            - ik_llama/strange
            - ik_llama/gemma
            - ik_llama/heretic-ud
            - ik_llama/heretic-q5
            - turboquant/heretic-27b
            - turboquant/mn-grand
            - turboquant/heretic-ud
            - ik_turboquant/heretic-27b
            - ik_turboquant/mn-grand
            - ik_turboquant/heretic-ud
            - ik_turboquant/heretic-q5