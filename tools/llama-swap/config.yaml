# ═══════════════════════════════════════════════════════════════════════════════
routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          # Daily drivers (highest priority)
          beellama/qwen-flash-128k: 25
          beellama/qwen-flash-256k: 24
          beellama/qwen-flash-64k-coding: 23
          beellama/qwen-flash-64k: 22
          # Gemma variants
          beellama/gemma-128k: 20
          beellama/gemma-96k: 19
          beellama/gemma-64k: 18
          # Heretic Cerebellum — best coding benchmarks
          turboquant/heretic-27b-256k: 16
          turboquant/heretic-27b-128k: 15
          # Heretic UD
          ik_llama/heretic-ud-64k: 13
          ik_llama/heretic-ud-96k: 12
          ik_llama/heretic-q5-64k: 11
          # TurboQuant variants
          ik_turboquant/heretic-27b-256k: 9
          ik_turboquant/heretic-ud-96k: 8
          # MN-GRAND creative
          turboquant/mn-grand-128k: 6
          turboquant/mn-grand-96k: 5
          turboquant/mn-grand-64k: 4
          # StrangeMerges experimental
          beellama/strange-64k: 2
          # Unlisted (lowest priority)
          beellama/qwen-flash-64k-coding: 1
          turboquant/heretic-27b-128k-thinking: 0
  router:
    use: group
    settings:
      groups:
        default:
          swap: true
          exclusive: true
          persistent: false
          members:
            - beellama/qwen-flash-64k
