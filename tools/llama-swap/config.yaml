# =============================================================================
# LLAMA-SWAP CONFIGURATION — sm_86 (Ampere / RTX 3090 24 GB) EDITION
# =============================================================================
# Compute: sm_86  ·  VRAM budget: ~24 GB  ·  No FP8 (sm_89+ only)
# =============================================================================

healthCheckTimeout: 300
logLevel: debug
logToStdout: both
metricsMaxInMemory: 5000
captureBuffer: 15
globalTTL: 600
startPort: 25001
includeAliasesInList: true
sendLoadingState: true

store:
  path: /home/toxic/.local/share/llama-swap/store.db

performance:
  enable: true
  every: 1m

hooks:
  on_startup:
    # Ranked fast path on RTX 3090 (see scripts/model-rank-and-route.ts):
    # exaone ~3.3GiB / ~70 tok/s idle; exclusive matrix unloads when quality/longctx load.
    preload:
      - beellama/exaone-4-0-1-2b-iq4xs
  on_model_loaded:
    exec: 'echo "[$(date)] MODEL_LOADED: $MODEL" >> /tmp/llama-swap-events.log'
  on_model_unloaded:
    exec: 'echo "[$(date)] MODEL_UNLOADED: $MODEL" >> /tmp/llama-swap-events.log'

# -----------------------------------------------------------------------------
# ROUTING MATRIX
# -----------------------------------------------------------------------------
routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          # --- EXAONE (tiny, emergency / coding) ---
          beellama/exaone-4-0-1-2b-iq4xs: 35
          beellama/exaone-4-0-1-2b-q4km: 34
          beellama/exaone-4-0-1-2b-q5km: 33
          beellama/exaone-4-0-1-2b-q6k: 32
          beellama/exaone-4-0-1-2b-q80: 31
          # --- Qwen 9B Flash (utility models) ---
          mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_m: 30
          mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_s: 29
          jackrong/qwen3.5-9b-deepseek-v4-flash-da-q4km: 28
          # --- Qwen 27B dense (heavy workers) ---
          qwen/27b-dflash-iq4xs: 27
          qwen/27b-dflash-q4km: 26
          qwen3.6-27b-dflash-iq4xs-mtp: 25
          # --- Gemma 4 12B (balanced coding) ---
          gemma-4-12b-unified: 24
          gemma-4-12b-mtp: 23
          gemma-4-12b-uncensored: 22
          gemma-4-12b-dflash: 21
          # --- Qwen Flash variants (context-size tiers) ---
          beellama/qwen-flash-96k: 20
          beellama/qwen-flash-128k: 19
          beellama/qwen-flash-256k: 18
          beellama/qwen-flash-mtp-128k: 17
          beellama/qwen-flash-64k: 16
          # --- Gemma 4 12B context tiers ---
          beellama/gemma-128k: 15
          beellama/gemma-mtp-128k: 14
          beellama/gemma-96k: 13
          beellama/gemma-mtp-64k: 12
          beellama/gemma-64k: 11
          # --- Misc / experimental ---
          beellama/strange-64k: 10
          qwen/27b-cerebellum: 9
          # --- TurboQuant line (TheTom/buun cache types) ---
          turboquant/heretic-27b-256k: 8
          turboquant/heretic-27b-128k: 7
          turboquant/mn-grand-128k: 6
          turboquant/mn-grand-96k: 5
          turboquant/mn-grand-64k: 4
          # --- ik_llama line (auto-fit, defrag) ---
          ik_llama/heretic-ud-96k: 3
          ik_llama/heretic-ud-64k: 2
          ik_llama/heretic-q5-64k: 1
          # --- MoE / vision ---
          holo/35b-a3b: 0

  router:
    use: matrix
    settings:
      matrix:
        vars:
          # --- Qwen 9B DeepSeek Flash ---
          df9b: mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_m
          df9bs: mradermacher/qwen3.5-9b-deepseek-v4-flash-i1-q4_k_s
          df9da: jackrong/qwen3.5-9b-deepseek-v4-flash-da-q4km
          # --- Qwen 27B dense ---
          qdf27: qwen/27b-dflash-iq4xs
          qdf27m: qwen3.6-27b-dflash-iq4xs-mtp
          # --- Gemma 4 12B ---
          gm4u: gemma-4-12b-unified
          gm4m: gemma-4-12b-mtp
          gm4un: gemma-4-12b-uncensored
          gm4df: gemma-4-12b-dflash
          # --- Qwen Flash context tiers ---
          qf64: beellama/qwen-flash-64k
          qf96: beellama/qwen-flash-96k
          qf128: beellama/qwen-flash-128k
          qf256: beellama/qwen-flash-256k
          qfm64: beellama/qwen-flash-mtp-64k
          qfm128: beellama/qwen-flash-mtp-128k
          # --- Gemma 4 12B context tiers ---
          gm64: beellama/gemma-64k
          gm96: beellama/gemma-96k
          gm128: beellama/gemma-128k
          gmm64: beellama/gemma-mtp-64k
          gmm128: beellama/gemma-mtp-128k
          # --- Misc ---
          st64: beellama/strange-64k
          mg64: turboquant/mn-grand-64k
          mg96: turboquant/mn-grand-96k
          mg128: turboquant/mn-grand-128k
          h128: turboquant/heretic-27b-128k
          h256: turboquant/heretic-27b-256k
          hu64: ik_llama/heretic-ud-64k
          hu96: ik_llama/heretic-ud-96k
          hq5: ik_llama/heretic-q5-64k
          cb96: qwen/27b-cerebellum
          df96: qwen/27b-dflash-iq4xs
          ho64: holo/35b-a3b
          exa1: beellama/exaone-4-0-1-2b-iq4xs
          exa2: beellama/exaone-4-0-1-2b-q4km
          exa3: beellama/exaone-4-0-1-2b-q5km
          exa4: beellama/exaone-4-0-1-2b-q6k
          exa5: beellama/exaone-4-0-1-2b-q80

        evict_costs:
          df9b: 31
          df9bs: 30
          df9da: 29
          qdf27: 28
          qdf27m: 27
          gm4u: 26
          gm4m: 25
          gm4un: 24
          gm4df: 23
          qf96: 22
          qf128: 21
          qf256: 20
          qfm128: 19
          qf64: 18
          qfm64: 17
          gm128: 16
          gmm128: 15
          gm96: 14
          gmm64: 13
          gm64: 12
          st64: 11
          mg128: 10
          mg96: 9
          mg64: 8
          h256: 7
          h128: 6
          hu96: 5
          hu64: 4
          hq5: 3
          cb96: 2
          df96: 1
          ho64: 1
          exa1: 35
          exa2: 34
          exa3: 33
          exa4: 32
          exa5: 31

        sets:
          exclusive:
            df9b | df9bs | df9da | qdf27 | qdf27m | gm4u | gm4m | gm4un | gm4df | qf64 | qf96 | qf128
            | qf256 | qfm64 | qfm128 | gm64 | gm96 | gm128 | gmm64 | gmm128 | st64
            | mg64 | mg96 | mg128 | h128 | h256 | hu64 | hu96 | hq5 | cb96 | df96
            | ho64 | exa1 | exa2 | exa3 | exa4 | exa5

# =============================================================================
# MACROS — EXPLODED FOR ALL MODELS
# =============================================================================
macros:
  # ---------------------------------------------------------------------------
  # PATHS
  # ---------------------------------------------------------------------------
  MODEL_DIR: /home/toxic/projects/models

  # --- Fork binaries ---------------------------------------------------------
  BEELLAMA_BIN: /home/toxic/projects/beellama.cpp/build/bin/llama-server
  TURBO_BIN: /home/toxic/projects/llama-cpp-turboquant/build/bin/llama-server
  IK_BIN: /home/toxic/projects/ik_llama.cpp-main/build/bin/llama-server
  IK_TQ_BIN: /home/toxic/projects/ik_turboquant/build/bin/llama-server

  # --- LD_LIBRARY_PATH for each fork -----------------------------------------
  BEELLAMA_LD: /home/toxic/projects/beellama.cpp/build/bin
  TURBO_LD: /home/toxic/projects/llama-cpp-turboquant/build/bin
  IK_LD: /home/toxic/projects/ik_llama.cpp-main/build/src:/home/toxic/projects/ik_llama.cpp-main/build/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build/examples/mtmd
  IK_TQ_LD: /home/toxic/projects/ik_llama.cpp-main/build_turboquant/src:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/examples/mtmd

  # ---------------------------------------------------------------------------
  # MODEL FILES (verified present in /home/toxic/projects/models)
  # ---------------------------------------------------------------------------
  QWEN35_9B_FLASH_IQ4XS: ${MODEL_DIR}/Qwen3.5-9B-DeepSeek-V4-Flash-IQ4_XS.gguf
  QWEN35_9B_FLASH_MTP: ${MODEL_DIR}/Qwen3.5-9B-DeepSeek-V4-Flash-MTP-Q4_K_M.gguf
  QWEN35_9B_FLASH_DA_Q4KM: ${MODEL_DIR}/Q3.5-9B-DS-v4-Flash-DA-Q4_K_M.gguf
  QWEN35_9B_DFLASH_Q4KM: ${MODEL_DIR}/Qwen3.5-9B-DFlash-Q4_K_M.gguf
  QWEN35_9B_DFLASH_Q5KM: ${MODEL_DIR}/qwen3.5-9b-dflash-Q5_K_M.gguf

  QWEN36_27B_DFLASH_IQ4XS: ${MODEL_DIR}/Qwen3.6-27B-DFlash-IQ4_XS.gguf
  QWEN36_27B_DFLASH_Q4KM: ${MODEL_DIR}/Qwen3.6-27B-DFlash-Q4_K_M.gguf
  QWEN36_27B_MTP_UD_Q4XL: ${MODEL_DIR}/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
  QWEN36_27B_UD_Q4XL: ${MODEL_DIR}/Qwen3.6-27B-UD-Q4_K_XL.gguf
  QWEN36_CEREBELLUM: ${MODEL_DIR}/Qwen3.6-27B-UD-Q4_K_XL.gguf
  HERETIC_27B_Q5XL: ${MODEL_DIR}/heretic-UD-27B-Q5_K_XL.gguf

  GEMMA_12B_BASE_Q4KM: ${MODEL_DIR}/gemma-4-12b-it-Q4_K_M.gguf
  GEMMA_12B_UNCENS_Q4KM: ${MODEL_DIR}/gemma-4-12B-it-uncensored-Q4_K_M.gguf
  GEMMA_12B_MTP_Q4KM: ${MODEL_DIR}/gemma4-12b-it-mtp-Q4_K_M.gguf
  GEMMA_12B_MTP_Q80: ${MODEL_DIR}/gemma-4-12B-it-MTP-Q8_0.gguf
  GEMMA_12B_ASSIST_Q80: ${MODEL_DIR}/gemma-4-12B-it-assistant-Q8_0.gguf
  GEMMA_12B_DFLASH_Q4KM: ${MODEL_DIR}/gemma-4-12B-DFlash-Q4_K_M.gguf
  GEMMA_21B_MOE_REAP_Q4KM: ${MODEL_DIR}/gemma-4-21b-a4b-it-REAP-Q4_K_M.gguf
  GEMMA_31B_DFLASH_Q4KM: ${MODEL_DIR}/gemma4-31b-it-dflash-Q4_K_M.gguf

  QWEN35_28B_MOE_REAP_Q4KM: ${MODEL_DIR}/Qwen-3.5-28B-A3B-REAP-Q4_K_M.gguf
  HOLO_35B: ${MODEL_DIR}/Qwen-3.5-28B-A3B-REAP-Q4_K_M.gguf
  STRANGE_7B_Q4KM: ${MODEL_DIR}/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf
  MN_GRAND_23B_Q4KM: ${MODEL_DIR}/MN-GRAND-23.5B-Gutenberg-UNCENSORED-V2-Q4_K_M.gguf

  DRAFT_SMALL: ${MODEL_DIR}/Qwen2.5-1.5B-Draft-Q8_0.gguf
  QWEN35_15B_DRAFT: ${MODEL_DIR}/Qwen3.5-1.5B-Draft.gguf
  QWEN25_INSTRUCT_Q8: ${MODEL_DIR}/Qwen2.5-1.5B-Instruct-Q8_0.gguf

  EXAONE_1B_IQ4XS: ${MODEL_DIR}/EXAONE-4.0-1.2B-IQ4_XS.gguf
  EXAONE_1B_Q4KM: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q4_K_M.gguf
  EXAONE_1B_Q5KM: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q5_K_M.gguf
  EXAONE_1B_Q6K: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q6_K.gguf
  EXAONE_1B_Q80: ${MODEL_DIR}/EXAONE-4.0-1.2B-Q8_0.gguf

  MTP_GEMMA_12B: ${MODEL_DIR}/mtp-gemma-4-12b-it.gguf
  MTP_GEMMA_12B_UNCENS: ${MODEL_DIR}/mtp-gemma-4-12b-it-uncensored.gguf

  # --- MMPROJ FILES ----------------------------------------------------------
  MMPROJ_27B_F16: ${MODEL_DIR}/mmproj-27B-F16.gguf
  MMPROJ_F16: ${MODEL_DIR}/mmproj-F16.gguf
  MMPROJ_GEMMA_F16: ${MODEL_DIR}/mmproj-gemma4-F16.gguf
  MMPROJ_HOLO_31_F16: ${MODEL_DIR}/mmproj-holo-31-F16.gguf
  MMPROJ_QWEN36_27B_F16: ${MODEL_DIR}/mmproj-qwen36-27B-F16.gguf

  # ---------------------------------------------------------------------------
  # CUDA ENV (GGML_CUDA_FA_ALL_QUANTS=ON required for TurboQuant/TCQ on sm_86)
  # ---------------------------------------------------------------------------
  CUDA_ENV: CUDA_VISIBLE_DEVICES=0 GGML_CUDA=1 GGML_CUDA_GRAPHS=1 GGML_CUDA_FA_ALL_QUANTS=1

  # ---------------------------------------------------------------------------
  # SERVER BASE (shared across all forks)
  # ---------------------------------------------------------------------------
  SRV_HOST: --host 127.0.0.1
  SRV_PORT: --port ${PORT}
  SRV_HOST_PORT: ${SRV_HOST} ${SRV_PORT}
  SRV_GPU_LAYERS: --n-gpu-layers all
  SRV_FA: --flash-attn on
  SRV_GPU: ${SRV_GPU_LAYERS} ${SRV_FA}
  SRV_PARALLEL: --parallel 1
  SRV_METRICS: --metrics
  SRV_MLOCK: --mlock
  SRV_NOMMAP: --no-mmap
  SRV_SAFETY: ${SRV_PARALLEL} ${SRV_METRICS} ${SRV_MLOCK} ${SRV_NOMMAP}
  # llama-server API-key auth is DISABLED cluster-wide by simply not passing
  # --api-key at all: backends bind to 127.0.0.1 (local-only) and llama-swap
  # itself handles any edge auth. Passing "--api-key \"\"" renders as a flag
  # with no value, which llama.cpp treats as auth-required (401). Omitting the
  # flag entirely is the verified keyless mode. Recent llama.cpp builds default
  # to auth-on when the flag is present, hence the earlier 401s.
  SRV_BASE: ${SRV_HOST_PORT} ${SRV_GPU} ${SRV_SAFETY}

  # ---------------------------------------------------------------------------
  # FORK-SPECIFIC FLAGS
  # ---------------------------------------------------------------------------
  FORK_BEELLAMA: --kv-unified --no-host --cache-ram 0
  FORK_TURBO: --no-warmup
  FORK_IK: --fit --fit-margin 512 --no-warmup --defrag-thold 0.1

  # ---------------------------------------------------------------------------
  # KV CACHE TYPES
  # ---------------------------------------------------------------------------
  KV_Q8: --cache-type-k q8_0 --cache-type-v q8_0
  KV_TURBO3: --cache-type-k turbo3 --cache-type-v turbo3
  KV_TURBO3_TCQ: --cache-type-k turbo3_tcq --cache-type-v turbo3_tcq
  KV_PRECISE: --cache-type-k q5_0 --cache-type-v q4_1
  KV_BALANCED: --cache-type-k q4_0 --cache-type-v q4_0

  # ---------------------------------------------------------------------------
  # CONTEXT + BATCH
  # ---------------------------------------------------------------------------
  CS_32K: "32768"
  CS_64K: "65536"
  CS_96K: "98304"
  CS_128K: "131072"
  CS_256K: "262144"

  B_4K: "4096"
  B_2K: "2048"
  B_1K: "1024"
  B_512: "512"
  B_256: "256"

  UB_1K: "1024"
  UB_512: "512"
  UB_256: "256"
  UB_128: "128"
  UB_64: "64"

  # Convenience combos
  CTX_32K: --ctx-size ${CS_32K}  -b ${B_2K}  -ub ${UB_512}
  CTX_64K: --ctx-size ${CS_64K}  -b ${B_2K}  -ub ${UB_512}
  CTX_96K: --ctx-size ${CS_96K}  -b ${B_2K}  -ub ${UB_512}
  CTX_128K: --ctx-size ${CS_128K} -b ${B_2K}  -ub ${UB_512}
  CTX_160K: --ctx-size ${CS_160K} -b ${B_1K}  -ub ${UB_512}
  CTX_256K: --ctx-size ${CS_256K} -b ${B_1K}  -ub ${UB_256}

  # ---------------------------------------------------------------------------
  # SPECULATIVE DECODING
  # ---------------------------------------------------------------------------
  SPEC_NONE: ""
  SPEC_DRAFT_SIMPLE: --spec-type draft --model-draft ${DRAFT_SMALL}
  SPEC_DRAFT_MTP: --spec-type draft-mtp

  SPEC_DRAFT_MTP_BASE: --spec-type draft-mtp --model-draft ${MTP_GEMMA_12B}
  SPEC_DRAFT_MTP_UNCENS: --spec-type draft-mtp --model-draft ${MTP_GEMMA_12B_UNCENS}
  SPEC_DRAFT_MTP_QWEN36: --spec-type draft-mtp --model-draft ${QWEN36_27B_MTP_UD_Q4XL}

  SPEC_DFLASH_QWEN: --spec-type dflash --spec-draft-model ${QWEN36_27B_DFLASH_IQ4XS} --spec-draft-ngl all --spec-dflash-cross-ctx 1024
  SPEC_DFLASH_GEMMA: --spec-type dflash --spec-draft-model ${GEMMA_31B_DFLASH_Q4KM} --spec-draft-ngl all --spec-dflash-cross-ctx 1024

  # ---------------------------------------------------------------------------
  # REASONING / SAMPLING
  # ---------------------------------------------------------------------------
  REASONING_OFF: --reasoning off
  REASONING_ON: --reasoning on --chat-template-kwargs '{"preserve_thinking":true}'

  SAMP_CODING: --temp 0.2 --top-p 0.95 --top-k 50
  SAMP_CREATIVE: --temp 0.8 --top-p 0.95
  SAMP_GEMMA: --temp 1.0 --top-p 0.95 --top-k 64

# =============================================================================
# MODEL DEFINITIONS
# =============================================================================
models:
  # ===========================================================================
  # BEELLAMA FORK (Anbeeld) — DFlash + TurboQuant + reasoning loop guard
  # ===========================================================================
  beellama/qwen-flash-64k:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_FLASH_IQ4XS} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_64K} ${KV_Q8} ${REASONING_OFF} ${SPEC_NONE}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "QWEN 3.5 9B Flash · 64K · IQ4_XS"
    description: "Primary local reasoning model, distilled from DeepSeek-V4. High-speed, context-efficient, and optimized for everyday assistant tasks."
    metadata:
      fork: beellama
      context: 65536
      quant: IQ4_XS
      vram: ~9GB
      origin: mradermacher/Qwen3.5-9B-DeepSeek-V4-Flash-i1-GGUF
    aliases:
      - MODEL_PLACEHOLDER_M16
      - gemini-1.5-flash

  beellama/qwen-flash-96k:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_FLASH_IQ4XS} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_96K} ${KV_Q8} ${REASONING_OFF} ${SPEC_NONE}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "QWEN 3.5 9B Flash · 96K · IQ4_XS"
    description: "Expanded context utility model, perfect for parsing long documents and complex local assistance."
    metadata:
      fork: beellama
      context: 98304
      quant: IQ4_XS
      vram: ~11GB
      note: "9B flash — VS Code utility / BYOK safe on 3090"
      origin: mradermacher/Qwen3.5-9B-DeepSeek-V4-Flash-i1-GGUF
    aliases:
      - llama

  beellama/qwen-flash-128k:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_FLASH_IQ4XS} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_128K} ${KV_Q8} ${REASONING_OFF} ${SPEC_NONE}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "QWEN 3.5 9B Flash · 128K · IQ4_XS"
    description: "Max-context utility model, designed for long-form reading, indexing, and persistent local interactions."
    metadata:
      fork: beellama
      context: 131072
      quant: IQ4_XS
      vram: ~13GB
      note: 9B flash
      origin: mradermacher/Qwen3.5-9B-DeepSeek-V4-Flash-i1-GGUF
    aliases:
      - MODEL_PLACEHOLDER_M20
      - MODEL_PLACEHOLDER_M132
      - gemini-1.5-pro
      - gemini-2.0-flash

  beellama/qwen-flash-256k:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_FLASH_IQ4XS} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_128K} ${KV_Q8} ${REASONING_OFF} ${SPEC_NONE}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "QWEN 3.5 9B Flash · 256K* · IQ4_XS"
    description: "Extreme context model, capped to 128K for local VRAM safety on sm_86."
    metadata:
      fork: beellama
      context: 131072
      quant: IQ4_XS
      vram: ~13GB
      warning: "capped to 128k ctx (was 256k) — 9B flash VRAM-safe"
      origin: mradermacher/Qwen3.5-9B-DeepSeek-V4-Flash-i1-GGUF

  beellama/qwen-flash-mtp-64k:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_FLASH_MTP} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_64K} ${KV_Q8} ${SPEC_DRAFT_MTP}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "QWEN 3.5 9B Flash MTP · 64K · Q4_K_M"
    description: "Distilled DeepSeek Flash model with active multi-token prediction (MTP) speculative drafting."
    metadata:
      fork: beellama
      context: 65536
      quant: Q4_K_M
      mtp: true
      origin: Jackrong/Qwen3.5-9B-DeepSeek-V4-Flash-MTP-GGUF

  beellama/qwen-flash-mtp-128k:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_FLASH_MTP} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_128K} ${KV_TURBO3} ${SPEC_DRAFT_MTP}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
      - LLAMA_API_KEY=
    name: "QWEN 3.5 9B Flash MTP · 128K · Q4_K_M"
    description: "Distilled DeepSeek Flash model with active multi-token prediction (MTP) speculative drafting, expanded context."
    metadata:
      fork: beellama
      context: 131072
      quant: Q4_K_M
      mtp: true
      origin: Jackrong/Qwen3.5-9B-DeepSeek-V4-Flash-MTP-GGUF

  # --- Qwen 3.5 9B DFlash drafters (beellama line) --------------------------
  beellama/qwen-flash-dflash-q4km:
    cmd: ${BEELLAMA_BIN} --model ${QWEN35_9B_DFLASH_Q4KM} ${SRV_BASE} ${FORK_BEELLAMA} ${CTX_64K} ${KV_Q8} ${SPEC_NONE}
    env:
      - LD_LIBRARY_PATH=${BEELLAMA_LD}
      - ${CUDA_ENV}
