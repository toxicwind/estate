    env: ["LLAMA_API_KEY=", "LLAMA_ARG_API_KEY="]
  "beellama/gemma-96k":
    cmd: >-
      ${clean_env} ${cuda_env} LD_LIBRARY_PATH=${beellama_ld} ${beellama_bin} --model ${gemma} ${srv_base} ${fork_beellama} ${ctx_96k} ${kv_turbo3_tcq} --jinja ${spec_draft_simple} --spec-draft-model ${draft_small} ${reasoning_beellama_8k} ${sampling_gemma}
    env: ["LLAMA_API_KEY=", "LLAMA_ARG_API_KEY="]
  "beellama/gemma-128k":
    cmd: >-
      ${clean_env} ${cuda_env} LD_LIBRARY_PATH=${beellama_ld} ${beellama_bin} --model ${gemma} ${srv_base} ${fork_beellama} ${ctx_128k} ${kv_turbo3_tcq} --jinja ${spec_ngram} ${reasoning_beellama_8k} ${sampling_gemma}
    env: ["LLAMA_API_KEY=", "LLAMA_ARG_API_KEY="]
  "beellama/gemma-mtp-64k":
