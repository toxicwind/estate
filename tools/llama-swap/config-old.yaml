# ── Routing: Single GPU, only one model at a time ───────────────────────────
# Group router: all models in one exclusive group.
# swap=true: stop same-group siblings when loading new model.
# exclusive=true: stop ALL other running models when loading new model.
# persistent=false: allow eviction.
#
# FIFO scheduler with priority: higher number = served first when queued.
# beellama/qwen-flash=10 means if 5 requests queue, qwen-flash requests jump ahead.

routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          beellama/qwen-flash: 10
          beellama/strange: 5
          beellama/gemma: 3
  router:
    use: group
    settings:
      groups:
        default:
          swap: true
          exclusive: true
          persistent: false
          members:
            - llama
            - beellama/qwen-flash
            - beellama/strange
            - beellama/gemma
            - turboquant/heretic-27b
            - turboquant/mn-grand
            - turboquant/heretic-ud
            - ik_llama/qwen-flash
            - ik_llama/strange
            - ik_llama/heretic-ud
            - ik_llama/heretic-q5
            - ik_turboquant/heretic-27b
            - ik_turboquant/mn-grand
            - ik_turboquant/heretic-ud
            - ik_turboquant/heretic-q5
