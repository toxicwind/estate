# llama-swap.yaml — FIXED from AST/grep matrix
# turboquant (78 turbo-types) = pure quant models
# beellama (52 turbo-types + dflash-profile.h + 43 speculative) = turbo + speculative/dflash
# ik_llama (0 turbo + 22 hadamard + 18 merge + 47 speculative) = hadamard/merge/MTP/spec
# DELETED ik_tq tbqp3 entries — your scan shows ik_tq_ast turboquant-types=0, they would always fail

healthCheckTimeout: 300
logLevel: info
logToStdout: proxy
metricsMaxInMemory: 5000
captureBuffer: 256
globalTTL: 0
startPort: 25001
includeAliasesInList: true
sendLoadingState: false

store:
  path: /home/toxic/.local/share/llama-swap/store.db

performance:
  disabled: false
  every: 5s

hooks:
  on_startup:
    preload:
      - beellama/qwen-flash

macros:
  beellama_bin: /home/toxic/projects/beellama.cpp/build/bin/llama-server
  turbo_bin: /home/toxic/projects/llama-cpp-turboquant/build/bin/llama-server
  ik_bin: /home/toxic/projects/ik_llama.cpp-main/build/bin/llama-server

  beellama_ld: /home/toxic/projects/beellama.cpp/build/bin
  turbo_ld: /home/toxic/projects/llama-cpp-turboquant/build/bin
  ik_ld: /home/toxic/projects/ik_llama.cpp-main/build/bin:/home/toxic/projects/ik_llama.cpp-main/build/src:/home/toxic/projects/ik_llama.cpp-main/build/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build/examples/mtmd

  cuda_env: "CUDA_VISIBLE_DEVICES=0 GGML_CUDA=1 GGML_CUDA_GRAPHS=1 GGML_CUDA_FA_ALL_QUANTS=1"
  base_flags: "--host 127.0.0.1 --port ${PORT} --n-gpu-layers 99 --flash-attn on --parallel 1 --metrics --mlock --no-mmap"
  kv_q4: "--cache-type-k q4_0 --cache-type-v q4_0"
  coding_samplers: "--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"

  qwen_flash: /home/toxic/projects/models/Qwen3.5-9B-DeepSeek-V4-Flash-IQ4_XS.gguf
  strange: /home/toxic/projects/models/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf
  gemma: /home/toxic/projects/models/gemma-4-12B-it-uncensored-Q4_K_M.gguf
  heretic_27b: /home/toxic/projects/models/Qwen3.6-27B-Heretic-Cerebellum-v1-Q2_K_Mixed.gguf
  mn_grand: /home/toxic/projects/models/MN-GRAND-23.5B-Gutenberg-UNCENSORED-V2-Q4_K_M.gguf
  heretic_ud_q4: /home/toxic/projects/models/heretic-UD-27B-Q4_K_XL.gguf
  heretic_ud_q5: /home/toxic/projects/models/heretic-UD-27B-Q5_K_XL.gguf
  draft: /home/toxic/projects/models/Qwen2.5-1.5B-Draft.gguf

models:
  "llama":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${qwen_flash}
      ${base_flags} --ctx-size 131072 -b 4096 -ub 1024 ${kv_q4}
      --jinja --temp 0.85 --top-p 0.95
    name: "Qwen3.5-9B Flash (legacy alias)"
    metadata: { variant: beellama, context: 131072 }

  # ── beellama = ONLY build with turbo + dflash (your dashboard: 52 turbo-types, 56 llama_dflash_ funcs) ──
  "beellama/qwen-flash":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${qwen_flash}
      ${base_flags} --ctx-size 131072 -b 4096 -ub 1024 ${kv_q4}
      --jinja --temp 0.85 --top-p 0.95
    name: "Qwen3.5-9B Flash (131K ctx) [turbo+dflash hybrid]"
    metadata: { variant: beellama, context: 131072, reason: "needs dflash-profile.h, unique to beellama" }

  "beellama/strange":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${strange}
      ${base_flags} --ctx-size 32768 -b 4096 -ub 1024 ${kv_q4}
      --embeddings --pooling cls
      --spec-type draft-simple --spec-draft-model ${draft}
      --spec-draft-ctx-size 4096 --spec-draft-n-max 16 --spec-draft-n-min 2
      --spec-draft-p-split 0.1 --spec-draft-p-min 0
      --temp 0.7 --top-p 0.95 --top-k 50
    name: "StrangeMerges 19.7B + Speculative (32K)"
    metadata: { variant: beellama, speculative: true, context: 32768, reason: "only beellama has both turbo types and llama_dflash_ 56 funcs" }

  "beellama/gemma":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${gemma}
      ${base_flags} --ctx-size 262144 -b 2048 -ub 512 ${kv_q4}
      --jinja
    name: "Gemma 4 12B (262K) [beellama fallback]"
    metadata: { variant: beellama, context: 262144 }

  # ── TQ-cache models MOVED from ik_tq (0 turbo-types) to beellama (52 types) ──
  "beellama/heretic-27b-tbqp3":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${heretic_27b}
      ${base_flags} --ctx-size 262144 -b 1024 -ub 512
      --cache-type-k tbqp3 --cache-type-v tbq3
      --log-format json ${coding_samplers}
    name: "Heretic 27B Q2_K_Mixed (262K, TQ cache) [FIXED: was ik_tq which has 0 turbo-types]"
    metadata: { variant: beellama, context: 262144, cache: tbqp3, fixed_from: ik_turboquant }

  "beellama/heretic-ud-tbqp3":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 114688 -b 2048 -ub 512
      --cache-type-k tbqp3 --cache-type-v tbq3
      --log-format json ${coding_samplers}
    name: "Heretic UD Q4_K_XL (114K, TQ cache)"
    metadata: { variant: beellama, context: 114688, cache: tbqp3 }

  # ── turboquant = EXCLUSIVE owner of 78 turbo-types, no speculative/dflash ──
  "turboquant/heretic-27b":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${heretic_27b}
      ${base_flags} --ctx-size 262144 -b 1024 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic 27B Q2_K_Mixed (262K, q4_0 KV) [pure turbo]"
    metadata: { variant: turboquant, context: 262144, reason: "78 turbo-types AST, strongest turbo quant support" }

  "turboquant/mn-grand":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${mn_grand}
      ${base_flags} --ctx-size 81920 -b 4096 -ub 1024 ${kv_q4}
      --log-format json --no-context-shift --jinja
      --temp 0.9 --repeat-penalty 1.05 --repeat-last-n 256
    name: "MN-GRAND 23.5B (82K, VRAM-bound)"
    metadata: { variant: turboquant, context: 81920 }

  "turboquant/heretic-ud":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 114688 -b 2048 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic UD Q4_K_XL (114K)"
    metadata: { variant: turboquant, context: 114688 }

  # ── ik_llama = EXCLUSIVE owner of hadamard 22, merge 18, speculative 47, MTP ──
  "ik_llama/gemma":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${gemma}
      ${base_flags} --ctx-size 262144 -b 2048 -ub 512 ${kv_q4}
      --jinja
    name: "Gemma 4 12B Uncensored (262K, MTP-capable) [ik owns hadamard/merge]"
    metadata: { variant: ik_llama, context: 262144, reason: "ik README PR #1744 MTP, plus 22 hadamard-features AST" }

  "ik_llama/heretic-ud":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 114688 -b 2048 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic UD Q4_K_XL (ik, 114K)"
    metadata: { variant: ik_llama, context: 114688 }

  "ik_llama/heretic-q5":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q5}
      ${base_flags} --ctx-size 49152 -b 2048 -ub 512 ${kv_q4}
      --log-format json ${coding_samplers}
    name: "Heretic UD Q5_K_XL (ik, 49K)"
    metadata: { variant: ik_llama, context: 49152 }

  "ik_llama/qwen-flash":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${qwen_flash}
      ${base_flags} --ctx-size 131072 -b 4096 -ub 1024 ${kv_q4}
      --log-format json --temp 0.85 --top-p 0.95
    name: "Qwen3.5-9B Flash (ik, 131K) [no turbo needed]"
    metadata: { variant: ik_llama, context: 131072 }

routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          beellama/qwen-flash: 10
          ik_llama/gemma: 5
  router:
    use: group
    settings:
      groups:
        default:
          swap: true
          exclusive: true
          persistent: false
          members:
            - llama
            - beellama/qwen-flash
            - beellama/strange
            - beellama/gemma
            - beellama/heretic-27b-tbqp3
            - beellama/heretic-ud-tbqp3
            - turboquant/heretic-27b
            - turboquant/mn-grand
            - turboquant/heretic-ud
            - ik_llama/qwen-flash
            - ik_llama/gemma
            - ik_llama/heretic-ud
            - ik_llama/heretic-q5