# =============================================================================
# deploy/manifest.yaml — DECLARED intent (what SHOULD be running).
# =============================================================================
# Owned by ferrous-warden (Ember's crew), WS2 2026-09-20.
# This file declares DESIRED STATE. Runtime state (what is actually running,
# /proc, runtime_paths) is fact. bin/estate-reconcile diffs intent vs fact and
# converges fact toward intent — never the reverse.
#
# Declared-vs-runtime contract:
#   declared = this file + declared_configs below + pitchfork.toml: intent.
#             Changes ONLY via commits or the content-hash-gated deploy scripts
#             (bin/herd-deploy, bin/estate-reconcile --apply). A daemon or agent
#             rewriting declared state by hand is drift, not an edit.
#   runtime  = process table, /proc/*/exe, runtime_paths below: fact. The
#             reconciler reads it; it never converges toward it. Daemons may
#             write under runtime_paths freely — they are EXEMPT from drift
#             detection by construction (this is what makes the old
#             openfang-health rewrite of agent.toml impossible: declared TOML,
#             runtime JSON in different places).
#
# Restore rules (estate-reconcile --apply):
#   - binary with immutable_copy: restored atomically (tmp + rename) from the
#     immutable copy, only if the copy's sha256 matches the declared sha256.
#   - binary with git_path (repo-tracked script): restored from git HEAD only
#     if `git verify-commit HEAD` passes AND git's copy matches declared sha.
#     Unsigned HEAD -> alert only, no restore (unsigned-HEAD test).
#   - binary with neither: CHECK ONLY (alert). Rebuild, re-record, redeploy.
#   - declared_configs are REPORT-ONLY in this workstream: the tree is shared
#     with ~198 dirty files from other crews, so auto-restoring configs from
#     git would nuke live WIP. estate-reconcile check lists them as DIRTY
#     (informational, no squawk); a signed-HEAD config converge is future work.
