name: Sovereign Projects Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace:
    name: Validate Sovereign Monorepo Workspace & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Topology Structure
        run: |
          for dir in config docs engines ops scripts tests tools; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing core workspace directory: $dir"
              exit 1
            fi
            echo "✅ Workspace $dir present"
          done

      - name: Validate Shell Script Syntax
        run: |
          find . -maxdepth 3 -name "*.sh" -not -path "*/node_modules/*" -not -path "*/target/*" -exec bash -n {} +

      - name: Fetch gitignore templates (nested github/gitignore pin)
        run: |
          sha=$(git ls-files -s ops/gitignore/templates | awk '{print $2}')
          rm -rf ops/gitignore/templates
          git clone --quiet https://github.com/github/gitignore.git ops/gitignore/templates
          git -C ops/gitignore/templates checkout --quiet "$sha"
      - name: gitignore manifest in sync
        run: bun ops/bin/gitignore-sync.ts --check
