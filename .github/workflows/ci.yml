name: Estate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace validation & shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify workspace topology
        run: |
          for dir in qed herd mesh yote shell scripts ops docs; do
            [ -d "$dir" ] || { echo "missing: $dir"; exit 1; }
          done
      - name: Shell syntax
        run: find scripts ops/bin -name "*.sh" -exec bash -n {} +
      - name: gitignore manifest in sync
        run: bun ops/bin/gitignore-sync.ts --check
