name: Sovereign Projects Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace:
    name: Validate Sovereign Monorepo Workspace & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # NOTE: submodules intentionally NOT fetched — the tree carries engine
        # gitlinks (engines/herd/*, sigma, skills-hub, tools/pd-mcp-standalone)
        # with no .gitmodules URL (estate policy: declare a submodule only when
        # the checkout is on disk with its own .git). The one pin CI needs
        # (ops/gitignore/templates) is fetched manually at its pinned SHA below.
        uses: actions/checkout@v4

      - name: Fetch gitignore templates
        run: |
          rm -rf ops/gitignore/templates
          mkdir -p ops/gitignore/templates
          curl -sL https://github.com/github/gitignore/archive/62f3997f1917b30f6eaee0c53ac2d791426513f2.tar.gz \
            | tar -xz -C ops/gitignore/templates --strip-components=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Topology Structure
        run: |
          for dir in config docs engines ops scripts tests tools; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing core workspace directory: $dir"
              exit 1
            fi
            echo "✅ Workspace $dir present"
          done

      - name: Validate Shell Script Syntax
        run: |
          find . -maxdepth 3 -name "*.sh" -not -path "*/node_modules/*" -not -path "*/target/*" -exec bash -n {} +

      - name: Fetch gitignore templates (nested github/gitignore pin)
        run: |
          sha=$(git ls-files -s ops/gitignore/templates | awk '{print $2}')
          rm -rf ops/gitignore/templates
          git clone --quiet https://github.com/github/gitignore.git ops/gitignore/templates
          git -C ops/gitignore/templates checkout --quiet "$sha"
      - name: gitignore manifest in sync
        run: bun ops/bin/gitignore-sync.ts --check
