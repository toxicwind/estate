name: Sovereign CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-test:
    name: Sovereign stack tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Web UI tests
        run: bun test tests/open_web_uis.test.ts
      - name: Ports & infrastructure tests
        run: bun test tests/ports.test.ts
      - name: Shell syntax (scripts)
        run: |
          for script in scripts/*.sh; do
            [ -f "$script" ] && bash -n "$script"
          done
      - name: Health-check script syntax
        run: |
          bash -n scripts/health-check.sh
          bash -n scripts/open-web-uis.sh
