# ROUTING — Single GPU, exclusive group, ALL models prioritized (complete)
# ═══════════════════════════════════════════════════════════════════════════════
routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          # Daily drivers (highest)
          beellama/qwen-flash: 25
          beellama/qwen-flash-256k: 24
          beellama/qwen-flash-128k: 23
          beellama/qwen-flash-64k-coding: 22
          # Gemma
          ik_llama/gemma: 20
          beellama/gemma-128k: 19
          beellama/gemma-96k: 18
          beellama/gemma-64k: 17
          beellama/gemma-256k-experimental: 0
          # Heretic Cerebellum (best benchmarks)
          turboquant/heretic-27b: 16
          turboquant/heretic-27b-256k: 15
          turboquant/heretic-27b-128k: 14
          turboquant/heretic-27b-128k-thinking: 1
          # Heretic UD / Q5
          turboquant/heretic-ud: 13
          ik_llama/heretic-ud-96k: 12
          ik_llama/heretic-ud-64k: 11
          turboquant/heretic-q5: 10
          # MN-GRAND
          turboquant/mn-grand: 8
          turboquant/mn-grand-128k: 7
          turboquant/mn-grand-96k: 6
          turboquant/mn-grand-64k: 5
          # Strange + experimental TQ
          beellama/strange: 4
          beellama/strange-64k: 3
          ik_turboquant/heretic-27b-256k: 2
          ik_turboquant/heretic-ud-96k: 1

  router:
    use: group
    settings:
      groups:
        default:
          swap: true
          exclusive: true
          persistent: false
          members:
            - beellama/qwen-flash
            - beellama/qwen-flash-128k
            - beellama/qwen-flash-256k
            - beellama/qwen-flash-64k-coding
            - turboquant/heretic-27b
            - turboquant/heretic-27b-256k
            - turboquant/heretic-27b-128k
            - turboquant/heretic-27b-128k-thinking
            - ik_llama/gemma
            - beellama/gemma-128k
            - beellama/gemma-96k
            - beellama/gemma-64k
            - beellama/gemma-256k-experimental
            - turboquant/heretic-ud
            - ik_llama/heretic-ud-96k
            - ik_llama/heretic-ud-64k
            - turboquant/heretic-q5
            - turboquant/mn-grand
            - turboquant/mn-grand-128k
            - turboquant/mn-grand-96k
            - turboquant/mn-grand-64k
            - beellama/strange
            - beellama/strange-64k
            - ik_turboquant/heretic-27b-256k
            - ik_turboquant/heretic-ud-96k
