    description: "Matches json id. Experimental merge — context UNVERIFIED, test before trusting."
    metadata:
      variant: beellama
      speculative: true
      context: 65536
      quant: Q4_K_M
      vram_estimate_gb: "~14.7"
      warning: "ZERO upstream documentation. Monitor for quality degradation vs 32K."
      best_for: "Creative coding + RAG embeddings experiments"
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 65536

  # ═══════════════════════════════════════════════════════════════════════════
  # RICH LONG-NAMED VARIANTS + EXPERIMENTAL (used by priority routing)
