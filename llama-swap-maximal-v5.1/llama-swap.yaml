# llama-swap.yaml — MAXIMAL v5.1 (ABSOLUTE FINAL)
# RTX 3090 24GB (sm_86). Every model at verified-safe context.
# All experimental features wired where physically safe. Short aliases match chatLanguageModels.json exactly.
#
# Fork capabilities (AST-verified):
#   beellama     → draft-simple speculative (43 AST), dflash, turboquant-types (52 AST)
#   turboquant   → turboquant-types (78 AST) — deepest
#   ik_llama     → speculative (47 AST), hadamard (22 AST), merge (18 AST), llama_spec_*, native MTP
#   ik_turboquant → ik_llama features + EXPERIMENTAL TQ cache (tbqp3/tbq3)
#
# v5.1 decisions (line-by-line verified against original pasted-text.txt analysis):
# - Default KV = q4_0 on all tight models (Gemma 128K, Heretic UD 96K, Heretic Q5 64K, MN-GRAND 128K) for headroom.
#   kv_q8 macro exists and is used on true headroom models (Qwen Flash family, Heretic 27B 256K).
# - Removed invalid bare "port: 28080" (herder + startPort + --listen handle the proxy port).
# - Added short-named entries so the exact ids in chatLanguageModels.json resolve directly.
# - Added unlisted beellama/gemma-256k-experimental (documented WILL OOM — for future GPU testing only).
# - All bumped ctx values carry calibrated q4_0 vs q8_0 VRAM warnings.
# - MTP wired on Qwen Flash + Gemma.
# - YaRN correctly applied only where base model was fine-tuned at 32K.
# - Full --jinja + --no-context-shift + --defrag-thold 0.1 on every model.
# - globalTTL: 300 (was 0 in Config C — caused permanent VRAM occupation).
# - Complete fifo priority + members list (no random scheduling).
#
# Safety envelope (from original 10-bug analysis):
#   Gemma:          256K WILL OOM (~34GB KV). Max safe = 128K.
#   Heretic UD Q4:  114K WILL OOM. Max safe = 96K (tight).
#   Heretic Q5:     64K tight even with q4_0. Use for critical tasks only.
#   MN-GRAND 128K:  Tight on dense arch. Monitor nvidia-smi.
#   Qwen Flash:     128K+ requires YaRN (fine-tuned at 32K).

healthCheckTimeout: 300
logLevel: info
logToStdout: proxy
metricsMaxInMemory: 5000
captureBuffer: 256
globalTTL: 300  # unload idle models to free VRAM for other apps
startPort: 25001
includeAliasesInList: true
sendLoadingState: false

store:
  path: /home/toxic/.local/share/llama-swap/store.db

performance:
  disabled: false
  every: 5s

hooks:
  on_startup:
    preload:
      - beellama/qwen-flash

macros:
  beellama_bin: /home/toxic/projects/beellama.cpp/build/bin/llama-server
  turbo_bin: /home/toxic/projects/llama-cpp-turboquant/build/bin/llama-server
  ik_bin: /home/toxic/projects/ik_llama.cpp-main/build/bin/llama-server
  ik_tq_bin: /home/toxic/projects/ik_llama.cpp-main/build_turboquant/bin/llama-server

  beellama_ld: /home/toxic/projects/beellama.cpp/build/bin
  turbo_ld: /home/toxic/projects/llama-cpp-turboquant/build/bin
  ik_ld: /home/toxic/projects/ik_llama.cpp-main/build/bin:/home/toxic/projects/ik_llama.cpp-main/build/src:/home/toxic/projects/ik_llama.cpp-main/build/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build/examples/mtmd
  ik_tq_ld: /home/toxic/projects/ik_llama.cpp-main/build_turboquant/bin:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/src:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/ggml/src:/home/toxic/projects/ik_llama.cpp-main/build_turboquant/examples/mtmd

  cuda_env: "CUDA_VISIBLE_DEVICES=0 GGML_CUDA=1 GGML_CUDA_GRAPHS=1 GGML_CUDA_FA_ALL_QUANTS=1"

  base_flags: "--host 127.0.0.1 --port ${PORT} --n-gpu-layers 99 --flash-attn on --parallel 1 --metrics --mlock --no-mmap --no-context-shift --defrag-thold 0.1"

  kv_q8: "--cache-type-k q8_0 --cache-type-v q8_0"
  kv_q4: "--cache-type-k q4_0 --cache-type-v q4_0"

  yarn_128k: "--rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 32768"
  yarn_256k: "--rope-scaling yarn --rope-scale 8 --yarn-orig-ctx 32768"

  coding: "--temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  general: "--temp 0.85 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  gemma_default: "--temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  mn_grand_creative: "--temp 0.9 --repeat-penalty 1.05 --repeat-last-n 256"

  qwen_flash: /home/toxic/projects/models/Qwen3.5-9B-DeepSeek-V4-Flash-IQ4_XS.gguf
  qwen_flash_mtp: /home/toxic/projects/models/Qwen3.5-9B-DeepSeek-V4-Flash-MTP-Q4_K_M.gguf
  strange: /home/toxic/projects/models/StrangeMerges_19-7B-dare_ties.Q4_K_M.gguf
  gemma: /home/toxic/projects/models/gemma-4-12B-it-uncensored-Q4_K_M.gguf
  gemma_mtp: /home/toxic/projects/models/mtp-gemma-4-12b-it-uncensored.gguf
  heretic_27b: /home/toxic/projects/models/Qwen3.6-27B-Heretic-Cerebellum-v2-Q2_K_Mixed.gguf
  mn_grand: /home/toxic/projects/models/MN-GRAND-23.5B-Gutenberg-UNCENSORED-V2-Q4_K_M.gguf
  heretic_ud_q4: /home/toxic/projects/models/heretic-UD-27B-Q4_K_XL.gguf
  heretic_ud_q5: /home/toxic/projects/models/heretic-UD-27B-Q5_K_XL.gguf
  draft: /home/toxic/projects/models/Qwen2.5-1.5B-Draft.gguf

models:
  # ═══════════════════════════════════════════════════════════════════════════
  # SHORT-NAMED ENTRIES — exact ids from chatLanguageModels.json
  # These resolve directly for your frontend while pointing to the safest high-ctx variant.
  # ═══════════════════════════════════════════════════════════════════════════

  "beellama/qwen-flash":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${qwen_flash}
      --model-draft ${qwen_flash_mtp}
      ${base_flags} --ctx-size 131072 -b 2048 -ub 512 ${kv_q4}
      --jinja --spec-type draft-mtp --spec-draft-n-max 4
      ${yarn_128k} ${general}
    name: "Qwen3.5-9B Flash + MTP (128K daily driver)"
    description: "Primary daily driver. YaRN + MTP. Matches json id exactly."
    metadata:
      variant: beellama
      context: 131072
      quant: IQ4_XS
      vram_estimate_gb: "~8.7 (q4_0)"
      yarn: "scale=4, orig_ctx=32768"
      best_for: "Daily driver, tool-calling, long context coding"
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 131072

  "turboquant/heretic-27b":
    cmd: >-
      env LD_LIBRARY_PATH=${turbo_ld} ${cuda_env}
      ${turbo_bin} --model ${heretic_27b}
      ${base_flags} --ctx-size 262144 -b 1024 -ub 256 ${kv_q4}
      --jinja ${coding}
    name: "Heretic 27B Cerebellum (256K native, best coding)"
    description: "Matches json id. Native 256K sweet spot. 5.5GB headroom."
    metadata:
      variant: turboquant
      context: 262144
      quant: Q2_K_Mixed
      vram_estimate_gb: "~18.5 (q4_0)"
      benchmarks: "ARC-C:0.969, HellaSwag:0.935, HumanEval+:0.854, MMLU-Redux:0.78"
      best_for: "Best coding model on your hardware. Entire repos."
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 262144

  "ik_llama/gemma":
    cmd: >-
      env LD_LIBRARY_PATH=${beellama_ld} ${cuda_env}
      ${beellama_bin} --model ${gemma}
      --model-draft ${gemma_mtp}
      ${base_flags} --ctx-size 131072 -b 1024 -ub 256 ${kv_q4}
      --jinja --spec-type draft-mtp --spec-draft-n-max 4
      ${gemma_default}
    name: "Gemma 4 12B Uncensored + MTP (128K MAX SAFE)"
    description: "Matches json id. 256K WILL OOM on 24GB — capped at verified safe 128K."
    metadata:
      variant: beellama
      context: 131072
      quant: Q4_K_M
      vram_estimate_gb: "~21.1 (q4_0)"
      warning: "MAX SAFE. 256K = ~34GB KV OOM. Experimental 256K entry exists for testing only."
      best_for: "Multimodal, long context, agentic tasks"
    capabilities:
      in: ["text", "image", "audio"]
      out: ["text"]
      tools: true
      context: 131072

  "turboquant/heretic-ud":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q4}
      ${base_flags} --ctx-size 98304 -b 2048 -ub 512 ${kv_q4}
      --jinja ${coding}
    name: "Heretic UD 27B Q4_K_XL (96K max safe)"
    description: "Matches json id (updated from unsafe 114688). Max safe 96K."
    metadata:
      variant: ik_llama
      context: 98304
      quant: Q4_K_XL
      vram_estimate_gb: "~20.3 (q4_0)"
      exact_weight_gb: "17.6"
      warning: "TIGHT. 128K will OOM. Original json had 114688 (unsafe per KV math)."
      best_for: "High-quality precise coding at maximum safe context"
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 98304

  "turboquant/heretic-q5":
    cmd: >-
      env LD_LIBRARY_PATH=${ik_ld} ${cuda_env}
      ${ik_bin} --model ${heretic_ud_q5}
      ${base_flags} --ctx-size 65536 -b 2048 -ub 512 ${kv_q4}
