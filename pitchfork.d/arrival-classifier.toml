# ---- project: ranch/rustdesk-server (2 daemons) ----
# rustdesk-server 1.1.16 official release binaries (ranch/rustdesk-server/amd64/).
# hbbs -p 25221: binds 25220 (nat test), 25221 (tcp+udp), 25223 (ws); also UDP 25221.
# hbbr -p 25222: binds 25222 (relay) + 25224 (ws relay). Ports SSOT: config/ports.env
# (RUSTDESK_* keys). -r advertises the relay to clients over the tailnet IP.
# Keypair (id_ed25519[.pub]) generated in the workdir on first run; gitignored.
# No HTTP health endpoint exists — pitchfork supervises via ready_cmd TCP check only.
