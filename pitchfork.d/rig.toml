# estate — project-owned daemon manifest. Source of truth for 'rig'.
# Owned by the estate project; the parent only composes it.

[daemons.rig]
# Rig Agent OS kernel daemon (API server + kernel)
port = 25196
run = "exec /home/toxic/.local/bin/rig start"
dir = "/home/toxic"
mise = false
retry = true
ready_cmd = "ss -ltn 'sport = :25196' | grep -q LISTEN"
health_port = { port = 25196, interval = "30s", timeout = "5s", retries = 3 }
env = { RIG_CONFIG = "/home/toxic/.rig/config.toml" }
boot_start = true
auto = ["start"]
