# sovereign — project-owned daemon manifest. Source of truth for 'grafana'.
# Owned by the sovereign project; the parent only composes it.


[daemons.grafana]
port = 25110
run = "exec ./stack/services/grafana-mesh.sh"
dir = "."
mise = true
retry = true
ready_http = "http://127.0.0.1:25110/api/health"
health_http = { url = "http://127.0.0.1:25110/health", interval = "30s", timeout = "5s", retries = 3 }
auto = ["start"]
