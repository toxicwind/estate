# sovereign — project-owned daemon manifest. Source of truth for 'agent-viewer'.
# Owned by the sovereign project; the parent only composes it.


[daemons.agent-viewer]
# Forge 2026-09-21: noVNC web viewer for the agent display.
port = 6080
run = "exec /home/toxic/.local/bin/websockify --web /home/toxic/.browserless/novnc 127.0.0.1:6080 127.0.0.1:5900"
dir = "."
mise = false
retry = true
ready_http = "http://127.0.0.1:6080/"
health_http = { url = "http://127.0.0.1:6080/", interval = "30s", timeout = "5s", retries = 3 }
boot_start = true
auto = ["start"]
