[daemons.agent-viewer]
# Forge 2026-09-21: noVNC web viewer for the agent display.
# 2026-10-24: migrated from archive/ paths to LIVE websockify (pipx) + live
# noVNC (pens/ranch/stable/novnc). Monolith is live truth.
mise = true
port = 6080
run = "exec /home/toxic/.local/bin/websockify --web /home/toxic/pens/ranch/stable/novnc 127.0.0.1:6080 127.0.0.1:5900"
dir = "."
retry = true
ready_http = "http://127.0.0.1:6080/"
health_http = { url = "http://127.0.0.1:6080/", interval = "30s", timeout = "5s", retries = 3 }
boot_start = true
auto = ["start"]
