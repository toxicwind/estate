# ranch/hatch/kite-cli — project-owned daemon manifest. Source of truth for 'kite-daemon'.
# Owned by the kite-cli project; the parent only composes it.
# kite-daemon holds one warm kite-cli Gateway connection and serves
# kite-fast clients over ~/.config/kite-cli/daemon.sock (see daemon.py).
[daemons.kite-daemon]
mise = true
run = "exec /home/toxic/.local/bin/kite-daemon"
dir = "/home/toxic/pens/ranch/hatch/kite-cli"
retry = true
boot_start = true
ready_cmd = "test -S /home/toxic/.config/kite-cli/daemon.sock"
