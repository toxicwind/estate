[daemons.nginx]
port = 25208
run = "exec /usr/bin/nginx -c /home/toxic/estate/ops/nginx/nginx.conf -g 'daemon off; pid /tmp/nginx-pitchfork.pid;'"
dir = "."
mise = false
retry = true
ready_cmd = "ss -ltn 'sport = :25208' | grep -q LISTEN"
depends = ["gatehouse"]
auto = ["start"]

