[daemons.yote-relay]
health_http = { url = "http://127.0.0.1:25102/health", interval = "30s", timeout = "5s", retries = 3 }
port = 25102
run = "exec bun run src/yote.ts"
dir = "ranch/yote"
mise = false
retry = true
ready_http = "http://127.0.0.1:25102/health"
depends = ["gatehouse"]
env = { OPENFANG_URL = "http://127.0.0.1:25196", HODOS_URL = "http://127.0.0.1:25193/v1", YOTE_HODOS_FALLBACK_MODEL = "z-ai/glm-5.3-flash" }
auto = ["start"]

