[daemons.yote]
health_http = { url = "http://127.0.0.1:25102/health", interval = "30s", timeout = "5s", retries = 3 }
mise = true
port = 25102
run = "exec bun run src/yote.ts"
dir = "ranch/yote"
retry = true
ready_http = "http://127.0.0.1:25102/health"

env = { OPENFANG_URL = "http://127.0.0.1:25196", RHODOCHROSITE_URL = "http://127.0.0.1:25193/v1", YOTE_RHODOCHROSITE_FALLBACK_MODEL = "z-ai/glm-5.3-flash" }
auto = ["start"]
