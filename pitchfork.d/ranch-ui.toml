# ranch-ui — the consolidated ranch dashboard (ranch/range/ui). Serves the
# built SPA from dist and proxies /api/bornite + /api/rhodochrosite same-origin, so the
# dashboard's apiBase shim resolves to this host. Built 2026-10-14 by merging
# the 368bdf6 master back into range/ui (see range/ui/CONSOLIDATION.md).
# Tailnet-only: tailscale serve fronts it; nothing binds 0.0.0.0.

[daemons.ranch-ui]
mise = true
port = 25218
run = "exec /home/toxic/.bun/bin/bun run /home/toxic/pens/estate/stack/services/ranch-ui.ts"
dir = "/home/toxic/pens/estate"
retry = true
env = { RANCH_UI_PORT = "25218", RANCH_UI_DIST = "/home/toxic/pens/ranch/range/ui/dist", BORNITE_ORIGIN = "http://127.0.0.1:25100", RHODOCHROSITE_ORIGIN = "http://127.0.0.1:25193" }
ready_http = "http://127.0.0.1:25218/health"
health_http = { url = "http://127.0.0.1:25218/health", interval = "30s", timeout = "5s", retries = 3 }
auto = ["start"]
