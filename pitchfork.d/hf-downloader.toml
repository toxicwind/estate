[daemons.hf-downloader]
port = 25226
run = "exec ./stack/services/hf-downloader-mesh.sh"
dir = "."
env_file = "config/ports.env"
mise = true
retry = true
ready_http = "http://127.0.0.1:25226/api/health"
health_http = { url = "http://127.0.0.1:25226/health", interval = "30s", timeout = "5s", retries = 3 }
depends = ["gatehouse"]
auto = ["start"]

