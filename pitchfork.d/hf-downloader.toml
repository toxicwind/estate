# sovereign — project-owned daemon manifest. Source of truth for 'hf-downloader'.
# Owned by the sovereign project; the parent only composes it.


[daemons.hf-downloader]
port = 25106
run = "exec ./stack/services/hf-downloader-mesh.sh"
dir = "."
mise = true
retry = true
ready_http = "http://127.0.0.1:25106/api/health"
health_http = { url = "http://127.0.0.1:25106/health", interval = "30s", timeout = "5s", retries = 3 }
depends = ["gatehouse"]
auto = ["start"]
