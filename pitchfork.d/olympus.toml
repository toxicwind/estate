[daemons.olympus]
health_http = { url = "http://127.0.0.1:25144/health", interval = "30s", timeout = "5s", retries = 3 }
mise = true
port = 25144
# Olympus — consolidated estate knowledge hub (API + web). Serves the registry
# of every scattered knowledge location and the recovered artifacts
# (github sort algorithm, recursive-agents study) as one first-class surface.
# MCP tools are provided by ranch/olympus/mcp.ts (stdio) for the gatehouse.
run = "exec bun /home/toxic/estate/ranch/olympus/api.ts"
dir = "/home/toxic/estate"
retry = true
boot_start = true
ready_http = "http://127.0.0.1:25144/health"
auto = ["start"]