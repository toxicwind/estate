# sovereign — project-owned daemon manifest. Source of truth for 'rust-web'.
# Owned by the sovereign project; the parent only composes it.


[daemons.rust-web]
port = 25201
run = "exec ./stack/services/rust-web.sh"
dir = "."
mise = true
retry = true
ready_http = "http://127.0.0.1:25201/health"
health_http = { url = "http://127.0.0.1:25201/health", interval = "30s", timeout = "5s", retries = 3 }
depends = ["gatehouse"]
auto = ["start"]
