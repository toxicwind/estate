# sovereign — project-owned daemon manifest. Source of truth for 'kimi-auto-shim'.
# Owned by the sovereign project; the parent only composes it.


[daemons.kimi-auto-shim]
health_http = { url = "http://127.0.0.1:25153/health", interval = "30s", timeout = "5s", retries = 3 }
port = 25153
# Router-configured alias forwarder: same routing as the herd
# kimi-auto entry (--config-dir fragment). --target/--standby/--advance-on
# MUST match /home/toxic/estate/config/herd.d/kimi-auto.yaml. Selection lives
# in router config; this shim never selects models.
# 2026-09-21 (ember-kimi-route): maximal free-Kimi chain per Chris doctrine
# -- Kimi routes are never defaults; they route Kimi FREE models maximally.
# Chain: openrouter-free kimi :free IDs -> hf-free Kimi-K3; advance on
# 5xx/conn/429/402/404; 401 never advances. Paid Kimi excluded (free only).
run = "exec python3 /home/toxic/estate/config/herd.d/alias-shim.py --port ${KIMI_AUTO_SHIM_PORT} --target openrouter-free/moonshotai/kimi-k3:free --standby openrouter-free/moonshotai/kimi-k2.6:free --standby openrouter-free/moonshotai/kimi-k2.5:free --standby openrouter-free/moonshotai/kimi-k2.7-code:free --standby hf-free/moonshotai/Kimi-K3 --standby nim-kimi/moonshotai/kimi-k3 --advance-on 5xx,conn,429,402,404 --name kimi-auto"
dir = "/home/toxic/estate/config/herd.d"
mise = false
retry = true
boot_start = true
ready_http = "http://127.0.0.1:25153/health" # 2026-09-20: literal, was ${KIMI_AUTO_SHIM_PORT}=25105
env = { KIMI_AUTO_SHIM_PORT = "25153", SHIM_CONNECT_TIMEOUT = "240" }
auto = ["start"]
