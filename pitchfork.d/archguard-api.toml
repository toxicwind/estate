# toxicwind/archguard integration — deterministic audit API (Express, :4000).
# (Composer fragment re-landing 2026-10-23; see the sibling archguard-falkordb
# fragment for the owning-layer lesson.)
#
# LLM-free by default: no provider keys are set here — extractor/advisor fall
# back to deterministic synthesizers and the Auditor agent is Cypher-only by
# construction (Phase-1 proof lived in forge-archguard-p1/EVIDENCE.md).
[daemons.archguard-api]
run = "exec /home/toxic/estate/ranch/barn/archguard/node_modules/.bin/tsx src/server.ts"
dir = "/home/toxic/estate/ranch/barn/archguard"
mise = false
retry = true
boot_start = true
auto = ["start"]
env = { PORT = "4000", FALKORDB_HOST = "127.0.0.1", FALKORDB_PORT = "6379", FALKORDB_GRAPH_NAME = "archguard_estate" }
ready_http = "/api/health"
