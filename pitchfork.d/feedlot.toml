[daemons.feedlot]
port = 25121
run = "exec /home/toxic/estate/stack/services/feedlot.sh"
dir = "."
mise = true
retry = true
# The Go MCP server only serves the EndPoint path - no /health route exists.
ready_http = "http://127.0.0.1:25121/mcp-completion"
health_http = { url = "http://127.0.0.1:25121/mcp-completion", interval = "30s", timeout = "5s", retries = 3 }
depends = ["gatehouse"]
auto = ["start"]

# estate — project-owned daemon manifest. Source of truth for 'coyote'.
# Owned by the estate project; the parent only composes it.
