# estate — project-owned daemon manifest. Source of truth for 'redis'.
# Owned by the estate project; the parent only composes it.


[daemons.redis]
run = "exec valkey-server --port 25203 --bind 0.0.0.0 --protected-mode no --save '' --appendonly no" # 25203 == $REDIS_PORT (SSOT); literal: ${} not expanded in run lines. Moved 2026-10-14 off :25199 (squatted by hatch/shim_mcp.py).
dir = "."
mise = false
retry = true
ready_port = 25203
auto = ["start"]
