# sovereign — project-owned daemon manifest. Source of truth for 'redis'.
# Owned by the sovereign project; the parent only composes it.


[daemons.redis]
run = "exec valkey-server --port 25199 --bind 0.0.0.0 --protected-mode no --save '' --appendonly no" # 25199 == $REDIS_PORT (SSOT); literal: ${} not expanded in run lines
dir = "."
mise = false
retry = true
ready_port = 25199
auto = ["start"]
