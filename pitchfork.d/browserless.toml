[daemons.browserless]
mise = true
dir = "."
run = "exec /home/toxic/pens/ranch/stable/server/run.sh"
env = { BROWSERLESS_PORT = "25130", HOST = "127.0.0.1", DISPLAY = ":99", XDG_RUNTIME_DIR = "/run/user/1000" }
# Monolith is live truth (pitchfork.toml [daemons.browserless]). ready_port
# (TCP-listen) because browserless has NO public 200 route — ready_http hitting
# "/" 404s and pitchfork waits forever. 2026-10-24.
ready_port = 25130
depends = ["thresher"]
auto = ["start"]
