# sovereign — project-owned daemon manifest. Source of truth for 'byte-vision'.
# Owned by the sovereign project; the parent only composes it.


[daemons.byte-vision]
port = 25121
run = "exec ./stack/services/byte-vision.sh"
dir = "."
mise = true
retry = true
ready_http = "http://127.0.0.1:25121/health"
health_http = { url = "http://127.0.0.1:25121/health", interval = "30s", timeout = "5s", retries = 3 }
depends = ["gatehouse"]
auto = ["start"]
