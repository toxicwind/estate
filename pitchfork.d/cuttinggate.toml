[daemons.cuttinggate]
# 2026-10-15: run via serve wrapper — client keys come from the vault
# (CUTTINGGATE_CLIENT_KEY); the bare def had zero client keys configured, so
# every Bearer token was rejected with auth_missing.
run = "exec /home/toxic/estate/ranch/forge/router/cuttinggate/cuttinggate-serve.sh"
dir = "/home/toxic/estate/ranch/forge/router/cuttinggate"
retry = true
ready_http = "http://127.0.0.1:25200/health"
health_http = { url = "http://127.0.0.1:25200/health", interval = "30s", timeout = "5s", retries = 3 }
env = { CUTTINGGATE_PORT = "25200", CUTTINGGATE_LOG_LEVEL = "info" }
auto = ["start"]

