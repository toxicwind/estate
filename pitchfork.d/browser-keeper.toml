[daemons.browser-keeper]
port = 25154
# The keeper launches a HEADED chromium on DISPLAY :99, so it cannot come up
# without agent-display (Xvnc :99). Undeclared, the keeper started anyway and
# relaunch-looped on "Missing X server or $DISPLAY" every 5s. That left the
# browserless MCP server refusing to start ("keeper CDP not answering"), and
# every omp startup paid for the failed connect. The dependency is real, so
# it is declared here instead of being discovered again after a reboot.
depends = ["agent-display"]
run = "exec /home/toxic/.bun/bin/bun run /home/toxic/estate/ranch/keeper/bin/keeper.ts"
dir = "."
mise = false
retry = true
ready_http = "http://127.0.0.1:25154/"
health_http = { url = "http://127.0.0.1:25154/", interval = "30s", timeout = "5s", retries = 3 }
boot_start = true
env = { DISPLAY = ":99", XDG_RUNTIME_DIR = "/run/user/1000", BROWSER_KEEPER_CDP_PORT = "25154", BROWSER_KEEPER_CDP = "http://127.0.0.1:25154", KEEPER_CHROMIUM_EXECUTABLE = "/home/toxic/.cache/ms-playwright/chromium-1243/chrome-linux64/chrome" }
auto = ["start"]

# estate — project-owned daemon manifest. Source of truth for 'browserless'.
# Owned by the estate project; the parent only composes it.
