prompt_context = """
# Model Switch Skill

## Available models

Scan /home/toxic/estate/models/ and ~/models/ for .gguf files.

## Procedure

1. List available GGUFs
2. Match user request to closest filename
3. Restart llama-server with new -m path (via systemd or pitchfork)
4. Confirm new model is loaded via /health endpoint

## Constraints

- Preserve --ctx, -ngl 99, TurboQuant flags
- Draft model stays unless user explicitly requests change"""

[skill]
name = "model-switch"
version = "0.1.0"
description = 'Switches the active inference model on the beellama server. Triggers on: "switch model", "load model", "use [model name]", "swap to", "change model". Knows about all GGUFs in ~/models/.'
