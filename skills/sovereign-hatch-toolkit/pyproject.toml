[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-hatch-toolkit"
version = "1.0.0"
description = "Noise_XX_25519_AESGCM_SHA256 handshake toolkit and atomic POSIX filesystem message bus (FSBus)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Christopher Ortega", email = "toxicwind@gmail.com" }
]
keywords = [
    "noise-protocol",
    "x25519",
    "aesgcm",
    "hatch-gateway",
    "fsbus",
    "message-bus",
    "posix",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/toxicwind/sovereign-hatch-toolkit"
Documentation = "https://github.com/toxicwind/sovereign-hatch-toolkit#readme"
Repository = "https://github.com/toxicwind/sovereign-hatch-toolkit.git"
Issues = "https://github.com/toxicwind/sovereign-hatch-toolkit/issues"

[tool.setuptools]
packages = [
    "hatch_core",
    "orchestrator",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
