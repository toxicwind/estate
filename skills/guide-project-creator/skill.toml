prompt_context = """
# Guide Project Creator

Scaffolds a new awesome-style `*-guide` project following the estate guide
convention (pioneered by bash-style-guide): flat R-NNN rule ids (renumbering
forbidden), provenance per rule (upstream or estate-original), Correct/Avoid
example pairs, a machine gate (bin/validate.js, exit 0 = done), and the SDD
prompt trio (.github/prompts/spec|task|verifySpec.prompt.md) grounded in
SpecFirst (arXiv 2607.27167) and SDAD (arXiv 2608.20341).

## Usage

    bin/new-guide.sh <slug> <github-owner> "<one-line description>"

Creates the repo (git init + scaffold commit), prints the next push command.
GUIDE_DEST env var overrides the destination directory.

## Steps
1. Run bin/new-guide.sh with slug, owner, description.
2. git remote add origin git@github.com:<owner>/<slug>.git && git push -u origin main
3. Register in ranch (.gitmodules submodule entry or directory symlink).
4. Fill rules via the repo's own /spec -> /task -> /verifySpec workflow (dogfood).
5. Prove: node bin/validate.js exits 0 inside the new repo.

## Rules of the convention (every created guide must hold)
- Flat rule ids R-<area><n>; no renumbering, ever; commits cite ids.
- Every rule names the failure mode it prevents (Why paragraph).
- Correct/Avoid pair where the domain allows executable examples.
- Every guide ships at least one machine gate; the gate is the TASK proof command.
- Provenance per rule: upstream citation or estate-original.
"""

[skill]
name = "guide-project-creator"
version = "1.0.0"
description = "Scaffold a new *-guide project (bash-style-guide convention: R-NNN ids, provenance, Correct/Avoid, machine gate, SDD trio); commit, push, and register in ranch."
author = "toxic"
license = "MIT"
tags = [
    "estate",
    "scaffolding",
    "guides",
    "sdd",
]

[runtime]
type = "script"
entry = "bin/new-guide.sh"

[tools]
provided = []

[requirements]
tools = ["git", "node"]
capabilities = []

[source]
type = "estate"

