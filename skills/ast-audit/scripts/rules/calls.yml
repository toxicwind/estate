# Template: does function X call Y?
# Usage: fill in X, Y, language, then:
#   forge audit --root <dir> --rule scripts/rules/calls.yml
# Or inline: forge audit --root <dir> --claim "X calls Y"  (two-pass, no file needed)

id: x-calls-y
language: TypeScript   # change to Python / Go / Rust as needed
rule:
  all:
    - pattern: $Y($$$)          # the call site; replace $Y with the callee name
    - inside:                   # ...must sit inside X's body
        kind: function_definition  # Python; use function_declaration for TS/JS
        has: { pattern: 'def $X($$$)' }   # TS: 'function $X($$$) { $$$ }'
        stopBy: end             # always: walk the whole body, not one level
