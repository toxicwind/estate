# Gate config for ops/git-hooks. Extends the default ruleset and allowlists
# known false positives so the box-wide gate stays useful instead of being
# bypassed. Add an entry only with the reason it is not a credential.
title = "estate secret gate"

[extend]
useDefault = true

[allowlist]
description = "Known non-credentials and build artifacts"
paths = [
  # Kotlin @Metadata bytecode strings in decompiled Android sources match the
  # generic-api-key entropy heuristic; they are compiler metadata, not keys.
  '''(?i)extracted/.*\.java$''',
  # Vendored upstream trees keep their own test fixtures and examples.
  '''(?i)(vendor|vendored|node_modules|testdata|fixtures)/''',
  # Bundled / minified distribution artifacts in projects and extensions
  '''(?i)(dist|build|\.build|out)/''',
  '''(?i)\.(min\.js|bundle\.js|map|pak|wasm)$''',
]
regexes = [
  # Telemetry instrumentation keys and dummy UUIDs
  '''(?i)InstrumentationKey=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  '''(?i)00000000-0000-0000-0000-000000000000''',
  # Example placeholders
  '''(?i)(example|dummy|placeholder|fake|test)[-_]?(api[-_]?key|secret|token)''',
]
