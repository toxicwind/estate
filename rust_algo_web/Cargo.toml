[package]
name = "sovereign_web"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
dotenvy = "0.15"
serde_yaml = "0.9.34"
regex = "1.13.0"
