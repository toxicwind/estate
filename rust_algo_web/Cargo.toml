[package]
name = "rust_algo_web"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.4"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
reqwest = { version = "0.11.24", features = ["json"] }
tower-http = { version = "0.5.1", features = ["fs", "cors"] }
