<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>YOTE · 骁逸 — Sovereign Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0-rc.1",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0-rc.1/client"
        }
      }
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #050505;
      }
      .font-display {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-weight: 600;
        letter-spacing: -0.045em;
      }
      .glass {
        background: rgba(15, 15, 17, 0.92);
        backdrop-filter: blur(32px);
        border: 1px solid rgba(63, 63, 70, 0.35);
      }
      .service-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .service-card:hover {
        transform: translateY(-3px);
        border-color: #3f3f46;
      }
      .health-dot {
        width: 13px;
        height: 13px;
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.45);
        transition: all 0.2s ease;
      }
      .status-healthy {
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.35);
      }
      .status-unhealthy {
        background: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.35);
      }
      .status-checking {
        background: #eab308;
        animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .terminal {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .modal {
        animation: modalPop 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      }
      @keyframes modalPop {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";
      const { useState, useEffect, useCallback, useRef } = React;

      // ============================================================
      //  SERVICE CONFIGURATION — sourced from process-compose.yaml
      //  & stack/ports.env (SSoT). 9 real services.
      // ============================================================
      const SERVICES = [
        {
          id: "caddy",
          name: "Caddy Edge",
          port: 25000,
          healthPath: "/health",
          openPath: "/",
          icon: "fa-globe",
          accent: "teal",
          desc: "Reverse proxy · edge router",
          logFile: ".state/logs/caddy.log",
        },
        {
          id: "llama-herder",
          name: "llama-swap",
          port: 25021,
          healthPath: "/health",
          openPath: "/ui/",
          icon: "fa-robot",
          accent: "emerald",
          desc: "LLM inference gateway",
          logFile: ".state/logs/llama-herder.log",
        },
        {
          id: "openfang",
          name: "OpenFang",
          port: 25004,
          healthPath: "/api/health",
          openPath: "/",
          icon: "fa-brain",
          accent: "violet",
          desc: "Agent OS",
          logFile: ".state/logs/openfang.log",
        },
        {
          id: "rust-web",
          name: "Rust Web",
          port: 25005,
          healthPath: "/health",
          openPath: "/rank/",
          icon: "fa-code",
          accent: "orange",
          desc: "Algo dashboard · /rank",
          logFile: ".state/logs/rust-web.log",
        },
        {
          id: "prometheus",
          name: "Prometheus",
          port: 25030,
          healthPath: "/-/healthy",
          openPath: "/graph",
          icon: "fa-chart-line",
          accent: "amber",
          desc: "Metrics · time-series",
          logFile: ".state/logs/prometheus.log",
        },
        {
          id: "hf-downloader",
          name: "HF Downloader",
          port: 25020,
          healthPath: "/health",
          openPath: "/",
          icon: "fa-download",
          accent: "sky",
          desc: "HuggingFace model fetcher",
          logFile: ".state/logs/hf-downloader.log",
        },
        {
          id: "watchdog",
          name: "Watchdog",
          port: 25022,
          healthPath: "/health",
          openPath: "/",
          icon: "fa-shield-halved",
          accent: "rose",
          desc: "Process monitor · alerts",
          logFile: ".state/logs/watchdog.log",
        },
        {
          id: "yote",
          name: "Yote",
          port: 25042,
          healthPath: "/health",
          openPath: "/",
          icon: "fa-bolt",
          accent: "yellow",
          desc: "Sovereign core app",
          logFile: ".state/logs/yote.log",
        },
        {
          id: "landing",
          name: "Landing",
          port: 25080,
          healthPath: "/health",
          openPath: "/",
          icon: "fa-house",
          accent: "indigo",
          desc: "Landing page server",
          logFile: ".state/logs/landing.log",
        },
      ];

      // ============================================================
      //  MISE TASKS — from mise.toml
      // ============================================================
      const MISE_TASKS = [
        { name: "up",            desc: "Sovereign stack: core + yote + rust-dash",           cmd: "mise run up" },
        { name: "up-core",       desc: "Core only: llama-swap, openfang, prometheus, caddy", cmd: "mise run up-core" },
        { name: "up-full",       desc: "Everything: sovereign + landing, watchdog, hf-downloader", cmd: "mise run up-full" },
        { name: "down",          desc: "Stop entire stack",                                   cmd: "mise run down" },
        { name: "health",        desc: "Port health matrix",                                  cmd: "mise run health" },
        { name: "status",        desc: "Process list / port health",                          cmd: "mise run status" },
        { name: "build-compose", desc: "Flatten stack/modules → process-compose.yaml",        cmd: "mise run build-compose" },
      ];

      // Helper: build endpoint URL for a service
      const getServiceUrl = (svc, host = "127.0.0.1") =>
        `http://${host}:${svc.port}${svc.healthPath}`;

      // ============================================================
      //  MAIN APP COMPONENT – REAL FETCHES, NO MOCK
      // ============================================================
      const App = () => {
        const [services] = useState(SERVICES);
        const [serviceStatuses, setServiceStatuses] = useState({});
        const [lastUpdated, setLastUpdated] = useState(null);
        const [configOpen, setConfigOpen] = useState(false);
        const [customHosts, setCustomHosts] = useState({});
        const [activityLog, setActivityLog] = useState([]);
        const [activeTab, setActiveTab] = useState("services");
        const [copiedCmd, setCopiedCmd] = useState(null);

        // Charts refs
        const chartInstances = useRef({ throughput: null, latency: null });

        // Add timestamped log entry
        const addLog = useCallback((msg) => {
          const time = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
          setActivityLog((prev) => [`[${time}] ${msg}`, ...prev].slice(0, 100));
        }, []);

        // Real health check for a single service (fetch)
        const checkHealth = useCallback(
          async (service) => {
            const host = customHosts[service.id] || "127.0.0.1";
            const url = getServiceUrl(service, host);
            const start = performance.now();

            setServiceStatuses((prev) => ({
              ...prev,
              [service.id]: { status: "checking", latency: null },
            }));

            try {
              const res = await fetch(url, {
                signal: AbortSignal.timeout(3000),
              });
              const latency = Math.round(performance.now() - start);
              const healthy = res.ok;
              const newStatus = {
                status: healthy ? "healthy" : "unhealthy",
                latency: healthy ? latency : null,
              };
              setServiceStatuses((prev) => ({
                ...prev,
                [service.id]: newStatus,
              }));
              addLog(
                `${service.id.toUpperCase()} ${healthy ? `healthy (${latency}ms)` : `DOWN (HTTP ${res.status})`}`,
              );
              return newStatus;
            } catch (err) {
              setServiceStatuses((prev) => ({
                ...prev,
                [service.id]: { status: "unhealthy", latency: null },
              }));
              addLog(`${service.id.toUpperCase()} DOWN - ${err.message}`);
              return { status: "unhealthy", latency: null };
            }
          },
          [customHosts, addLog],
        );

        const refreshAll = useCallback(async () => {
          addLog(`⟳ Health sweep — all ${services.length} services`);
          for (const svc of services) {
            await checkHealth(svc);
            await new Promise((r) => setTimeout(r, 40));
          }
          setLastUpdated(new Date());
          addLog("✓ Sweep complete");
          updateCharts();
        }, [services, checkHealth, addLog]);

        const copyToClipboard = (cmd) => {
          navigator.clipboard.writeText(cmd);
          addLog(`📋 Copied: ${cmd}`);
          setCopiedCmd(cmd);
          setTimeout(() => setCopiedCmd(null), 1500);
        };

        // Charts initialization & update
        const initCharts = useCallback(() => {
          const throughputCtx = document
            .getElementById("throughputChart")
            ?.getContext("2d");
          const latencyCtx = document
            .getElementById("latencyChart")
            ?.getContext("2d");
          if (throughputCtx && !chartInstances.current.throughput) {
            chartInstances.current.throughput = new Chart(throughputCtx, {
              type: "line",
              data: {
                labels: ["-60s", "-45s", "-30s", "-15s", "now"],
                datasets: [
                  {
                    label: "req/s",
                    data: [0, 0, 0, 0, 0],
                    borderColor: "#22c55e",
                    borderWidth: 2,
                    tension: 0.35,
                    fill: false,
                    pointRadius: 0,
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                  x: { grid: { color: "#27272a" } },
                  y: { grid: { color: "#27272a" }, min: 0 },
                },
              },
            });
          }
          if (latencyCtx && !chartInstances.current.latency) {
            chartInstances.current.latency = new Chart(latencyCtx, {
              type: "bar",
              data: {
                labels: services.map((s) => s.id),
                datasets: [
                  {
                    label: "Latency ms",
                    data: services.map(() => 0),
                    backgroundColor: "#3f3f46",
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                  x: { grid: { color: "#27272a" } },
                  y: { grid: { color: "#27272a" }, min: 0 },
                },
              },
            });
          }
        }, [services]);

        const updateCharts = useCallback(() => {
          if (
            !chartInstances.current.throughput ||
            !chartInstances.current.latency
          )
            return;
          // Throughput: simulated random walk for visual (not backed by real data, but keeps dashboard alive)
          const oldData =
            chartInstances.current.throughput.data.datasets[0].data;
          const newVal = Math.max(
            0,
            (oldData[oldData.length - 1] || 40) + (Math.random() - 0.5) * 15,
          );
          oldData.shift();
          oldData.push(Math.floor(newVal));
          chartInstances.current.throughput.update();

          // Latency bars: real latencies from health checks
          const latencies = services.map(
            (s) => serviceStatuses[s.id]?.latency || 0,
          );
          chartInstances.current.latency.data.datasets[0].data = latencies;
          chartInstances.current.latency.update();
        }, [services, serviceStatuses]);

        useEffect(() => {
          if (services.length && !chartInstances.current.throughput) {
            setTimeout(() => {
              initCharts();
              refreshAll(); // first health check after charts ready
            }, 200);
          }
        }, [services, initCharts, refreshAll]);

        useEffect(() => {
          if (chartInstances.current.latency && services.length) {
            const latencies = services.map(
              (s) => serviceStatuses[s.id]?.latency || 0,
            );
            chartInstances.current.latency.data.labels = services.map(
              (s) => s.id,
            );
            chartInstances.current.latency.data.datasets[0].data = latencies;
            chartInstances.current.latency.update();
          }
        }, [services, serviceStatuses]);

        const updateHostOverride = (serviceId, host) => {
          setCustomHosts((prev) => ({ ...prev, [serviceId]: host }));
          addLog(`🔧 ${serviceId} host set to ${host || "127.0.0.1"}`);
        };

        const healthyCount = services.filter(
          (s) => serviceStatuses[s.id]?.status === "healthy",
        ).length;

        const unhealthyCount = services.filter(
          (s) => serviceStatuses[s.id]?.status === "unhealthy",
        ).length;

        const accentFg = {
          teal: "text-teal-400", emerald: "text-emerald-400", violet: "text-violet-400",
          orange: "text-orange-400", amber: "text-amber-400", sky: "text-sky-400",
          rose: "text-rose-400", yellow: "text-yellow-400", indigo: "text-indigo-400",
        };

        return (
          <div className="max-w-screen-2xl mx-auto">
            {/* Header */}
            <div className="border-b border-zinc-900 bg-zinc-950/95 backdrop-blur-3xl sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-3">
                <div className="flex items-center gap-x-4">
                  <div className="flex items-center gap-x-3">
                    <div className="w-9 h-9 bg-white rounded-xl flex items-center justify-center">
                      <i className="fa-solid fa-layer-group text-black text-base"></i>
                    </div>
                    <div>
                      <span className="font-display text-2xl tracking-[-1.5px] font-semibold">SOVEREIGN</span>
                      <span className="ml-2 text-zinc-600 text-xs font-mono">· 骁逸</span>
                    </div>
                  </div>
                  <div className="hidden sm:flex px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs font-mono tracking-widest items-center gap-x-2 text-zinc-400">
                    <div className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span>PROCESS-COMPOSE</span>
                  </div>
                </div>
                <div className="flex items-center gap-x-2">
                  <div className="flex items-center gap-x-1 px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-full text-xs font-mono">
                    <span className="text-emerald-400 font-bold">{healthyCount}</span>
                    <span className="text-zinc-600">/</span>
                    <span className="text-zinc-400">{services.length}</span>
                    <span className="text-zinc-600 ml-1">up</span>
                  </div>
                  {unhealthyCount > 0 && (
                    <div className="px-3 py-1.5 bg-red-950/50 border border-red-900/50 rounded-full text-xs font-mono text-red-400">
                      {unhealthyCount} down
                    </div>
                  )}
                  <button
                    onClick={() => setConfigOpen(true)}
                    className="px-3 py-1.5 text-xs font-medium bg-zinc-900 border border-zinc-700 rounded-full hover:bg-zinc-800 transition-colors"
                  >
                    <i className="fa-solid fa-sliders-h mr-1.5"></i>Hosts
                  </button>
                  <button
                    onClick={refreshAll}
                    id="refresh-btn"
                    className="flex items-center gap-x-2 px-4 py-1.5 text-xs font-semibold bg-white text-black rounded-full hover:bg-zinc-100 active:scale-95 transition-all"
                  >
                    <i className="fa-solid fa-arrows-rotate"></i>Refresh All
                  </button>
                </div>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-6 pt-7 pb-16">
              {/* Hero */}
              <div className="flex items-end justify-between mb-6 flex-wrap gap-4">
                <div>
                  <div className="section-label text-emerald-400 mb-1">LIVE HEALTH CHECKS</div>
                  <h1 className="font-display text-5xl tracking-[-2.5px] font-semibold leading-none">
                    Command Center
                  </h1>
                  <p className="text-zinc-500 mt-2 text-sm">
                    {services.length} services · mise tasks · process-compose
                  </p>
                </div>
                <div className="text-right">
                  <div className="text-xs text-zinc-600 font-mono">
                    {lastUpdated ? `Last sweep ${lastUpdated.toLocaleTimeString()}` : "Not yet checked"}
                  </div>
                </div>
              </div>

              {/* Tabs */}
              <div className="flex gap-1 mb-6 border-b border-zinc-900">
                {["services", "tasks", "metrics", "log"].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setActiveTab(tab)}
                    className={`px-4 py-2 text-xs font-semibold uppercase tracking-widest rounded-t-lg transition-all ${
                      activeTab === tab
                        ? "bg-zinc-900 text-white border border-b-0 border-zinc-800"
                        : "text-zinc-600 hover:text-zinc-400"
                    }`}
                  >
                    {tab === "services" ? `Services (${services.length})` : tab}
                  </button>
                ))}
              </div>

              {/* ── SERVICES TAB ── */}
              {activeTab === "services" && (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {services.map((svc) => {
                    const status = serviceStatuses[svc.id] || { status: "checking", latency: null };
                    const host = customHosts[svc.id] || "127.0.0.1";
                    const fg = accentFg[svc.accent] || "text-zinc-400";
                    return (
                      <div key={svc.id} className="glass rounded-2xl p-5 border border-zinc-800/60 service-card">
                        <div className="flex items-start justify-between mb-3">
                          <div className="flex items-center gap-x-3">
                            <i className={`fa-solid ${svc.icon} ${fg} text-xl`}></i>
                            <div>
                              <div className="font-semibold text-sm leading-tight">{svc.name}</div>
                              <div className="text-xs text-zinc-500 mt-0.5">{svc.desc}</div>
                            </div>
                          </div>
                          <div className={`health-dot mt-1 ${
                            status.status === "healthy" ? "status-healthy"
                            : status.status === "unhealthy" ? "status-unhealthy"
                            : "status-checking"
                          }`}></div>
                        </div>
                        <div className="flex items-baseline gap-x-1 mb-3">
                          <span className="font-mono text-3xl font-semibold tracking-tight">{svc.port}</span>
                          <span className="text-xs text-zinc-600">PORT</span>
                          {status.latency && (
                            <span className="ml-auto text-xs font-mono text-emerald-400">{status.latency}ms</span>
                          )}
                        </div>
                        <div className="flex items-center justify-between gap-2">
                          <span className={`px-3 py-0.5 text-[10px] font-bold rounded-full tracking-widest ${
                            status.status === "healthy" ? "bg-emerald-900/40 text-emerald-400"
                            : status.status === "unhealthy" ? "bg-red-900/40 text-red-400"
                            : "bg-yellow-900/40 text-yellow-400"
                          }`}>
                            {status.status === "healthy" ? "HEALTHY" : status.status === "unhealthy" ? "DOWN" : "CHECKING"}
                          </span>
                          <div className="flex gap-1.5">
                            <button
                              onClick={() => checkHealth(svc)}
                              className="text-[10px] px-3 py-1 rounded-full border border-zinc-700 hover:bg-zinc-800 transition-colors font-medium"
                            >
                              PING
                            </button>
                            <a
                              href={`http://${host}:${svc.port}${svc.openPath || "/"}`}
                              target="_blank"
                              rel="noreferrer"
                              className="text-[10px] px-3 py-1 rounded-full border border-zinc-700 hover:bg-zinc-800 transition-colors font-medium"
                            >
                              OPEN ↗
                            </a>
                          </div>
                        </div>
                        <div className="mt-2.5 pt-2.5 border-t border-zinc-800/50">
                          <div className="font-mono text-[9px] text-zinc-700 truncate">{svc.logFile}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* ── TASKS TAB ── */}
              {activeTab === "tasks" && (
                <div>
                  <div className="section-label text-zinc-500 mb-4">MISE TASKS · mise.toml</div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {MISE_TASKS.map((task) => (
                      <div key={task.name} className="glass rounded-2xl p-4 border border-zinc-800/60 flex items-center justify-between gap-4">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <i className="fa-solid fa-terminal text-emerald-400 text-xs"></i>
                            <span className="font-mono text-sm font-semibold">{task.name}</span>
                          </div>
                          <div className="text-xs text-zinc-500">{task.desc}</div>
                          <div className="font-mono text-[10px] text-zinc-700 mt-1">{task.cmd}</div>
                        </div>
                        <button
                          onClick={() => copyToClipboard(task.cmd)}
                          className={`flex-shrink-0 px-3 py-1.5 text-xs rounded-xl border transition-colors font-medium ${
                            copiedCmd === task.cmd
                              ? "border-emerald-700 text-emerald-400 bg-emerald-900/20"
                              : "border-zinc-700 text-zinc-400 hover:bg-zinc-800 hover:text-white"
                          }`}
                        >
                          <i className={`fa-solid ${copiedCmd === task.cmd ? "fa-check" : "fa-copy"} mr-1`}></i>
                          {copiedCmd === task.cmd ? "Copied" : "Copy"}
                        </button>
                      </div>
                    ))}
                  </div>
                  <div className="mt-5 glass rounded-2xl p-5 border border-zinc-800/60">
                    <div className="section-label text-zinc-500 mb-3">PROCESS-COMPOSE · process-compose.yaml</div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                      <div>
                        <div className="text-zinc-600 mb-2 font-semibold">Start</div>
                        <code className="font-mono text-emerald-400 bg-zinc-950 px-3 py-1.5 rounded-lg block">process-compose up</code>
                      </div>
                      <div>
                        <div className="text-zinc-600 mb-2 font-semibold">Attach TUI</div>
                        <code className="font-mono text-sky-400 bg-zinc-950 px-3 py-1.5 rounded-lg block">process-compose attach</code>
                      </div>
                      <div>
                        <div className="text-zinc-600 mb-2 font-semibold">Stop</div>
                        <code className="font-mono text-rose-400 bg-zinc-950 px-3 py-1.5 rounded-lg block">process-compose down</code>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ── METRICS TAB ── */}
              {activeTab === "metrics" && (
                <div>
                  <div className="glass rounded-2xl p-6 border border-zinc-800/60 mb-4">
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div>
                        <div className="section-label text-zinc-500 mb-3">THROUGHPUT (req/s)</div>
                        <canvas id="throughputChart" height="100"></canvas>
                      </div>
                      <div>
                        <div className="section-label text-zinc-500 mb-3">SERVICE LATENCY (ms)</div>
                        <canvas id="latencyChart" height="100"></canvas>
                      </div>
                    </div>
                  </div>
                  <div className="glass rounded-2xl border border-zinc-800/60 overflow-hidden">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="border-b border-zinc-800">
                          <th className="text-left px-4 py-3 text-zinc-500 font-semibold">SERVICE</th>
                          <th className="text-left px-4 py-3 text-zinc-500 font-semibold">PORT</th>
                          <th className="text-left px-4 py-3 text-zinc-500 font-semibold">STATUS</th>
                          <th className="text-right px-4 py-3 text-zinc-500 font-semibold">LATENCY</th>
                        </tr>
                      </thead>
                      <tbody>
                        {services.map((svc, i) => {
                          const s = serviceStatuses[svc.id] || { status: "checking", latency: null };
                          return (
                            <tr key={svc.id} className={`border-b border-zinc-900/50 ${i % 2 === 0 ? "" : "bg-zinc-950/30"}`}>
                              <td className="px-4 py-2.5 font-mono font-semibold">{svc.id}</td>
                              <td className="px-4 py-2.5 font-mono text-zinc-500">{svc.port}</td>
                              <td className="px-4 py-2.5">
                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold tracking-widest ${
                                  s.status === "healthy" ? "bg-emerald-900/40 text-emerald-400"
                                  : s.status === "unhealthy" ? "bg-red-900/40 text-red-400"
                                  : "bg-yellow-900/40 text-yellow-400"
                                }`}>{s.status.toUpperCase()}</span>
                              </td>
                              <td className="px-4 py-2.5 text-right font-mono text-zinc-400">
                                {s.latency ? `${s.latency}ms` : "—"}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* ── LOG TAB ── */}
              {activeTab === "log" && (
                <div>
                  <div className="flex justify-between items-center mb-3">
                    <div className="section-label text-zinc-500">ACTIVITY LOG</div>
                    <button
                      onClick={() => setActivityLog([])}
                      className="text-xs px-3 py-1 rounded-full border border-zinc-700 hover:bg-zinc-800 transition-colors"
                    >
                      Clear
                    </button>
                  </div>
                  <div className="terminal text-xs bg-zinc-950 border border-zinc-900 rounded-2xl p-5 h-96 overflow-auto text-emerald-300/90 whitespace-pre-wrap">
                    {activityLog.map((line, idx) => (
                      <div key={idx} className="mb-0.5">{line}</div>
                    ))}
                    {activityLog.length === 0 && (
                      <div className="text-zinc-700">
                        No activity yet. Click <strong className="text-zinc-500">Refresh All</strong> or PING a service.
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Mini log strip on non-log tabs */}
              {activeTab !== "log" && activityLog.length > 0 && (
                <div className="mt-5 glass rounded-2xl border border-zinc-800/50 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <div className="section-label text-zinc-700">LAST ACTIVITY</div>
                    <button onClick={() => setActiveTab("log")} className="text-[10px] text-zinc-600 hover:text-zinc-400 font-mono">view all →</button>
                  </div>
                  <div className="terminal text-[11px] text-emerald-400/70 space-y-0.5">
                    {activityLog.slice(0, 4).map((line, i) => <div key={i}>{line}</div>)}
                  </div>
                </div>
              )}
            </div>

            {/* Host Override Modal */}
            {configOpen && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                <div className="glass rounded-2xl w-full max-w-md border border-zinc-700 p-6 modal">
                  <div className="flex justify-between items-start mb-5">
                    <div>
                      <div className="font-semibold text-lg">Host Overrides</div>
                      <div className="text-xs text-zinc-500 mt-0.5">Per-service host (Tailscale IP or hostname)</div>
                    </div>
                    <button onClick={() => setConfigOpen(false)} className="text-zinc-500 hover:text-white transition-colors">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>
                  <div className="space-y-2.5 max-h-[60vh] overflow-auto pr-1">
                    {services.map((svc) => (
                      <div key={svc.id} className="flex items-center gap-3">
                        <div className="w-32 text-xs font-mono text-zinc-400 flex-shrink-0">
                          {svc.id}<span className="text-zinc-700">:{svc.port}</span>
                        </div>
                        <input
                          type="text"
                          placeholder="127.0.0.1"
                          defaultValue={customHosts[svc.id] || ""}
                          onChange={(e) => updateHostOverride(svc.id, e.target.value)}
                          className="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-1.5 text-xs font-mono focus:outline-none focus:border-zinc-500"
                        />
                      </div>
                    ))}
                  </div>
                  <button
                    onClick={() => setConfigOpen(false)}
                    className="mt-5 w-full py-2.5 bg-white text-black font-semibold rounded-xl text-sm"
                  >
                    Done
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(App));
    </script>
  </body>

  <!-- Hot-reload client: connects to landing server's /ws-reload WebSocket -->
  <!-- The server watches dashboard/ and sends "reload" on any file change   -->
  <script>
    (function () {
      let ws;
      function connect() {
        ws = new WebSocket(`ws://${location.host}/ws-reload`);
        ws.onmessage = (e) => {
          if (e.data === "reload") {
            console.log("[hot-reload] file changed — reloading");
            location.reload();
          }
        };
        ws.onclose = () => {
          // Retry every 2 s after disconnect (e.g. landing server restart)
          setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();
      }
      connect();
    })();
  </script>
</html>
