    notes: "pre-push secret guard for Go repos; --help HANGS (starts repo scan) — never run bare"

  - name: sovereign_web
    dir: bin
    kind: binary
    run: []
    expect_in_output: true
    expect_any: ["Watchdog running", "Address already in use"]
    timeout: 5
    notes: "Rust web dashboard (Jul 13); binds 25101+25104. 25104 held by bun router.ts watchdog — AddrInUse on start is environmental, not a broken binary"

