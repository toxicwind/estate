  - name: cron-trust-monitor
    dir: bin
    kind: script
    shebang: "#!/usr/bin/env python3"
    syntax: python
    run: []
    expect: "CRON-TRUST"
    timeout: 15
    notes: "cron reliability watchdog; read-only, safe to run"

  - name: hotfix
    dir: bin
    kind: script
    shebang: "#!/usr/bin/env bun"
    run: [--help]
