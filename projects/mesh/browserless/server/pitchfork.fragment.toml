# Pitchfork daemon fragment — merged into the [daemons.itvx-browserless] section
# of /home/toxic/sovereign/pitchfork.toml (owned sequence: stop -> ss-verify ->
# clean --daemon -> start from /home/toxic/sovereign).
[daemons.itvx-browserless]
port = 25130
run = "exec /home/toxic/sovereign/projects/mesh/browserless/server/run.sh"
dir = "/home/toxic/sovereign/projects/mesh/browserless/server"
