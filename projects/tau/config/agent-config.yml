# Tau agent config -- CANONICAL SOURCE (tracked in sovereign-projects).
# Deployed to ~/.tau/agent/config.yml on yote (byte-identical apart from this
# header; the engine expands ${VAR:-default}). Live-verified changes go here
# first, then sync to ~/.tau/agent/config.yml.
#
# 2026-09-20 tau-hyperfix: added skills.customDirectories pointing at
# /home/toxic/sovereign/skills so the curated, tracked skill dump is always
# discovered (customDirectories outranks default-path discovery, so sovereign
# skills win name collisions with the gk-live-gear mega-dump symlinked at
# ~/.tau/agent/skills).

providers:
  webSearchOrder:
    - exa
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
  anthropic:
    serverSideFallback: true
  autoThinkingModel: online
  autoThinkingMaxEffort: xhigh
  memoryModel: online
  maxInFlightRequests:
    {}
  openai-codex:
    codeMode: "on"
    codeModeDirectTools:
      []
  ollama-cloud:
    maxConcurrency: 3
  openai-compatible:
    baseUrl: http://127.0.0.1:25100/v1
    apiKey: llama-swap
  webSearchExclude:
    []
  webSearchTimeoutSeconds: 60
  antigravityEndpoint: auto
  imageOrder:
    []
  fireworksTier: standard
  tts: auto
  tinyModel: online
  tinyModelDevice: auto
  tinyModelDtype: auto
  unexpectedStopModel: online
  kimiApiFormat: auto
  openaiWebsockets: auto
  cacheRetention: auto
  streamFirstEventTimeoutSeconds: -1
  streamIdleTimeoutSeconds: -1
  unboundedRetryAfter:
    - opencode-go
    - opencode-zen
  openrouterVariant: default
  fetch: auto
modelRoles:
  # 2026-09-20 tau-config: every role now resolves against a provider defined
  # in agent/models.yml (herd / sovereign). The old nvidia/ and openrouter/
  # selectors named providers that exist NOWHERE -> dead routes. Evidence:
  # ranker live-measurements 2026-09-20 (sovereign/free: 0% errors, nemotron
  # winner; herd local: fast, /bin/bash, private; pollinations: backup lane only).
  # 2026-09-21 modelmap: default/smol were herd/qwen-flash-da-128k (local 9B
  # beellama) -- absurd for the DEFAULT: measured ranking is nim 0.8087 >
  # pollinations 0.7535 > herd-local 0.5791, and the routing doctrine says
  # "Local models are the fallback, never the default". default/task/advisor/
  # smol -> sovereign/free (ranked #1). tiny keeps the local 1.2B -- the one
  # role where local is the sane choice.
  task: sovereign/free
  smol: sovereign/free
  tiny: herd/beellama/exaone-4-0-1-2b-iq4xs
  advisor: sovereign/free
  default: sovereign/free
subagents:
  can_spawn_subagents: true
  whitelist:
    - task
    - plan
    - review
    - auditor
    - critic
    - explorer
    - analyst
    - debugger
  # 2026-09-21 modelmap: was herd/kimi-k3-nim -- kimi-k3-nim existed ONLY in
  # the disabled flock.modelMap (flock.enabled: false), so every subagent
  # spawn 404'd. -> sovereign/free (ranked #1, 0% errors 2026-09-20).
  defaultModel: sovereign/free
  subagent: inherit
