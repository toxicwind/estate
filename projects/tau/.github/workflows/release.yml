name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tau-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: tau-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: tau-windows-x86_64.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Compile Release Binary
        shell: bash
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            mkdir -p dist
            bun build packages/coding-agent/src/cli.ts --compile --outfile dist/${{ matrix.artifact_name }}
          fi

      - name: Compute SHA256 Checksum
        shell: bash
        run: |
          mkdir -p release-pkg
          if [ -f "target/${{ matrix.target }}/release/tau" ]; then
            cp "target/${{ matrix.target }}/release/tau" "release-pkg/${{ matrix.artifact_name }}"
          elif [ -f "target/${{ matrix.target }}/release/tau.exe" ]; then
            cp "target/${{ matrix.target }}/release/tau.exe" "release-pkg/${{ matrix.artifact_name }}"
          elif [ -f "dist/${{ matrix.artifact_name }}" ]; then
            cp "dist/${{ matrix.artifact_name }}" "release-pkg/${{ matrix.artifact_name }}"
          fi
          bun scripts/ci-release-checksums.ts "release-pkg/${{ matrix.artifact_name }}.sha256" "release-pkg/${{ matrix.artifact_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-pkg/*

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/**/*
          generate_release_notes: true
