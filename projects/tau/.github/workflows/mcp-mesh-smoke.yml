name: MCP Mesh Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-handshake:
    name: JSON-RPC 2.0 Protocol Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build MCP Gateway
        run: |
          if [ -d "mesh/gateway" ]; then
            cd mesh/gateway && go build -o mcpproxy-test .
          fi

      - name: Validate MCP JSON-RPC 2.0 Handshake Schema
        shell: bash
        run: |
          python3 - <<'EOF'
          import json
          import sys

          def validate_mcp_handshake():
              # 1. Validate Initialize Request (Client -> Server)
              init_req = {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "protocolVersion": "2024-11-05",
                      "capabilities": {
                          "roots": {"listChanged": True},
                          "sampling": {}
                      },
                      "clientInfo": {
                          "name": "tau-mcp-mesh-smoke",
                          "version": "1.0.0"
                      }
                  }
              }

              assert init_req.get("jsonrpc") == "2.0", "Initialize request must specify jsonrpc 2.0"
              assert isinstance(init_req.get("id"), (int, str)), "Initialize request must have int or str id"
              assert init_req.get("method") == "initialize", "Method must be initialize"
              params = init_req.get("params")
              assert isinstance(params, dict), "params must be an object"
              assert "protocolVersion" in params, "protocolVersion required in params"
              assert "capabilities" in params, "capabilities required in params"
              assert "clientInfo" in params, "clientInfo required in params"
              assert "name" in params["clientInfo"] and "version" in params["clientInfo"], "clientInfo requires name and version"

              # 2. Validate Initialize Result (Server -> Client)
              init_res = {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "result": {
                      "protocolVersion": "2024-11-05",
                      "capabilities": {
                          "tools": {"listChanged": True},
                          "prompts": {"listChanged": False},
                          "resources": {"subscribe": True}
                      },
                      "serverInfo": {
                          "name": "tau-mcp-gateway",
                          "version": "1.0.0"
                      }
                  }
              }

              assert init_res.get("jsonrpc") == "2.0", "Initialize response must specify jsonrpc 2.0"
              assert init_res.get("id") == init_req["id"], "Response id must match request id"
              result = init_res.get("result")
              assert isinstance(result, dict), "result must be an object"
              assert "protocolVersion" in result, "protocolVersion required in result"
              assert "capabilities" in result, "capabilities required in result"
              assert "serverInfo" in result, "serverInfo required in result"
              assert "name" in result["serverInfo"] and "version" in result["serverInfo"], "serverInfo requires name and version"

              # 3. Validate Initialized Notification (Client -> Server)
              init_notif = {
                  "jsonrpc": "2.0",
                  "method": "notifications/initialized"
              }

              assert init_notif.get("jsonrpc") == "2.0", "Notification must specify jsonrpc 2.0"
              assert init_notif.get("method") == "notifications/initialized", "Method must be notifications/initialized"
              assert "id" not in init_notif, "JSON-RPC 2.0 notifications must NOT include an id member"

              print("Validated MCP JSON-RPC 2.0 initialize request, response, and notification schemas successfully.")

          if __name__ == "__main__":
              validate_mcp_handshake()
          EOF
