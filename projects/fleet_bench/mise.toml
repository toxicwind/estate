# Fleet-Bench configuration (July 2026)
min_version = "2025.7.0"

[tools]
bun = "latest"
process-compose = "latest"

[env]
PORT = "25203"
LLAMA_SWAP_CONFIG = "/home/toxic/sovereign/tools/llama-swap/config.yaml"

[tasks.install]
description = "Install Bun dependencies"
run = "bun install"

[tasks.dev]
description = "Run benchmarking dashboard in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.start]
description = "Run benchmarking dashboard in production"
depends = ["install"]
run = "bun run start"
