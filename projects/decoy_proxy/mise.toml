# DecoyProxy container config (July 2026)
min_version = "2025.7.0"

[tools]
bun = "latest"
process-compose = "latest"

[env]
PORT = "25202"
DEEPSEEK_API_KEY = "sk-decoy-api-key-sovereign-proxy"
KIMI_API_KEY = "sk-kimi-rHmZUSeh..."

[tasks.install]
description = "Install Bun dependencies"
run = "bun install"

[tasks.dev]
description = "Run development watch server"
depends = ["install"]
run = "bun run dev"

[tasks.start]
description = "Run production Bun server"
depends = ["install"]
run = "bun run start"
