[project]
name = "sovereign"
revision = "1.0"

[profiles.default]
TELEGRAM_BOT_TOKEN = { description = "Telegram Bot API token", required = true }
TELEGRAM_ALLOWED_USERS = { description = "Allowed Telegram user IDs", required = true }
HUGGINGFACE_HUB_TOKEN = { description = "HF Hub token", required = true }
HF_TOKEN = { description = "HF token alias", required = true }
DISCORD_CLIENT_ID = { description = "Discord Client ID", required = true }
DISCORD_CLIENT_SECRET = { description = "Discord Client Secret", required = true }
DISCORD_BOT_TOKEN = { description = "Discord Bot Token", required = true }
API_INTERNAL_TOKEN = { description = "Internal API auth", required = true }
SESSION_KEY = { description = "Session signing key", type = "base64", generate = { bytes = 64 } }

[profiles.development]
DATABASE_URL = { description = "Local SQLite", required = false, default = "sqlite:///home/toxic/sovereign/data/dev.db" }
