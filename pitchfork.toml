# GENERATED by sovereign/bin/pitchfork-compose — DO NOT EDIT.
# Edit the per-project sources instead: <project>/pitchfork.d/<daemon>.toml
# Recompose: bin/pitchfork-compose --out pitchfork.toml
#:schema https://pitchfork.jdx.dev/schema.json
# SOVEREIGN PITCHFORK CONFIG — HAND-EDITED (generator retired 2026-09-14 per sovereign/AGENTS.md;
# never run bun run scripts/generate.ts — it would destroy live daemons). Port SSOT: config/ports.env.
env_file = "config/ports.env"
# CONFIG RELOAD RULE (2026-09-20, incident: beellama-fast errored 12h):
# pitchfork does NOT hot-reload this file. Editing a [daemons.*] section
# changes nothing for the running daemon - it keeps serving its stale
# persisted definition until re-registered. After ANY daemon edit run:
#   bin/pitchfork-restart sovereign/<name>
# which re-runs pitchfork start from this dir, reaps desynced port holders,
# and verifies /health. Stale-definition symptom: pitchfork shows "errored"
# while the old orphaned binary still answers /health 200 (Hearth then
# reports pitchfork=errored, health=200 for the same daemon).

[groups.mesh]
daemons = ["gatehouse", "mesh-hub", "herd", "vansrouter", "coyote", "yote", "search-api", "search-ui", "openfang-front", "fleet-feed", "hf-downloader", "null-g-proxy", "byte-vision", "hindsight", "kimi-code", "nginx"]

[groups.core]
 daemons = ["qdrant", "redis", "kafka", "dnsmasq", "prometheus", "grafana", "matter-server"]

[groups.agents]
daemons = []

[groups.all]
# Group members must be real [daemons.*]. Four were not: rust-web (renamed to
# fleet-feed this session) and squawk-feed/squawk-ws/squawk-ui, which have no
# daemon definition anywhere -- the squawk daemons are squawk-relay-sink,
# squawk-relay-forward, fleet-ui and fleet-feed. pitchfork silently ignores
# names it cannot resolve, so the stale entries just made the group a lie.
daemons = ["gatehouse", "mesh-hub", "herd", "vansrouter", "coyote", "yote", "search-api", "search-ui", "openfang-front", "fleet-feed", "squawk-feed", "hf-downloader", "null-g-proxy", "byte-vision", "hindsight", "kimi-code", "nginx", "qdrant", "redis", "kafka", "dnsmasq", "prometheus", "grafana", "matter-server", "tau", "kimi-auto-shim", "squawk-relay-sink", "squawk-relay-forward", "fleet-ui", "mbx-cache", "ml-serve", "stash-guard", "bench-radar", "files", "keypool", "boundless", "kimi-audit-dash"]

