# ═══════════════════════════════════════════════════════════════════
# STAGED — sysd-migrate re-landing (worker b747b511's defs, native form)
# ═══════════════════════════════════════════════════════════════════
# Source: generator sources landed by b747b511 on branch yote-repair:
#   db044f9a2d  nginx       (config/ports.env + src/services/peripheral.ts
#                            + hand-appended [daemons.nginx] in pitchfork.toml)
#   5abe88d8b   nim-proxy, matter-server (ports.env + peripheral.ts only;
#                            NOT yet in pitchfork.toml)
#
# DO NOT APPLY until the tau-ledger cutover. At cutover, merge [vars] into
# /home/toxic/sovereign/mise.toml [vars] and the [daemons.*] sections into
# its [daemons], then retire the generator sources + pitchfork.toml.
#
# CUTOVER ORDER (from b747b511's handoff):
#   `docker stop nim-proxy matter-server` BEFORE/AT supervisor restart —
#   the raw containers are still running; pitchfork's --rm --name runs would
#   hit name+port conflicts otherwise. nginx's systemd unit is already
#   disabled, so its auto-start binds :62200 cleanly.
#
# GROUP MAPPING: all three were group "aux" in generator sources. Native
# mise has no daemon groups; represent aux as a mise task passing explicit
# daemon names at cutover (e.g. `mise run aux-up` -> daemons up nginx
# nim-proxy matter-server).
#
# PORTS: NGINX_PORT=62200, NIM_PROXY_PORT=8000, MATTER_SERVER_PORT=5580
# (already in config/ports.env; move to mise [vars] at cutover).
# ═══════════════════════════════════════════════════════════════════

[vars]
NGINX_PORT = "62200"
NIM_PROXY_PORT = "8000"
MATTER_SERVER_PORT = "5580"

[daemons.nginx]
run = "exec /usr/bin/nginx -c /etc/nginx/nginx.conf -g 'daemon off; pid /tmp/nginx-pitchfork.pid;'"
dir = "/home/toxic/sovereign"
mise = false
retry = true
ready_cmd = "ss -ltn 'sport = :{{ vars.NGINX_PORT }}' | grep -q LISTEN"
auto = ["start"]
env = { NGINX_PORT = "{{ vars.NGINX_PORT }}" }

[daemons.nim-proxy]
run = "exec docker run --rm --name nim-proxy -p 127.0.0.1:{{ vars.NIM_PROXY_PORT }}:8000 -v nim-proxy-data:/data -e DATA_DIR=/data ghcr.io/miztertea/nim-proxy:latest"
dir = "/home/toxic/sovereign"
mise = false
retry = true
ready_cmd = "ss -ltn 'sport = :{{ vars.NIM_PROXY_PORT }}' | grep -q LISTEN"
auto = ["start"]
env = { NIM_PROXY_PORT = "{{ vars.NIM_PROXY_PORT }}" }
# NOTE: key material lives in the nim-proxy-data volume, not env — no secrets here.

[daemons.matter-server]
run = "exec docker run --rm --name matter-server --net host -v /home/toxic/.matter_data:/data -v /run/dbus:/run/dbus:ro -e BLUETOOTH_ADAPTER=0 -e STORAGE_PATH=/data -e LOG_LEVEL=info ghcr.io/matter-js/matterjs-server:stable --storage-path /data --bluetooth-adapter 0"
dir = "/home/toxic/sovereign"
mise = false
retry = true
ready_cmd = "ss -ltn 'sport = :{{ vars.MATTER_SERVER_PORT }}' | grep -q LISTEN"
auto = ["start"]
env = { MATTER_SERVER_PORT = "{{ vars.MATTER_SERVER_PORT }}" }
# NOTE: was crash-looping on EACCES /data/config; b747b511 chown'd
# /home/toxic/.matter_data to 1000:1000 (container UID) — now Up (healthy).
# Container uses --net host, so MATTER_SERVER_PORT is the host-side port.
