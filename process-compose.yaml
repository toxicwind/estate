# Local-only stack — no docker/containers. Binaries: devbox nixpkgs + ~/projects/* + ~/.bun
version: "0.5"

environment:
  - "SOVEREIGN_ROOT=/home/toxic/sovereign"

# Core subset: sovereign-stack.sh up core → llama-server llama-herder openfang prometheus caddy

processes:
  # llama-server disabled — :25001 owned by llama-swap on demand (ingress :25021)
  llama-server:
    command: "echo llama-server direct disabled — use llama-herder :25021"
    disabled: true

  llama-herder:
    command: "/home/toxic/sovereign/bin/llama-herder.sh"
    working_dir: "/home/toxic/sovereign"
    environment:
      - "SOVEREIGN_ROOT=/home/toxic/sovereign"
      - "LLAMA_HERDER=25021"
    availability:
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 12
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25021/health"
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 12
    log_location: "/home/toxic/sovereign/.state/logs/llama-herder.log"

  openfang:
    command: "/home/toxic/.bun/bin/bun run src/openfang.ts"
    working_dir: "/home/toxic/sovereign"
    environment:
      - "SOVEREIGN_ROOT=/home/toxic/sovereign"
      - "OPENFANG_PORT=25004"
    availability:
      restart: on_failure
      max_restarts: 10
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25004/api/health"
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 10
    log_location: "/home/toxic/sovereign/.state/logs/openfang.log"

  prometheus:
    command: "prometheus --config.file=/home/toxic/sovereign/prometheus.yml --storage.tsdb.path=/home/toxic/sovereign/.prometheus --web.listen-address=0.0.0.0:25030"
    working_dir: "/home/toxic/sovereign"
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25030/-/healthy"
      initial_delay_seconds: 3
      period_seconds: 5
    log_location: "/home/toxic/sovereign/.state/logs/prometheus.log"

  caddy:
    command: "caddy run --config /home/toxic/sovereign/Caddyfile"
    working_dir: "/home/toxic/sovereign"
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25000/health"
      initial_delay_seconds: 2
      period_seconds: 5
    log_location: "/home/toxic/sovereign/.state/logs/caddy.log"

  landing:
    command: "/home/toxic/.bun/bin/bun run src/landing/server.ts"
    working_dir: "/home/toxic/sovereign"
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25080/health"
      initial_delay_seconds: 2
      period_seconds: 5
    log_location: "/home/toxic/sovereign/.state/logs/landing.log"

  watchdog:
    command: "/home/toxic/.bun/bin/bun run src/watchdog.ts"
    working_dir: "/home/toxic/sovereign"
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25022/health"
      initial_delay_seconds: 2
      period_seconds: 5
    log_location: "/home/toxic/sovereign/.state/logs/watchdog.log"

  hf-downloader:
    command: "/home/toxic/.bun/bin/bun run src/hf_downloader.ts"
    working_dir: "/home/toxic/sovereign"
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25020/health"
      initial_delay_seconds: 1
      period_seconds: 3
    log_location: "/home/toxic/sovereign/.state/logs/hf-downloader.log"

  rust-web:
    command: "bash -lc 'command -v cargo >/dev/null && cargo run --release || echo rust-web skipped: install rust/cargo locally'"
    working_dir: "/home/toxic/sovereign/rust_algo_web"
    disabled: true
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25005/health"
      initial_delay_seconds: 10
      period_seconds: 5
      failure_threshold: 20
    log_location: "/home/toxic/sovereign/.state/logs/rust-web.log"

  yote:
    command: "/home/toxic/.bun/bin/bun run src/index.ts"
    working_dir: "/home/toxic/sovereign/yote"
    environment:
      - "DOTENV_CONFIG_PATH=/home/toxic/sovereign/yote/.env"
    readiness_probe:
      exec:
        command: "curl -fs http://127.0.0.1:25042/health"
      initial_delay_seconds: 10
      period_seconds: 3
    log_location: "/home/toxic/sovereign/.state/logs/yote.log"