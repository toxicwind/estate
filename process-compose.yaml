# Sovereign Stack — process-compose.yaml (Final)
# Orchestrates: llama-server → nfcot_proxy → openfang + watchdog
# Port map:
#   25001 — llama-server (ik_llama, CUDA, Qwen3.6-27B)
#   25004 — openfang (agent OS)
#   25008 — nfcot_proxy (latent injection proxy)

version: "0.5"

environment:
  - "SOVEREIGN_HOME=/home/toxic/sovereign"
  - "MODEL_PATH=/home/toxic/models/Qwen3.6-27B-Heretic-UD/heretic-UD-27B-Q5_K_XL.gguf"
  - "PYTHONUNBUFFERED=1"

processes:
  llama-server:
    command: >-
      /home/toxic/sovereign/bin/llama-server
      -m /home/toxic/models/Qwen3.6-27B-Heretic-UD/heretic-UD-27B-Q5_K_XL.gguf
      --mmproj /home/toxic/models/Qwen3.6-27B-Heretic-UD/mmproj-27B-F16.gguf
      --host 0.0.0.0 --port 25001
      --jinja
      --n-gpu-layers 60
      --ctx-size 77824
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn on
      --no-context-shift
      --parallel 4 --cont-batching
      --defrag-thold 0.1
      --slot-prompt-similarity 0.6
      --reasoning on --reasoning-format deepseek
      --parallel-tool-calls
      --samplers "top_k;top_p;min_p;temperature"
      --temp 0.4 --top-k 40 --top-p 0.9 --min-p 0.05
      --repeat-penalty 1.08 --repeat-last-n 1024
      --metrics
      -b 4096 -ub 1024
      --webui none
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25001
        path: /health
      initial_delay_seconds: 10
      period_seconds: 5
      failure_threshold: 6
    availability:
      restart: always
      backoff_seconds: 5
    log_location: /home/toxic/sovereign/logs/llama-server.log

  nfcot_proxy:
    command: python3 /home/toxic/sovereign/modules/nfcot_proxy.py
    depends_on:
      llama-server:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25008
        path: /v1/models
      initial_delay_seconds: 3
      period_seconds: 5
    availability:
      restart: always
      backoff_seconds: 3
    log_location: /home/toxic/sovereign/logs/nfcot_proxy.log

  openfang:
    command: >-
      /home/toxic/.openfang/bin/openfang start
    environment:
      - "TELEGRAM_BOT_TOKEN=8932201107:AAEZ7I2NBcGR_CcJvT9IjKwbZ8honLNc_zM"
      - "OPENFANG_LISTEN=127.0.0.1:25004"
    depends_on:
      nfcot_proxy:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25004
        path: /api/health
      initial_delay_seconds: 5
      period_seconds: 10
      failure_threshold: 6
    availability:
      restart: always
      backoff_seconds: 5
    log_location: /home/toxic/sovereign/logs/openfang.log

  sovereign_watchdog:
    command: python3 /home/toxic/sovereign/modules/sovereign_watchdog.py
    depends_on:
      llama-server:
        condition: process_healthy
    availability:
      restart: always
      backoff_seconds: 10
    log_location: /home/toxic/sovereign/logs/watchdog.log

  yote_telegram:
    command: python3 /home/toxic/sovereign/modules/yote_telegram.py
    environment:
      - "TELEGRAM_BOT_TOKEN=8932201107:AAEZ7I2NBcGR_CcJvT9IjKwbZ8honLNc_zM"
      - "TELEGRAM_ALLOWED_USERS=716302190,13036673831"
    depends_on:
      llama-server:
        condition: process_healthy
      nfcot_proxy:
        condition: process_healthy
    availability:
      restart: always
      backoff_seconds: 5
    log_location: /home/toxic/sovereign/logs/yote_telegram.log

  yote_daemon:
    command: python3 -m yote.daemon --port 25042
    environment:
      - "PYTHONPATH=/home/toxic/sovereign"
    depends_on:
      llama-server:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25042
        path: /health
      initial_delay_seconds: 2
      period_seconds: 5
    availability:
      restart: always
      backoff_seconds: 5
    log_location: /home/toxic/sovereign/logs/yote-daemon.log


