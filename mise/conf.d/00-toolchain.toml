# Toolchain versions. Hand-edited; mise installs these on demand.
[tools]
python = "3.12.13"
node = "22.12.0"
# bun: we run the CANARY channel (bleeding-edge, like rust=nightly). mise's
# upstream stable index tops out at ~1.4; `bun upgrade` yields canary builds
# (1.4.4+) installed at ~/.bun/bin. We pin the canary by keeping ~/.bun/bin on
# PATH ahead of any mise-managed bun — NOT as a mise [tools] entry, because
# mise has no `bun:path:` source and the old `"bun:path:..." = "true"` line
# failed tool resolution for every `mise = true` daemon ("bun is not a valid
# plugin name"). If a mise-managed bun is ever needed, use `bun = "<version>"`.
rust = "nightly"
go = "1.23.1"
pitchfork = "2.32.1"
"pypi:toxicwind/kite-cli" = "main"
