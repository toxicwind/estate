# Environment for every task in this repo.
#
# Port numbers live in config/ports.env (the numeric SSOT), injected from
# mise.toml's [env] _.file. Never redeclare a *_PORT here -- that is how
# .env and config/tau/.env ended up contradicting the SSOT.
#
# SCOUT_* is deliberately absent: /home/toxic/.tau/.env owns those and sets
# different values (:25193 + Estate/free). Two contradictory copies of one
# setting is worse than one, so the estate defers to the agent config that
# actually reads them.
[env]
# ── UTF-8 maximal (system-wide floor) ──────────────────────────────────────
# pitchfork daemons can boot with a stripped env where LANG is absent; without
# a locale, C-locale tools mangle unicode and Python 3 falls back to ASCII in
# some pipes. Pin the UTF-8 floor here so every mise-managed daemon/task
# inherits it (2026-10-27 architect directive: utf8 + unicode friendly maximal
# system wide).
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
# polyglot riders — every runtime the estate spawns, pinned the way its docs
# specify (go/rust/node/bun strings are UTF-8-native; locales above cover the
# C/C++/perl/ruby/SQLite paths):
PYTHONUTF8 = "1"           # python: utf8 mode regardless of locale detection
PYTHONIOENCODING = "utf-8" # python stdio when a pipe strips the locale
JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8" # jvm
