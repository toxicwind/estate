# standalone/paper-poller — project-owned daemon manifest. Source of truth for 'paper-poller-watchdog'.
# Owned by the standalone/paper-poller project; the parent only composes it.

[daemons.paper-poller-watchdog]
port = 25150
run = "exec /usr/bin/python3 /home/toxic/paper-poller/bin/watchdog.py"
dir = "/home/toxic/paper-poller"
mise = false
retry = true
boot_start = true
ready_http = "http://127.0.0.1:25150/health"
env = { WATCHDOG_PORT = "25150", WATCHDOG_INTERVAL = "30" }
