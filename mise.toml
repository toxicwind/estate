# ─── Utilities ───
ports = "pitchfork daemons"
svc-check = """bash -c 'for entry in llama-swap=25100 qdrant=25133 redis=25199 mcpproxy-go=25127 ghas-api=25112 ghas-mcp=25113 ghas-frontend=25114 prometheus=25105 grafana=25110 openfang=25103 rust-web=25201 hf-downloader=25106 pi-web-dashboard=25192 pi-agent=25125 kimi-code=25126 antigravity-gateway=25128 zedra-host=25130 antigravity-cli=25140; do svc=${entry%%=*}; port=${entry##*=}; if [ -n "${port}" ]; then curl -sf -m 2 "http://127.0.0.1:${port}/health" >/dev/null 2>&1 || curl -sf -m 2 "http://127.0.0.1:${port}/-/healthy" >/dev/null 2>&1 || curl -sf -m 2 "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1 && echo "✅ :${port} (${svc})" || echo "❌ :${port} (${svc})"; else echo "⚠️ :${svc} (no port)"; fi; done' """

# ─── Nuvio Platform (webOS app) ───
nv-build = { run = "cd tools/nuvio-platform && npm run build:webos", dir = "tools/nuvio-platform" }
nv-test = { run = "cd tools/nuvio-platform && npm run test:coverage", dir = "tools/nuvio-platform" }
nv-package = { run = "cd tools/nuvio-platform && npm run package:webos", dir = "tools/nuvio-platform", depends = ["nv-build"] }
nv-deploy = { run = "cd tools/nuvio-platform && node scripts/ares-install-webos.mjs", dir = "tools/nuvio-platform", depends = ["nv-package"] }
nv-dev = { run = "cd tools/nuvio-platform && npm run dev", dir = "tools/nuvio-platform" }

# ─── Test suite ───
test = "bun test"
"test-cov" = "bun run test:cov"
"test-gateway" = "bun run test:gateway:cov"
"test-models" = "bun run test:best-models"
