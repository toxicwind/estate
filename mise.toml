min_version = "2026.6.0"

[tools]
# jdx ecosystem: pitchfork = daemons; mise = tools/env/tasks (not process-compose)
pitchfork = "latest"
python = "3.12"
bun = "latest"
jq = "latest"
# Pin matches host cargo/ast-grep; doctor verifies PATH
ast-grep = "0.44.1"

[env]
_.file = ["config/ports.env", ".env.local", "yote/.env", "/home/toxic/.secrets", "/home/toxic/.openfang/secrets.env"]
_.path = [
  "{{ config_root }}/yote/.venv/bin",
  "{{ config_root }}/bin",
  "{{ env.HOME }}/.local/bin",
  "{{ env.HOME }}/.bun/bin",
]
AST_GREP_RULES = "{{config_root}}/ast-grep-rules"
# Ports only in config/ports.env — do not pin numbers here

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

# ── Lifecycle (pitchfork) ───────────────────────────────────────────────────

[tasks.up]
description = "Start core daemons (pitchfork group core)"
run = "./mise/tasks/up"

[tasks.down]
description = "Stop sovereign pitchfork daemons"
run = "./mise/tasks/down"

[tasks.health]
description = "HTTP health probes for SSOT ports"
run = "./mise/tasks/health"

[tasks.status]
description = "pitchfork list + 25xxx listeners"
run = "./mise/tasks/status"

[tasks.up-obs]
description = "Start prometheus + grafana"
run = "pitchfork start --group obs"

[tasks.up-all]
description = "Start core + obs + funnel groups"
run = "pitchfork start --group all"

[tasks.tui]
description = "pitchfork interactive TUI"
run = "pitchfork tui"

[tasks.ast-grep-scan]
description = "Scan sovereign src with project ast-grep rule pack"
run = "ast-grep scan -c {{config_root}}/ast-grep-rules/sgconfig.yml {{config_root}}/src/"

[tasks.doctor]
description = "Verify pitchfork + ports + hot-reload core + ast-grep"
run = "./mise/tasks/doctor"

[tasks.e2e-agent-stack]
description = "E2E: llama-swap :25100 + sovereign-router :25104 + GHAS + zed settings + ast-grep"
run = "bun run {{config_root}}/scripts/e2e-agent-stack.ts"

[tasks.ghas-golden]
description = "GHAS golden overlap vs Blackbird UI index"
run = "bun run /home/toxic/github-advanced-search-mcp/scripts/compare-to-ui.mjs"

[tasks.restart-llama]
description = "Restart llama-swap daemon"
run = "pitchfork restart llama-swap"

[tasks.restart-rust-web]
description = "Restart rust-web daemon"
run = "pitchfork restart rust-web"

[tasks.e2e-full-stack]
description = "HTTP e2e every core+obs surface (scripts/e2e-full-stack.ts)"
run = "E2E_OUT={{config_root}}/.state/e2e-http.jsonl bun run {{config_root}}/scripts/e2e-full-stack.ts"

[tasks.mcp-gateway]
description = "Start Sovereign MCP Gateway (trust boundary in front of upstream MCP servers)"
run = "bun --hot run {{config_root}}/tools/sovereign-router/sovereign-mcp-gateway/gateway.ts"
