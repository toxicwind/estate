# ─── Utilities ───
svc-check = """bash -c 'FAILED=0; tcp_only=" redis kafka dnsmasq "; for entry in mesh=25127 mesh-hub=25115 herd=25100 coyote=25143 yote=25102 search-api=25112 search-ui=25114 axiom=25103 rust-web=25201 hf-downloader=25106 null-g-proxy=25107 kimi-audit-dash=25116 mcp-gateway=25104 byte-vision=25121 hindsight=25117 tau-code=25145 kimi-code=25126 nginx=62200 qdrant=25133 redis=25199 kafka=25144 dnsmasq=53 prometheus=25105 grafana=25110 flock=25193 buildsrv=25148 matter-server=5580 tau=25111; do svc=${entry%%=*}; port=${entry##*=}; if [ -n "${port}" ]; then case "$tcp_only" in *" $svc "*) if /home/toxic/sovereign/bin/tcp-probe "$port" >/dev/null 2>&1; then echo "PASS :${port} (${svc})"; else echo "FAIL :${port} (${svc})"; FAILED=1; fi;; *) if ! curl -sf -m 2 "http://127.0.0.1:${port}/health" >/dev/null 2>&1 && ! curl -sf -m 2 "http://127.0.0.1:${port}/" >/dev/null 2>&1; then echo "FAIL :${port} (${svc})"; FAILED=1; else echo "PASS :${port} (${svc})"; fi;; esac; fi; done; exit $FAILED'"""
open-uis = "bun run scripts/open-web-uis.ts"
"open-uis-all" = "bun run scripts/open-web-uis.ts --all"
"list-uis" = "bun run scripts/open-web-uis.ts --list"
# ─── Developer & Terminal Tools (on-demand) ───
zed = "zed ."
zellij = "zellij"
ttyd = "ttyd -p 25137 bash"
sshx = "sshx"

# ─── Nuvio Platform (webOS app) ───
nv-build = { run = "cd tools/nuvio-platform && npm run build:webos", dir = "tools/nuvio-platform" }
nv-test = { run = "cd tools/nuvio-platform && npm run test:coverage", dir = "tools/nuvio-platform" }
nv-package = { run = "cd tools/nuvio-platform && npm run package:webos", dir = "tools/nuvio-platform", depends = ["nv-build"] }
health-notify = "mise run svc-check || curl -s -X POST -d Stack_degraded https://ntfy.sh/sovereign-alerts"
nv-dev = { run = "cd tools/nuvio-platform && npm run dev", dir = "tools/nuvio-platform" }

# ─── Test suite ───
test = "bun test"
"test-cov" = "bun run test:cov"
"test-gateway" = "bun run test:gateway:cov"
"test-models" = "bun run test:best-models"


[tasks."up-squawk"]
description = "Start squawk-ws and squawk-feed (fleet messaging, now under mesh)"
depends = ["up-squawk-ws", "up-squawk-feed"]

[tasks."down-squawk"]
description = "Stop squawk-ws and squawk-feed"
depends = ["down-squawk-ws", "down-squawk-feed"]