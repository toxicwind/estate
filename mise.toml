[env]
SOVEREIGN_ROOT = "{{ config_root }}"
_.path = [
    "{{ config_root }}/bin",
    "{{ config_root }}/stack",
    "/home/toxic/.bun/bin"
]
_.file = "{{ env.HOME }}/.secrets"

[tasks.up]
description = "Sovereign stack: core + yote + rust-dash"
run = "{{ config_root }}/stack/up.sh -D sovereign"

[tasks.up-core]
description = "Core only: llama-swap, openfang, prometheus, caddy"
run = "{{ config_root }}/stack/up.sh -D core"

[tasks.up-full]
description = "Everything: sovereign + landing, watchdog, hf-downloader"
run = "{{ config_root }}/stack/up.sh -D full"

[tasks.down]
description = "Stop stack"
run = "{{ config_root }}/stack/down.sh"

[tasks.status]
description = "Process list or port health"
run = "{{ config_root }}/bin/sovereign-stack.sh status"

[tasks.health]
description = "Port health matrix"
run = "{{ config_root }}/stack/health.sh"

[tasks.build-compose]
description = "Flatten stack/modules → process-compose.yaml"
run = "{{ config_root }}/stack/build-compose.sh"

[tasks.kill-devenv]
description = "Tombstone: kill stale devenv/nix daemons"
run = "{{ config_root }}/bin/kill-devenv.sh"

[tasks.consolidate]
description = "Archive stale whitelist config duplicates"
run = "{{ config_root }}/bin/consolidate-known.sh"
[settings]
env_file = ".env.local"

