[env]
SOVEREIGN_ROOT = "{{ config_root }}"
_.path = ["{{ config_root }}/bin", "{{ config_root }}/stack", "/home/toxic/.bun/bin"]
_.file = "{{ env.HOME }}/.secrets"

[tasks.up]
description = "Start full stack (modular process-compose)"
run = "./stack/up.sh -D full"

[tasks.up-core]
description = "Core: llama-swap, openfang, prometheus, caddy"
run = "./stack/up.sh -D core"

[tasks.down]
description = "Stop stack"
run = "./stack/down.sh"

[tasks.status]
description = "Process list or port health"
run = "./bin/sovereign-stack.sh status"

[tasks.health]
description = "Port health matrix"
run = "./stack/health.sh"

[tasks.build-compose]
description = "Flatten stack/modules → process-compose.yaml"
run = "./stack/build-compose.sh"

[tasks.kill-devenv]
description = "Tombstone: kill stale devenv/nix daemons"
run = "./bin/kill-devenv.sh"

[tasks.consolidate]
description = "Archive stale whitelist config duplicates"
run = "./bin/consolidate-known.sh"