# ESTATE MISE CONFIG — hand-edited root. NOT generated.
#
# The retired scripts/generate.ts used to overwrite this file wholesale and
# destroy native additions (coyote env, tau path fix, dnsmasq, hand-tuned
# readiness, every explanatory comment). It has been gone since 2026-09-14;
# its sources under src/generators/ are deleted rather than left as a trap.
#
# What lives where:
#   mise.toml          this file — the only config mise reads from the root
#   mise/conf.d/*.toml fragments, loaded alphabetically (mise's own convention)
#   mise/tasks/<name>  one executable file per task
#   config/ports.env   the numeric port SSOT, injected from [env] below
#   config/rhodochrosite-ssot/route.env  non-secret rhodochrosite route (port, model, base URL)
#
# Keep mise tasks as hand-authored project workflows. Pitchfork owns daemon
# lifecycle directly; do not mirror its start/stop/restart/health subcommands.
#
# 2026-10-18 severe cutover: kappa everywhere. The kilo-build task and every
# kilo-named reference are gone — kappa-build is the one canonical build task.
# Also: mise 2026.10.12 renamed task `cmd` to `run` and dropped
# [task_config.cache] `ttl` (valid fields: enabled, audit, env, command_inputs);
# remote cache TTL is now owned by the server side (mbx-cache :25148;
# "flicker" was a ghost name — no such product exists).
# ============================================================================

[env]
# Ports are injected estate-wide. See mise/conf.d/10-env.toml for why nothing
# else declares a *_PORT. route.env carries the rhodochrosite model and base URL.
_.file = ["config/ports.env", "config/rhodochrosite-ssot/route.env"]

# Forge remote build cache — first-class nativelink-backed cache at :25148
# (:25148 IS mbx-cache, product ranch/products/mr-boxington-cache, Rust REAPI
# cache. Earlier "flicker" attribution was wrong — no flicker product exists).
MISE_CACHE_REMOTE_URL = "http://127.0.0.1:25148"
BUN_BUILD_REMOTE_CACHE = "http://127.0.0.1:25148"

[task_config.cache]
# Remote build cache via the mbx-cache daemon (nativelink RE API,
# product: ranch/products/mr-boxington-cache).
# `ttl` was removed 2026-10-18: mise 2026.10.12 no longer accepts it.
enabled = true

# Forge build tasks — first-class build pipeline
[tasks.kappa-build]
run = """
bun run --cwd /home/toxic/pens/olympus/products/kappa/kappa-code make --single --skip-install
"""
description = "Build kappa binary via forge remote cache"
dir = "/home/toxic/pens/olympus/products/kappa/kappa-code"
sources = ["package.json", "bun.lock", "packages/cli/script/build.ts", "packages/cli/src/**/*.ts", "packages/kappa-indexing/src/**/*.ts"]
outputs = ["packages/cli/dist/@kappacode/cli-linux-x64/bin/kappa"]

# Full user-TDD lane (2026-10-30): edit -> tests -> rebuild, all automatic.
# `mise watch kappa-tdd` re-runs whenever any kappa source file changes;
# the build leg rides the forge remote cache (mbx-cache :25148 /
# MISE_CACHE_REMOTE_URL) so unchanged outputs are never recomputed.
[tasks.kappa-tdd]
run = """
cd /home/toxic/pens/olympus/products/kappa/kappa-code/packages/cli && bun test --timeout 30000 2>/home/toxic/tmp/kappa-tdd-test.log
bun run --cwd /home/toxic/pens/olympus/products/kappa/kappa-code make --single --skip-install
pitchfork restart kappa-acp 2>/dev/null || true
"""
description = "User-TDD loop: kappa tests then forge-cached rebuild"
dir = "/home/toxic/pens/olympus/products/kappa/kappa-code"
sources = ["packages/cli/src/**/*.ts", "packages/cli/test/**/*.ts", "packages/kappa-indexing/src/**/*.ts"]
outputs = ["packages/cli/dist/@kappacode/cli-linux-x64/bin/kappa"]

# tau TDD lane (2026-11-05): edit -> scoped tests -> binary rebuild -> ACP restart.
# Mirrors kappa-tdd. Scopes to the coding-agent TS suite (the rs/py lanes are
# slow and not touched by agent-loop changes). The restart leg reloads any
# ACP-serving tau process on the fresh binary; interactive TUI sessions are
# user-owned and pick the binary up on their next natural restart.
[tasks.tau-tdd]
run = """
cd /home/toxic/pens/olympus/products/tau && bun test packages/coding-agent/test/ttst.test.ts packages/coding-agent/test/session-code-mode.test.ts 2>/home/toxic/tmp/tau-tdd-test.log
bun run --cwd packages/coding-agent build
pitchfork restart kappa-acp 2>/dev/null || true
"""
description = "User-TDD loop: tau tests then binary rebuild + ACP restart"
dir = "/home/toxic/pens/olympus/products/tau"
sources = ["packages/coding-agent/src/**/*.ts", "packages/coding-agent/test/**/*.ts"]
outputs = ["packages/coding-agent/dist/tau"]

# DelendAI — first-class maximal Bun scaffold / MCP monorepo (fork 2026-10-20).
# Full gates + CLI; usable as the estate's scaffold/agent-runtime reference.
# Canonical source is CORRAL (pens/barn/corral/delendai), the single home for
# all DelendAI code. The former ranch/borrowed/delendai placeholder is empty and
# deprecated — never point delend tasks at it.
[tasks.delendai-install]
run = "bun install --cwd /home/toxic/pens/ranch/range/apps/delendai-control-plane"
description = "Install DelendAI control-plane deps (bun)"

[tasks.delendai-validate]
run = "bun run --cwd /home/toxic/pens/ranch/range/apps/delendai-control-plane validate -- --ci"
description = "Run DelendAI control-plane gate (typecheck + lint + tests)"

[tasks.delendai-cli]
run = "bun run --cwd /home/toxic/pens/ranch/range/apps/delendai-control-plane cli -- $@"
description = "Run the DelendAI CLI (delendai <cmd>)"

[tasks.delendai-scaffold]
run = "bun run --cwd /home/toxic/pens/ergasterion/eidos apply:scaffold -- $@"
description = "Apply the maximal Bun scaffold (eidos, ex-bun-scaffold) across estate projects"

[tasks.mimetite-codegen]
run = "bun run build"
dir = "/home/toxic/pens/geode/products/mimetite"
description = "Regenerate + live-sync mimetite provider catalog (5 artifacts + tau/kappa installed slices). Rerunnable."

# rhodochrosite hot-reload dev lane (2026-11-08): `mise watch rhodo:dev` rebuilds
# the release binary on any Rust source change and restarts the pitchfork daemon
# so :25193 serves the fresh build. Mirrors kappa-tdd/tau-tdd. Uses release-fast
# profile (thin LTO, 8 units) per anomaly #97.
[tasks.rhodo-dev]
run = """
cd /home/toxic/pens/geode/products/rhodochrosite/proxy && cargo build --release --profile release-fast
pitchfork restart geode/rhodochrosite 2>/dev/null || true
"""
description = "Hot-reload rhodochrosite: rebuild release-fast + restart :25193 daemon"
dir = "/home/toxic/pens/geode/products/rhodochrosite/proxy"
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/rhodochrosite"]

# mimetite hot-reload dev lane (2026-11-08): `mise watch mimetite:dev` rebuilds
# the Bun dist + typecheck on any src change. mimetite is a Bun/TS product; the
# daemon serving it is restarted so consumers pick up the fresh build.
[tasks.mimetite-dev]
run = """
bun run build
pitchfork restart geode/mimetite 2>/dev/null || true
"""
description = "Hot-reload mimetite: build dist + typecheck + restart daemon"
dir = "/home/toxic/pens/geode/products/mimetite"
sources = ["src/**/*.ts", "package.json"]
outputs = ["dist/index.js"]
