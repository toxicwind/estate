min_version = "2026.6.0"
[tools]
process-compose = "latest"
python = "3.12"
bun = "latest"
node = "22"
jq = "latest"

[env]
_.file = [".env.local", "/home/toxic/.secrets", "/home/toxic/.openfang/secrets.env"]
_.path = ["{{ config_root }}/yote/.venv/bin","{{ config_root }}/bin","{{ env.HOME }}/.local/bin","{{ env.HOME }}/.bun/bin"]

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[tasks.up-core]
description = "core: llama-swap + openfang + prometheus + null-g"
run = "./mise/tasks/up-core"
[tasks.up]
description = "sovereign: core + yote + rust-dash"
depends = ["build-compose"]
run = "./mise/tasks/up"
[tasks.up-full]
description = "full: sovereign + hf-downloader"
depends = ["build-compose"]
run = "./mise/tasks/up-full"
[tasks.down]
run = "./mise/tasks/down"
[tasks.health]
run = "./mise/tasks/health"
[tasks.status]
run = "./mise/tasks/status"
[tasks.build-compose]
sources = ["stack/base.yaml","stack/modules/*.yaml"]
outputs = ["process-compose.yaml"]
run = "./mise/tasks/build-compose"
