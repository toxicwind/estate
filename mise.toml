# Sovereign Stack — mise.toml (Clean + Script-based)

[env]
SOVEREIGN_HOME = "/home/toxic/sovereign"
MODEL_PATH = "/home/toxic/models/Qwen3.6-27B-Heretic-UD/heretic-UD-27B-Q5_K_XL.gguf"

[tasks.llama-server]
description = "Start ik_llama server"
run = """
mkdir -p "$SOVEREIGN_HOME/logs"
"$SOVEREIGN_HOME/bin/start-llama.sh" > "$SOVEREIGN_HOME/logs/llama-server.log" 2>&1
"""

[tasks.nfcot-proxy]
description = "Start NF-CoT proxy (v20 aware)"
depends = ["llama-server"]
run = """
mkdir -p "$SOVEREIGN_HOME/logs"
"$SOVEREIGN_HOME/bin/start-nfcot-proxy.sh" > "$SOVEREIGN_HOME/logs/nfcot_proxy.log" 2>&1
"""

[tasks.openfang]
description = "Start Openfang"
depends = ["nfcot-proxy"]
env = { TELEGRAM_BOT_TOKEN = "8932201107:AAEZ7I2NBcGR_CcJvT9IjKwbZ8honLNc_zM", OPENFANG_LISTEN = "127.0.0.1:25004" }
run = """
mkdir -p "$SOVEREIGN_HOME/logs"
echo "openfang: waiting for nfcot_proxy..."
for i in {1..40}; do if curl -sf http://127.0.0.1:25008/v1/models >/dev/null 2>&1; then break; fi; sleep 1; done
exec /home/toxic/.openfang/bin/openfang start > "$SOVEREIGN_HOME/logs/openfang.log" 2>&1
"""

[tasks.watchdog]
description = "Start watchdog"
depends = ["llama-server"]
run = """
mkdir -p "$SOVEREIGN_HOME/logs"
echo "watchdog: waiting for llama-server..."
for i in {1..40}; do if curl -sf http://127.0.0.1:25001/v1/models >/dev/null 2>&1; then break; fi; sleep 1; done
exec python3 "$SOVEREIGN_HOME/modules/sovereign_watchdog.py" > "$SOVEREIGN_HOME/logs/watchdog.log" 2>&1
"""

[tasks.yote-telegram]
description = "Start Yote Telegram bot"
depends = ["nfcot-proxy"]
env = { TELEGRAM_BOT_TOKEN = "8932201107:AAEZ7I2NBcGR_CcJvT9IjKwbZ8honLNc_zM", TELEGRAM_ALLOWED_USERS = "716302190,13036673831" }
run = """
mkdir -p "$SOVEREIGN_HOME/logs"
echo "yote-telegram: waiting for nfcot_proxy..."
for i in {1..40}; do if curl -sf http://127.0.0.1:25008/v1/models >/dev/null 2>&1; then break; fi; sleep 1; done
exec python3 "$SOVEREIGN_HOME/modules/yote_telegram.py" > "$SOVEREIGN_HOME/logs/yote_telegram.log" 2>&1
"""

[tasks.yote-daemon]
description = "Start Yote Daemon"
depends = ["llama-server"]
env = { PYTHONPATH = "/home/toxic/sovereign" }
run = """
mkdir -p "$SOVEREIGN_HOME/logs"
echo "yote-daemon: waiting for llama-server..."
for i in {1..40}; do if curl -sf http://127.0.0.1:25001/v1/models >/dev/null 2>&1; then break; fi; sleep 1; done
exec python3 -m yote.daemon --port 25042 > "$SOVEREIGN_HOME/logs/yote-daemon.log" 2>&1
"""

[tasks.start]
description = "Start full Sovereign stack"
run = "process-compose -t=false -f \"$SOVEREIGN_HOME/process-compose.yaml\" -U"
