min_version = "2026.6.0"
[tools]
process-compose = "latest"
python = "3.12"
bun = "latest"
node = "22"
[env]
LLAMA_SWAP_PORT = "25100"
NULL_G_PORT = "8787"
PC_PORT = "25201"
PATH = "{{config_root}}/yote/.venv/bin:{{env.HOME}}/.local/bin:{{env.HOME}}/.bun/bin:{{env.PATH}}"
[tasks.up]
run = "process-compose --port $PC_PORT --config process-compose.yaml up --detached -t=false && echo \"up on pc:$PC_PORT llama:$LLAMA_SWAP_PORT nullg:$NULL_G_PORT\""
[tasks.down]
run = "process-compose --port $PC_PORT --config process-compose.yaml down 2>/dev/null; pkill -f process-compose; true"
[tasks.status]
run = "process-compose --port $PC_PORT --config process-compose.yaml process list; ss -ltnp | grep -E \"$LLAMA_SWAP_PORT|$NULL_G_PORT|$PC_PORT\""
[tasks.models]
run = "curl -sf http://127.0.0.1:$LLAMA_SWAP_PORT/v1/models | jq -r '.data[].id' | sort"
