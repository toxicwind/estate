# Sovereign mise config - tools + tasks + env
[tools]
python = "3.12.13"
node = "22.12.0"
bun = "1.1.38"
rust = "1.82.0"
go = "1.23.1"
pitchfork = "2.16.0"

[env]
# Source ports.env for all tasks
_.file = "config/ports.env"

[tasks]
# Core daemons via pitchfork
up = "pitchfork --config pitchfork.toml up --group core"
down = "pitchfork --config pitchfork.toml down"
health = "pitchfork --config pitchfork.toml list"
status = "pitchfork --config pitchfork.toml list"
logs = "pitchfork --config pitchfork.toml logs"

# Individual service control
"up-llama-swap" = "pitchfork --config pitchfork.toml up llama-swap"
"up-prometheus" = "pitchfork --config pitchfork.toml up prometheus"
"up-grafana" = "pitchfork --config pitchfork.toml up grafana"
"up-byte-vision" = "pitchfork --config pitchfork.toml up byte-vision"
"up-byte-vision-proxy" = "pitchfork --config pitchfork.toml up byte-vision-proxy"
"up-qdrant" = "pitchfork --config pitchfork.toml up qdrant"
"up-redis" = "pitchfork --config pitchfork.toml up redis"
"up-mcg" = "pitchfork --config pitchfork.toml up mcp-gateway"

down:llama-swap = "pitchfork --config pitchfork.toml down llama-swap"
down:prometheus = "pitchfork --config pitchfork.toml down prometheus"
down:grafana = "pitchfork --config pitchfork.toml down grafana"
down:byte-vision = "pitchfork --config pitchfork.toml down byte-vision"
down:byte-vision-proxy = "pitchfork --config pitchfork.toml down byte-vision-proxy"
down:qdrant = "pitchfork --config pitchfork.toml down qdrant"
down:redis = "pitchfork --config pitchfork.toml down redis"
down:mcg = "pitchfork --config pitchfork.toml down mcp-gateway"

# Health checks
health:llama-swap = "curl -sf http://127.0.0.1:25100/health"
health:prometheus = "curl -sf http://127.0.0.1:25105/-/healthy"
health:grafana = "curl -sf http://127.0.0.1:25110/api/health"
health:byte-vision = "curl -sf http://127.0.0.1:25121/health"
health:qdrant = "curl -sf http://127.0.0.1:6333/"
health:mcg = "curl -sf http://127.0.0.1:25120/health"
health:mcg:ui = "curl -sf http://127.0.0.1:25120/ui"

# Test suite
test = "bun test"
test:cov = "bun run test:cov"
test:gateway = "bun run test:gateway:cov"
test:models = "bun run test:best-models"

# Audit
audit = "python3 audit_fix.py"
