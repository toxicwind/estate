# ─── Utilities ───
ports = "pitchfork daemons"
svc-check = """bash -c 'for svc in llama-swap qdrant redis mcpproxy ghas-api ghas-mcp prometheus grafana openfang rust-web hf-downloader ghas-frontend pi-web-dashboard beellama-cpp ik-llama-cpp llama-cpp-turboquant pi-agent kimi-code mcpproxy-go antigravity-gateway zed-editor zedra-host sovereign-github-search system-monitor-mcp wayland-mcp mise antigravity-cli bun-runtime; do port=$(grep "^${svc}=" config/ports.env | cut -d= -f2); if [ -n "$port" ]; then curl -sf -m 2 "http://127.0.0.1:${port}/health" >/dev/null 2>&1 || curl -sf -m 2 "http://127.0.0.1:${port}/-/healthy" >/dev/null 2>&1 || curl -sf -m 2 "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1 && echo "✅ :${port} (${svc})" || echo "❌ :${port} (${svc})"; else echo "⚠️ :${svc} (no port)"; fi; done' """

# ─── Nuvio Platform (webOS app) ───
nv-build = { run = "cd tools/nuvio-platform && npm run build:webos", dir = "tools/nuvio-platform" }
nv-test = { run = "cd tools/nuvio-platform && npm run test:coverage", dir = "tools/nuvio-platform" }
nv-package = { run = "cd tools/nuvio-platform && npm run package:webos", dir = "tools/nuvio-platform", depends = ["nv-build"] }
nv-deploy = { run = "cd tools/nuvio-platform && node scripts/ares-install-webos.mjs", dir = "tools/nuvio-platform", depends = ["nv-package"] }
nv-dev = { run = "cd tools/nuvio-platform && npm run dev", dir = "tools/nuvio-platform" }

# ─── Test suite ───
