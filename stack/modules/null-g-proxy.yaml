processes:
  null-g-proxy:
    command: bash -c 'bun run src/null-g-proxy.ts || node dist/null-g-proxy.js || bun run src/null_g_proxy.ts'
    working_dir: /home/toxic/sovereign
    environment:
      - SOVEREIGN_ROOT=/home/toxic/sovereign
      - NULL_G_PORT=8787
      - PORT=8787
    availability:
      restart: on_failure
      backoff_seconds: 2
      max_restarts: 10
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8787
        path: /health
      initial_delay_seconds: 2
      period_seconds: 5
    log_location: /home/toxic/sovereign/.state/logs/null-g-proxy.log
