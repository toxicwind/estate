processes:
  hf-downloader:
    command: /home/toxic/.bun/bin/bun run /home/toxic/sovereign/src/services/hf_downloader.ts
    working_dir: /home/toxic/sovereign
    environment:
    - HF_DOWNLOADER_PORT=${HF_DOWNLOADER_PORT}
    - SOVEREIGN_ROOT=${SOVEREIGN_ROOT}
    - HF_HOME=${HF_HOME:-/home/toxic/.cache/huggingface}
    - HF_TOKEN=${HF_TOKEN}
    availability:
      restart: on_failure
      backoff_seconds: 5
      max_restarts: 8
    log_location: .state/logs/hf-downloader.log
