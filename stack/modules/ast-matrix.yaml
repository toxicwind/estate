processes:
  # OpenAI-compatible matrix for Zed (api_url http://127.0.0.1:25104/v1)
  # Port SSOT: AST_MATRIX_PORT in .env.local (default 25104)
  # bun --hot: reload on tools/ast-matrix/** edits
  ast-matrix:
    command: /home/toxic/.bun/bin/bun --hot run tools/ast-matrix/sovereign-ast-matrix-ts/router.ts
    working_dir: .
    environment:
      - SOVEREIGN_ROOT=/home/toxic/sovereign
      - "SOVEREIGN_PORT=${AST_MATRIX_PORT}"
      - "AST_MATRIX_PORT=${AST_MATRIX_PORT}"
      - SOVEREIGN_DB=/home/toxic/sovereign/data/ast_matrix.db
      - "SOVEREIGN_ROUTER_API_KEY=${SOVEREIGN_ROUTER_API_KEY}"
      - "NVIDIA_API_KEY=${NVIDIA_API_KEY}"
      - "NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}"
      - "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
      - "GROQ_API_KEY=${GROQ_API_KEY}"
      - "CEREBRAS_API_KEY=${CEREBRAS_API_KEY}"
      - "GOOGLE_API_KEY=${GOOGLE_API_KEY}"
      - "MISTRAL_API_KEY=${MISTRAL_API_KEY}"
      - "LLM_PROXY_URL=${LLM_PROXY_URL}"
      - "LLM_BASE_URL=${LLM_BASE_URL}"
    availability:
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 8
    log_location: ./.state/logs/ast-matrix.log
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: "${AST_MATRIX_PORT}"
        path: /health
      initial_delay_seconds: 2
      period_seconds: 5
