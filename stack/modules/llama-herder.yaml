processes:
  llama-herder:
    command: "/home/toxic/sovereign/stack/services/llama-herder.sh"
    working_dir: "/home/toxic/sovereign"
    environment:
      - "SOVEREIGN_ROOT=/home/toxic/sovereign"
      # listen 28080 is outside backend range 25001-25027 (startPort + 26 models) - fixed old bind collision where listen == startPort
      # backend port range once config.yaml grew to 26 model entries.
      # Must match llama-herder.sh's PORT default AND the readiness_probe
      # port below -- all three have to agree or the probe checks a port
      # nothing is listening on.
      - "LLAMA_HERDER=28080"
    availability:
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 12
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 28080
        path: /health
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 12
    log_location: "/home/toxic/sovereign/.state/logs/llama-herder.log"
