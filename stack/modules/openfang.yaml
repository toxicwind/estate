processes:
  openfang:
    command: "/home/toxic/.openfang/bin/openfang start"
    working_dir: "/home/toxic/sovereign"
    availability:
      restart: always
      backoff_seconds: 5
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25004
        path: /api/health
        scheme: http
      initial_delay_seconds: 15
      period_seconds: 5
      timeout_seconds: 3
      failure_threshold: 3
    log_location: "/home/toxic/sovereign/.state/logs/openfang.log"
