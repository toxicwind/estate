processes:
  openfang:
    command: /home/toxic/.bun/bin/bun run src/services/openfang.ts
    working_dir: /home/toxic/sovereign
    environment:
    - OPENFANG_PORT=${OPENFANG_PORT}
    availability:
      restart: on_failure
      backoff_seconds: 3
      max_restarts: 8
    log_location: ./.state/logs/openfang.log
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25103
        path: /api/health
      initial_delay_seconds: 3
      period_seconds: 5
