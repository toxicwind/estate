processes:
  openfang:
    command: "/home/toxic/.bun/bin/bun run src/services/openfang.ts"
    working_dir: "/home/toxic/sovereign"
    environment:
      - "OPENFANG_PORT=${OPENFANG_PORT}"
    availability:
      restart: on_failure
      max_restarts: 5
      backoff_seconds: 5
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${OPENFANG_PORT}
        path: /api/health
        scheme: http
      initial_delay_seconds: 15
      period_seconds: 5
      timeout_seconds: 3
      failure_threshold: 3
    log_location: ".state/logs/openfang.log"
