processes:
  openfang:
    command: /home/toxic/.bun/bin/bun run src/services/openfang.ts
    working_dir: /home/toxic/sovereign
    environment:
    - OPENFANG_PORT=${OPENFANG_PORT}
    availability:
      restart: on_failure
      max_restarts: 5
      backoff_seconds: 5
    log_location: .state/logs/openfang.log
