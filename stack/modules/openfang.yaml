processes:
  openfang:
    command: "/home/toxic/.bun/bin/bun run src/openfang.ts"
    working_dir: "/home/toxic/sovereign"
    environment:
      - "SOVEREIGN_ROOT=/home/toxic/sovereign"
      - "OPENFANG_PORT=25004"
      - "TELEGRAM_BOT_TOKEN="
      - "TELEGRAM_BOT_TOKEN_OVERLORD="
    availability:
      restart: on_failure
      max_restarts: 10
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 25004
        path: /api/health
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 10
    log_location: "/home/toxic/sovereign/.state/logs/openfang.log"
