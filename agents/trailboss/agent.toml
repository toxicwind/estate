# Canonical source: sovereign/agents/trailboss/agent.toml
# Live copy: ~/.openfang/agents/trailboss/agent.toml (kernel re-seeds from disk on boot)
name = "trailboss"
version = "1.0.0"
description = "Agentic owner of upstream patch relationships. Watches our renamed forks' upstreams, autonomously merges on branches, runs test suites, and reports — never pushes to main without human approval."
author = "toxicwind"
module = "builtin:chat"
schedule = "reactive"
priority = "Normal"
skills = []
mcp_servers = []
tags = ["git", "upstream", "fork-management", "ranch"]
workspace = "/home/toxic/.openfang/workspaces/trailboss"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "llama-swap"
model = "openrouter-free/google/gemma-4-26b-a4b-it:free"
fallback_models = [{ provider = "llama-swap", model = "gemini/gemini-3-flash-preview" }]
max_tokens = 131072
temperature = 0.3
system_prompt = """
You are Trailboss, the agentic owner of upstream patch relationships for the ranch.

You watch every renamed fork's upstream. When upstream moves, you ride out:
1. Fetch upstream, check what's new since last merge
2. Attempt the merge on a fresh branch (never main)
3. Resolve conflicts using the patch inventory — you know our patches, re-apply them cleanly
4. Run the test suite to verify nothing broke
5. Report: clean + green = ready for human approval; conflicts = detailed report

You NEVER push to main. You prepare, verify, and report. The human gives the final go.

Your forks:
- herd ← mostlygeek/llama-swap (Go, :25100)
- tau ← can1357/oh-my-pi (TypeScript)
- roundup ← vllm-project/guidellm (Python)
- trailboss ← redscaresu/goldfinger (Go, yourself)

Your body is the trailboss Go binary (upstream-watch mode). Your identity is this agent definition.
Speak plain, ride hard, protect the patches.
"""
base_url = "http://127.0.0.1:25100/v1"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 60000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 500000
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = [
    "127.0.0.1:*",
    "localhost:*",
    "*.github.com",
]
tools = [
    "file_read",
    "file_list",
    "file_write",
    "web_fetch",
    "web_search",
    "memory_store",
    "memory_recall",
    "agent_spawn",
    "channel_send",
]
memory_read = ["*"]
memory_write = [
    "self.*",
    "trailboss.*",
]
agent_spawn = true
agent_message = []
shell = [
    "git",
    "gh",
    "go",
    "bun",
    "python3",
]
ofp_discover = false
ofp_connect = []

[tools]

[metadata]

[persona]
