name = "coyote"
version = "3.1.0"
description = "Autonomous agent inference engine with sigil-driven workflow orchestration. First-class sovereign service that routes through the AST matrix (llama-swap :25100) and integrates with Yote messaging (:25102)."
author = "toxicwind"
module = "builtin:chat"
schedule = "reactive"
fallback_models = []
priority = "Normal"
skills = []
mcp_servers = []
tags = []
workspace = "/home/toxic/.openfang/workspaces/coyote"
generate_identity_files = true
tool_allowlist = []
tool_blocklist = []
cache_context = false

[model]
provider = "llama-swap"
model = "nex-agi/nex-n2.5-mini:free"
max_tokens = 131072
temperature = 0.7
system_prompt = """
You are Coyote, an autonomous agent inference engine operating within the Sovereign ecosystem.

Your primary function is to execute complex, multi-step tasks with minimal human intervention. You communicate via sigils:
- [[OPHEL::PROCEED]] — Task incomplete, continue to next step
- [[OPHEL::HALT]] — Task complete, stop execution
- [[OPHEL::ROADMAP]] — Output a numbered list of steps, then proceed through them
- [[OPHEL::SHORT]] — Response was too short, expand

You have access to:
- The herd router (llama-swap :25100). Routing doctrine: RANKING > FREE-ON-PROVIDER > PAY. Kimi routes are never defaults -- they exist only for maximal free-Kimi routing.
- Yote messaging gateway (:25102) for Telegram/Discord/Signal
- GHAS MCP tools (:25113) for GitHub Advanced Search
- Sovereign mesh hub (:25115) for distributed agent coordination
- Qdrant vector DB (:25133) for memory retrieval

When given a task:
1. Analyze the goal
2. Generate a roadmap if multi-step
3. Execute each step fully
4. End with [[OPHEL::PROCEED]] or [[OPHEL::HALT]]

You can spawn child agents, trigger workflows, and use all available tools."""
base_url = "http://127.0.0.1:25100/v1"

[resources]
max_memory_bytes = 268435456
max_cpu_time_ms = 30000
max_tool_calls_per_minute = 60
max_llm_tokens_per_hour = 500000
max_network_bytes_per_hour = 104857600
max_cost_per_hour_usd = 0.0
max_cost_per_day_usd = 0.0
max_cost_per_month_usd = 0.0

[capabilities]
network = [
    "127.0.0.1:*",
    "localhost:*",
    "*.msh.team",
    "*.github.com",
    "*.huggingface.co",
]
tools = [
    "file_read",
    "file_list",
    "file_write",
    "web_fetch",
    "web_search",
    "memory_store",
    "memory_recall",
    "agent_spawn",
    "workflow_run",
    "mcp_call",
    "channel_send",
]
memory_read = ["*"]
memory_write = [
    "self.*",
    "coyote.*",
]
agent_spawn = true
agent_message = []
shell = []
ofp_discover = false
ofp_connect = []

[tools]

[metadata]

[persona]
