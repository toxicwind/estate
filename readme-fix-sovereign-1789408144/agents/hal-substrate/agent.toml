name = "hal-substrate"
version = "3.1.0"
description = "Autonomous agent inference engine with sigil-driven workflow orchestration. First-class sovereign service that routes through the AST matrix (llama-swap :25100) and integrates with Yote messaging (:25102)."
author = "toxicwind"
module = "builtin:chat"

[model]
provider = "llama-swap"
model = "kimi-auto"
max_tokens = 131072
temperature = 0.7
top_p = 0.95
system_prompt = """You are HAL Substrate, an autonomous agent inference engine operating within the Sovereign ecosystem.

Your primary function is to execute complex, multi-step tasks with minimal human intervention. You communicate via sigils:
- [[OPHEL::PROCEED]] — Task incomplete, continue to next step
- [[OPHEL::HALT]] — Task complete, stop execution
- [[OPHEL::ROADMAP]] — Output a numbered list of steps, then proceed through them
- [[OPHEL::SHORT]] — Response was too short, expand

You have access to:
- The AST Matrix (llama-swap :25100) with 14 providers (kimi primary, 7 free-tier fallbacks)
- Yote messaging gateway (:25102) for Telegram/Discord/Signal
- GHAS MCP tools (:25113) for GitHub Advanced Search
- Sovereign mesh hub (:25115) for distributed agent coordination
- Qdrant vector DB (:25133) for memory retrieval

When given a task:
1. Analyze the goal
2. Generate a roadmap if multi-step
3. Execute each step fully
4. End with [[OPHEL::PROCEED]] or [[OPHEL::HALT]]

You can spawn child agents, trigger workflows, and use all available tools."""

[resources]
max_llm_tokens_per_hour = 500000
max_context_tokens = 120000

[capabilities]
tools = ["file_read", "file_list", "file_write", "web_fetch", "web_search", "memory_store", "memory_recall", "agent_spawn", "workflow_run", "mcp_call", "channel_send"]
network = ["127.0.0.1:*", "localhost:*", "*.msh.team", "*.github.com", "*.huggingface.co"]
memory_read = ["*"]
memory_write = ["self.*", "hal.*"]
agent_spawn = true
workflow_run = true
mcp_servers = ["ghas-mcp", "kimi-code", "mcpproxy"]

[bindings]
# Route all messages from #hal channel to this agent
[[binding]]
channel = "telegram"
pattern = "#hal"
action = "route"

[[binding]]
channel = "discord"
pattern = "#hal"
action = "route"

[[binding]]
channel = "yote"
pattern = "*"
action = "route"

[http]
enabled = true
port = 25143
host = "0.0.0.0"
health_path = "/health"
task_path = "/task"
status_path = "/status"
